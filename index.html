<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Glidewell Dental Arcade — CROWN RUNNER</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:-apple-system,"Segoe UI",system-ui,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;cursor:none}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  /* Smooth scaling, deliberately. I set this to pixelated for sharpness and it backfired: the
     canvas is a fixed 1920x1080 buffer and most windows are smaller, so nearest-neighbour was
     DOWN-scaling — dropping whole rows and columns, which thins some letters and fattens others.
     That is the "dirty" look, and it is worse than a slightly soft one. */
  canvas{display:block}
</style>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
"use strict";
/* Any failure used to present as a plain black page, which is impossible to
   diagnose on someone else's machine. Surface it as readable text instead. */
function fatal(msg,where){
  try{
    let d=document.getElementById('fatal');
    if(!d){
      d=document.createElement('div'); d.id='fatal';
      d.style.cssText='position:fixed;inset:0;z-index:9999;padding:6vh 6vw;'+
        'background:#0A0A0B;color:#F2ECDF;overflow:auto;'+
        'font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap';
      (document.body||document.documentElement).appendChild(d);
    }
    d.textContent='CROWN RUNNER could not start.\n\n'+
      msg+(where?'\n  at '+where:'')+
      '\n\nviewport '+innerWidth+'x'+innerHeight+
      '\ncanvas   '+(()=>{ const c=document.getElementById('c');
        return c?c.width+'x'+c.height+' css '+(c.style.width||'auto')+'x'+(c.style.height||'auto'):'not created'; })()+
      '\nagent    '+navigator.userAgent+
      '\n\nSend this text on and it can be fixed.';
  }catch(e){}
}
addEventListener('error',e=>fatal(e.message||'script error',
  (e.filename||'')+':'+(e.lineno||'')));
addEventListener('unhandledrejection',e=>fatal('unhandled promise: '+e.reason));
/* ═══════════════════════════════════════════════════════════════════════════
   GLIDEWELL DENTAL ARCADE — "CROWN RUNNER"
   Cabinet title, 1920x1080 on a 24" 16:9 panel, joystick + two buttons.

   JOYSTICK  ◀ ▶   aim the scanner
   BUTTON 1  hold  scan the approaching tooth until the ring closes
   BUTTON 2  tap   fire the crown you are carrying into the prepped tooth
   BUTTON 3  hold  slow down for a longer look — drains POWER

   The Glidewell mark — the G tile lifted straight off the logo — upgrades the
   scanner a tier. Debris hurts. They are told apart by form, not colour: a clean
   glowing tile is yours to collect, a dark jagged shard is not.

   The loop is Glidewell's own pipeline: SCAN a cracked tooth, the lab mills the
   crown and sends it up behind you, you DELIVER it by shooting it home.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── BRAND / TUNING ─────────────────────────────────────────────────────── */
const CFG = {
  brand: {
    name:'GLIDEWELL', sub:'DENTAL ARCADE', title:'CROWN RUNNER',
    tagline:'Improving Lives Through Advanced Dental Solutions',
    pillars:'TECHNOLOGY   ·   CRAFTSMANSHIP   ·   CARE',
  },
  /* Palette from the real logo — vivid crimson mark, grey wordmark — plus the
     product blue every fastscan.io / fastmill.io unit carries. The chamber is
     graphite so bone white can be spent only on teeth: the thing you must aim
     at is always the brightest object on the glass, readable across an aisle. */
  col: {
    red:'#EB0045', redLt:'#F53A67', redHot:'#FF4A72', redDeep:'#A80031',
    blue:'#0E86D4', blueLt:'#26C4DC',
    logoGrey:'#808285', wordmark:'#D9DBDD',
    // the stock the case slip is printed on, and the ink on it
    paper:'#F4F1E8', paper2:'#E7E2D5', ink:'#1E1E1E', inkDim:'#6E6A60',
    /* wet/blueLt pulled toward the cyan the milling unit actually glows in the title art */
    g0:'#0A0A0B', g1:'#15161A', g2:'#1E2025', steel:'#7A808A',
    bone:'#F2ECDF', boneDim:'#9A9184', chalk:'#FFF6E6',
    score:'#FFCC33', white:'#F2ECDF', dim:'#8A8377',
    good:'#CFC6B2', bad:'#FF3B57',
    wet:'#5FE0EC', wetDim:'#1E5F70',
  },
  /* Coloured after the material each one actually is: opaque chalky zirconia,
     translucent glass ceramic, anodized titanium. Far apart in hue and value so
     the match reads instantly, and clear of the wand's blue and the score amber. */
  crowns: [
    { id:'BRUXZIR',  label:'BruxZir',  shade:'A1', col:'#F2E8D5' },
    { id:'OBSIDIAN', label:'Obsidian', shade:'B2', col:'#57B89A' },
    { id:'HAHN',     label:'Hahn',     shade:'C3', col:'#F0536B' },
  ],
  /* Lives, in the trade's own terms. A tooth you never scan costs nothing but
     score — the bore always sends more than anyone can work. A case you OPEN and
     fail to deliver is a remake, and three remakes stop the line. One rule, one
     counter, both printed on the slip. */
  remakes:  3,
  /* Stage two's stock. The same three colours as the crowns, so the matching read
     is already learned, but the quantity being matched is a fixture diameter. */
  implants: [
    { id:'HAHN35', label:'Hahn 3.5', shade:'3.5', col:'#F2E8D5', fixture:true },
    { id:'HAHN43', label:'Hahn 4.3', shade:'4.3', col:'#57B89A', fixture:true },
    { id:'HAHN50', label:'Hahn 5.0', shade:'5.0', col:'#F0536B', fixture:true },
  ],
  /* Teeth lost past the implant line queue up for surgery. Ten of them and the
     shift moves on to placing them. */
  implantsToAdvance: 10,
  /* Stage two is a formation, not a corridor: two ranks of sockets marching across
     the bore, the near rank worked first, stepping closer on every reversal. Stock
     is finite and a miss spends it, so aim is the whole skill. */
  surgery: {
    /* Retuned because it was simply unfair: the near rank sat at z=1110, which made
       each socket a 22px target, and over the crown's flight the formation slid far
       enough that you had to lead it by more than the gap between sockets. The ranks
       now stand closer, march slower and step in less, and the shot is faster — the
       lead needed drops from about a third of a socket to a tenth of one. */
    cols:5, colGap:85, marchSpan:46, marchSpeed:52, stepIn:31,
    rowZ:[604,886], breachZ:357, hitPad:14,
    /* Glidewell supplies the fixtures, so implants were never counted.
       Crowns are now uncounted too. Running dry cost a remake and threw a banner
       across the screen mid-operation, and from the seat that does not read as
       "you are out of stock" — it reads as the game stopping to tell you something
       for no reason you can see. Scarcity is a level-two idea at best; the first
       thing a visitor has to understand is the loop, and nothing may interrupt it.
       The counters and the meters are still here and still work: set either flag
       false on a later level and the whole mechanic comes back with it. */
    unlimitedImplants:true, unlimitedCrowns:true,
    ammoImplant:13, ammoCrown:13, ammoStep:-1,
    implant:{ id:'HAHN', label:'Hahn', shade:'4.3', col:'#F0536B', fixture:true },
    crown:  { id:'BRUXZIR', label:'BruxZir', shade:'A1', col:'#F2E8D5' },
  },
  /* Two minutes for the eight-hour day, so the clock runs at exactly four clinic minutes per
     second. It was 75, and at 75 the shift ended before ten extractions could accumulate — so
     the second stage, half of what the cabinet exists to show, was something most visitors
     never saw. The extra time also gives the density ramp room to ramp instead of jumping. */
  round:    120,    // seconds per credit — the 08:00-16:00 day
  /* The gate to surgery is a failure counter, so a visitor who plays well loses fewer teeth
     and would be punished with less game. The shift therefore runs its full length and the
     whistle itself is the second way in: at zero, surgery begins with exactly the number of
     extractions on the bench at that moment. Ten losses still ends the shift early. */
  magMax:   3,      // crowns the wand can carry
  shotSpeed:1650,
  /* The wand cuts the crown itself. It runs in the background while the scanner
     keeps working the next tooth, so the two halves of the pipeline overlap the
     way they do in the real lab. */
  /* The cut is kept short on purpose: a case must be scanned, milled and fired
     before the tooth reaches you, so milling cannot eat the whole runway. */
  /* Scanner generations. Each blue pod advances one tier: faster closes, wider
     tolerance, longer reach — so the corridor gets easier to work exactly as it
     gets busier. Named like the product line. */
  scanner: [
    { mk:'MK I',   time:0.85, mill:0.90, align:130, range:1180 },
    { mk:'MK II',  time:0.68, mill:0.76, align:168, range:1355 },
    { mk:'MK III', time:0.54, mill:0.64, align:206, range:1530 },
    { mk:'MK IV',  time:0.42, mill:0.52, align:250, range:1765 },
  ],
  score: { scan:100, seat:300, match:200, save:50, pod:250, maxPod:600, comboCap:8 },
  /* 92, not 44. A hundred-and-twenty-second day reaches seven levels, so at 44 the wand only
     ever got to 694 and the top third of the range was decoration. 430 + 6*92 = 982, clamped
     to the ceiling — the close of business is now the fastest the instrument goes. */
  speed: { base:253, perLevel:54, max:576, slow:0.55 },
  power: { drain:30, regen:14 },
  levelSec:19,      // six or seven across the day: the speed keeps climbing to the close
  /* Density ramps continuously across the shift rather than in level steps: the
     opening has to be quiet enough to learn in, and the last third busy enough to
     be worth beating. Debris stays out of the first stretch entirely. */
  /* `curve` bends the density ramp. Lengthening the day to two minutes stretched both ramps
     with it, so at any given second there was less pressure than there had been at 75s — the
     game got quietly easier and it showed. An exponent below 1 front-loads the climb: the first
     half tightens at close to the old rate, the second half is a little gentler than the old
     curve was, and it keeps accelerating right to the whistle rather than levelling off. */
  spawn: { gapStart:2.6, gapEnd:0.72, curve:0.70, debrisAfter:12, debrisRate:0.30 },
  /* The tube. This is a real post-process, not an overlay: the frame is put
     through a curved-glass distortion with the RGB channels pulled apart by
     radius, the way a shadow-mask CRT behind curved glass actually behaves.
     Press K to compare with it off. */
  /* Tuned to be felt, not read. This is signage on a show floor: at the first
     pass the fringing doubled the type and cost real legibility, so the aberration
     is a third of what it was. Scanline pitch is derived from the live backing
     height instead of being fixed, or it moires on any panel that is not 1080p. */
  /* scan:0 — the shadow-mask lines are off. They are the one part of the tube that
     fights the artwork: the sprites are already a grid, so a second grid laid over them
     at a different pitch beats against it and reads as dirt rather than as glass. The
     curve, the fringing and the corner falloff stay. */
  crt: { on:true, curve:0.085, aberr:0.0022, scan:0, vig:0.24, bright:1.05 },
};

/* ── VIEW / WORLD ───────────────────────────────────────────────────────── */
const VW=1920, VH=1080;
const CX=VW/2;
/* The vanishing point sits right of centre to leave the left edge for the case
   slip, so the screen is composed asymmetrically instead of laid out as a
   symmetric dashboard. */
const PX=1225, HZ=520;
const FOV=620;
const SHIP_Z=210, FAR_Z=1850;
const NEAR_CULL=SHIP_Z*0.62;
const BORE_R=300;                    // the puck's bore, in world units
const PLANE_Y=90;
/* Bounded so the wand and the widest tooth both stay clear of the case slip on
   the left and the screen edge on the right. */
const LANE_X=192, SHIP_MAX_X=208;
/* Velocity control for the wand: full tilt crosses the bore in about nine tenths of a
   second, and the stick reaches full tilt in about a fifth. */
const SHIP_ACCEL=2100, SHIP_VMAX=400;


const cvs=document.getElementById('c');            // what the viewer sees
const view2d=cvs.getContext('2d');
/* The game always renders into a fixed 1920x1080 buffer. Presentation is a
   separate step, so the tube shader can sit between the two — and if the shader
   is unavailable the buffer is simply blitted straight through. */
/* Reverted to 1. Downsampling the whole frame did unify the styles, but it made
   everything dirty — the type furred up and the fine rules on the case slip turned to
   mush, which cost far more than the consistency was worth. The game renders crisp and
   the sprite characters stay deliberate sprites on an even grid instead. */
const PIXEL=1;
const frameBuf=document.createElement('canvas');
frameBuf.width=VW/PIXEL; frameBuf.height=VH/PIXEL;
const ctx=frameBuf.getContext('2d');
/* Drawing code keeps working in 1920x1080 coordinates; the buffer scales them down
   once here. Every save/restore in the renderer is balanced, so this base transform
   survives the frame. */
ctx.setTransform(1/PIXEL,0,0,1/PIXEL,0,0);
/* ── THE TUBE ────────────────────────────────────────────────────────────── */
/* Barrel distortion, per-channel radial offset, shadow-mask lines and corner
   falloff, in one fragment shader. Doing it on the GPU costs a texture upload
   per frame instead of the several full-frame canvas passes the same look would
   need in 2D. Fails soft: if anything here does not come up, present() blits the
   frame untouched rather than showing nothing. */
const CRT=(()=>{
  const cv=document.createElement('canvas');
  let gl=null, prog=null, tex=null, buf=null, U={}, ok=false;
  const VS='attribute vec2 a;varying vec2 vUv;'+
           'void main(){vUv=a*0.5+0.5;gl_Position=vec4(a,0.0,1.0);}';
  const FS=[
   'precision mediump float;',
   'varying vec2 vUv;',
   'uniform sampler2D tex;',
   'uniform float curve,aberr,scan,vig,lines,bright;',
   'vec2 barrel(vec2 uv,float k){vec2 c=uv-0.5;c*=1.0+k*dot(c,c);return c+0.5;}',
   'void main(){',
   '  vec2 uv=vec2(vUv.x,1.0-vUv.y);',      // the 2D buffer is top-down
   '  vec2 p=barrel(uv,curve);',
   '  vec2 c=uv-0.5; float r=length(c); vec2 dir=c/max(r,0.0001);',
   '  float a=aberr*r*r;',                   // fringing grows toward the edges
   '  float R=texture2D(tex,barrel(uv+dir*a,curve)).r;',
   '  float G=texture2D(tex,p).g;',
   '  float B=texture2D(tex,barrel(uv-dir*a,curve)).b;',
   '  vec3 col=vec3(R,G,B)*bright;',
   '  col*=1.0-scan*(0.5+0.5*sin(p.y*lines*3.14159265));',
   '  col*=1.0-vig*pow(clamp(r*1.30,0.0,1.0),2.2);',
   '  vec2 m=smoothstep(vec2(0.0),vec2(0.006),p)*smoothstep(vec2(0.0),vec2(0.006),1.0-p);',
   '  col*=m.x*m.y;',
   '  gl_FragColor=vec4(col,1.0);',
   '}'].join('\n');
  function sh(type,src){
    const o=gl.createShader(type); gl.shaderSource(o,src); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o));
    return o;
  }
  function init(){
    try{
      gl=cv.getContext('webgl',{alpha:false,antialias:false,depth:false,stencil:false})
        ||cv.getContext('experimental-webgl');
      if(!gl) return false;
      prog=gl.createProgram();
      gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
      gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
      gl.linkProgram(prog);
      if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);
      buf=gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const a=gl.getAttribLocation(prog,'a');
      gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
      tex=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      /* LINEAR, and it stays LINEAR. I switched this to NEAREST chasing sharpness and it made the
         picture worse, not better: the tube bends the frame, so point sampling lands the blocks 2,
         3 or 4 pixels wide depending on where they fall, and uneven blocks read as bad drawing
         rather than as pixel art. The smooth sample keeps every block the same weight, which is
         what makes the grid look deliberate.

         The softness that started this was never here — it was the title art being reduced six
         times over instead of three (207 art pixels instead of 640). That is fixed at the source. */
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      ['curve','aberr','scan','vig','lines','bright'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
      ok=true;
      return true;
    }catch(e){ ok=false; gl=null; return false; }
  }
  let lines=540;
  function resize(w,h){
    cv.width=w; cv.height=h;
    lines=Math.max(120,Math.round(h/2));   // one dark line per two real pixels
    if(gl) gl.viewport(0,0,w,h);
  }
  function render(src){
    const C=CFG.crt;
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.uniform1f(U.curve,C.curve); gl.uniform1f(U.aberr,C.aberr);
    gl.uniform1f(U.scan,C.scan);   gl.uniform1f(U.vig,C.vig);
    gl.uniform1f(U.lines,lines);   gl.uniform1f(U.bright,C.bright);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  return { canvas:cv, init, resize, render, get ok(){return ok;} };
})();
let crtOn=true, showFps=false;
const WAVE_SECS=3.0;
/* A raster wobble, which is how a 16-bit machine did water: the frame is finished and then each
   horizontal band of it is pushed sideways by a travelling sine. Bands of one PIXEL_K block, so
   the displacement lands on the same grid as everything drawn into the frame — a sub-block shift
   would soften rows that are otherwise hard-edged. Cheap: 360 blits, no per-pixel work. */
let waveBuf=null;
function waveFrame(t){
  const w=frameBuf.width, h=frameBuf.height, band=PIXEL_K;
  if(!waveBuf||waveBuf.width!==w||waveBuf.height!==h){
    waveBuf=document.createElement('canvas'); waveBuf.width=w; waveBuf.height=h;
  }
  const g=waveBuf.getContext('2d');
  g.imageSmoothingEnabled=false;
  g.fillStyle='#000'; g.fillRect(0,0,w,h);
  // dies away over its life, so the last second is a ripple rather than a cut-off
  const amp=68*clamp(t/WAVE_SECS,0,1), mid=h/2;
  for(let y=0;y<h;y+=band){
    /* Two waves of different length and speed, not one. A single sine reads as a machine
       oscillating; adding a slower, longer one against it is what makes it read as water.
       And the whole thing is weighted to the middle of the screen: the splash is where the
       instrument is, so the picture bends hardest around the bore and settles towards the top
       and bottom edges — which is also where the slip and the queue have to stay readable. */
    const d=Math.abs(y-mid)/mid;
    const fall=Math.cos(d*Math.PI/2);                 // 1 at the centre, 0 at the edges
    const wob=Math.sin(y*0.020 + T*6.4)*0.68 + Math.sin(y*0.007 - T*3.1)*0.32;
    const dx=Math.round(wob*amp*fall*fall/band)*band;
    g.drawImage(frameBuf,0,y,w,band,dx,y,w,band);
    /* A ghost of the same band, a couple of blocks off and half transparent, weighted to the
       centre exactly as the displacement is. This is how you smear a picture on hardware that
       has no blur: draw it twice, slightly apart, and let the eye do the averaging. It is also
       why the smear is strongest where the wobble is strongest — the two are the same water. */
    const gh=fall*fall*clamp(t/WAVE_SECS,0,1);
    if(gh>0.05){
      const gx=Math.round((dx + Math.sign(wob||1)*band*3*gh)/band)*band;
      g.globalAlpha=0.42*gh;
      g.drawImage(frameBuf,0,y,w,band,gx,y,w,band);
      g.globalAlpha=1;
    }
  }
  return waveBuf;
}
function present(){
  const w=cvs.width,h=cvs.height;
  // and the final blit too, in case the backing store is not exactly the buffer's size
  view2d.imageSmoothingEnabled=false;
  const src=(G&&G.wave>0)?waveFrame(G.wave):frameBuf;
  if(crtOn&&CRT.ok){
    try{ CRT.render(src); view2d.drawImage(CRT.canvas,0,0,w,h); return; }
    catch(e){ crtOn=false; }   // never let the tube cost us the picture
  }
  view2d.drawImage(src,0,0,w,h);
}

CRT.init();

function fit(){
  /* An iframe that has not been laid out yet reports a zero viewport. That used
     to scale the canvas to 0x0 css pixels and leave a black page with no way
     back, because no further resize event was guaranteed to arrive. */
  const availW=innerWidth||document.documentElement.clientWidth||VW;
  const availH=innerHeight||document.documentElement.clientHeight||VH;
  const s=Math.max(0.05,Math.min(availW/VW, availH/VH));
  const cw=Math.max(1,Math.round(VW*s)), ch=Math.max(1,Math.round(VH*s));
  cvs.style.width=cw+'px'; cvs.style.height=ch+'px';
  // backing store follows the on-screen size, capped at the buffer's own size
  const bw=Math.min(cw,VW), bh=Math.min(ch,VH);
  if(cvs.width!==bw||cvs.height!==bh){ cvs.width=bw; cvs.height=bh; CRT.resize(bw,bh); }
  view2d.imageSmoothingEnabled=true;
}
/* Several signals, because a resize event alone is not guaranteed inside an
   embed: observe the document box, and retry a few times after load. */
addEventListener('resize',fit);
addEventListener('orientationchange',fit);
addEventListener('load',fit);
if(window.ResizeObserver){
  try{ new ResizeObserver(()=>fit()).observe(document.documentElement); }catch(e){}
}
[60,300,1200].forEach(t=>setTimeout(fit,t));
fit();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
function proj(x,y,z){ const s=FOV/Math.max(z,1); return {x:PX+x*s,y:HZ+y*s,s}; }

/* ── LESSON CAMERA ──────────────────────────────────────────────────────── */
/* The lesson can push in on the thing it is talking about. At the scale the bore
   is drawn, a tooth at scanning distance is about the size of a thumbnail and the
   scan ring closing around it reads as a flicker — which is a problem, because
   that ring is the single idea the whole cabinet exists to explain.
   Only the world layer moves. The slip, the legend and the lesson's own panel are
   drawn outside it, so nothing anybody is reading slides around while the bore is
   being magnified. And it is a screen-space transform, deliberately, rather than a
   change to FOV: FOV feeds scanNear(), the bore radius and the aim geometry, so
   moving it would quietly change the rules of the game in order to explain them. */
const CAM={k:1,fx:PX,fy:HZ,want:1,wx:PX,wy:HZ};
function camTick(dt){
  const s=Math.min(1,dt*4.5);          // same ease in both directions, so it never snaps
  CAM.k+=(CAM.want-CAM.k)*s;
  CAM.fx+=(CAM.wx-CAM.fx)*s;
  CAM.fy+=(CAM.wy-CAM.fy)*s;
  if(Math.abs(CAM.k-CAM.want)<0.002) CAM.k=CAM.want;
}
function camReset(){ CAM.k=CAM.want=1; CAM.fx=CAM.wx=PX; CAM.fy=CAM.wy=HZ; }
const camIdle=()=>Math.abs(CAM.k-1)<0.002;
function camPush(){
  if(camIdle()) return false;
  ctx.save();
  ctx.translate(CAM.fx,CAM.fy); ctx.scale(CAM.k,CAM.k); ctx.translate(-CAM.fx,-CAM.fy);
  return true;
}
function camPop(on){ if(on) ctx.restore(); }
/* Where a world point drawn under the zoom actually lands, for the overlays that
   are drawn outside it — the lesson's highlight ring, mainly. */
const camPt=(x,y)=>camIdle()?{x,y}:{x:CAM.fx+(x-CAM.fx)*CAM.k,y:CAM.fy+(y-CAM.fy)*CAM.k};

/* ── INPUT ──────────────────────────────────────────────────────────────── */
/* Key names follow MAME / RetroPie defaults so a stock USB encoder works with
   no remapping: B1=LCtrl, B2=LAlt, Start=1, Coin=5. Z / X / Space are kept as
   laptop stand-ins for testing away from the cabinet. */
/* A cabinet button has two identities and they are not the same: the code its encoder
   sends, and the letter silk-screened on the cap. A panel printed A B C X Y Z will send
   whatever its board was flashed with — usually LCtrl, LAlt, Space and so on — so the
   game stores both, and both are settable from the panel itself with no keyboard
   attached. The defaults are the MAME / RetroPie ones with laptop stand-ins kept, and
   the printed labels default to the panel's left column. */
const BIND_KEY='crown-runner-bind-v3';
const PANEL_LABELS=['A','B','C','X','Y','Z','GO','|||','1','2','3','B1','B2','B3','SEL'];
/* The colours of the real caps, sampled off the cabinet: A and X are green, B and Y blue,
   C and Z red, and the two admin buttons are lit white. Keyed on the printed letter rather
   than on the action, so changing a label on the setup screen moves the colour with it and
   what is on screen keeps matching what the player's hand is on. */
const PANEL_COLS={A:'#2ED64A',X:'#2ED64A',B:'#2A4CF0',Y:'#2A4CF0',
                  C:'#FF2A33',Z:'#FF2A33',GO:'#CFE7FF','|||':'#CFE7FF'};
const btnCol=label=>PANEL_COLS[label]||CFG.col.steel;
/* A stick is a third kind of source. Encoders disagree wildly about how they report one:
   some send arrow keys, some send D-pad buttons, some an analog pair on axes 0 and 1, and
   plenty send a hat on some other axis entirely — axis 9 is common — idling at a value
   that is not zero. So a direction may be bound to a key, a pad button, or an axis and a
   sign; all three are checked, and axis rest positions are measured rather than assumed. */
/* Panel only. The keyboard used to be duplicated in here as well, which is what let a key
   keep steering after the same key had been bound to something else — the collision filter
   can only clean the layer it owns. So this is the cabinet's wiring and KBD below is the
   keyboard's, and neither can quietly cancel the other. */
const BIND_DEFAULT={
  scan :{codes:[], pads:[0],    axes:[],                 label:'A'},
  fire :{codes:[], pads:[1],    axes:[],                 label:'B'},
  slow :{codes:[], pads:[2,6,7],axes:[],                 label:'C'},
  start:{codes:[], pads:[9,8],  axes:[],                 label:'GO'},
  left :{codes:[], pads:[14],   axes:[{i:0,sign:-1}],    label:'STICK L'},
  right:{codes:[], pads:[15],   axes:[{i:0,sign: 1}],    label:'STICK R'},
  up   :{codes:[], pads:[12],   axes:[{i:1,sign:-1}],    label:'STICK U'},
  down :{codes:[], pads:[13],   axes:[{i:1,sign: 1}],    label:'STICK D'},
  /* The panel has its own admin button — the one printed ||| — and reaching the settings by
     holding any button for three seconds is a fallback, not a control. Left unbound by
     default because nobody can know which index that button reports until it is pressed. */
  menu :{codes:[], pads:[],     axes:[],                 label:'|||'},
};
const BIND_ACTS=['scan','fire','slow','start','left','right','up','down','menu'];
/* A keyboard layer that is always live and cannot be edited away. Binding a panel button
   replaces that action's codes — that is what binding means — and without this layer it
   would take the keyboard alias with it, leaving the game unplayable on any machine that
   has no cabinet wired to it. Development, a laptop demo and the published link all need
   the keys to keep working, mirroring the panel exactly.

   One conflict has to be resolved rather than ignored: the panel has a button printed A,
   and KeyA means "left" here. If an encoder turns out to send KeyA for that button, the
   explicit binding wins and KeyA stops being a direction — otherwise one press would both
   scan and steer. KBD_LIVE holds the layer with those collisions already removed. */
const KBD={
  menu :['Tab'],
  scan :['ControlLeft','KeyZ'],  fire :['AltLeft','KeyX'],
  slow :['Space','KeyC','ShiftLeft'], start:['Enter','NumpadEnter','Digit1','Digit5'],
  left :['ArrowLeft','KeyA'],    right:['ArrowRight','KeyD'],
  up   :['ArrowUp','KeyW'],      down :['ArrowDown','KeyS'],
};
let KBD_LIVE={};
function rebuildKbd(){
  KBD_LIVE={};
  for(const act of BIND_ACTS){
    KBD_LIVE[act]=(KBD[act]||[]).filter(c=>
      !BIND_ACTS.some(o=>o!==act&&(BIND[o].codes||[]).includes(c)));
  }
}
const AX_ON=0.45;                       // deflection from rest that counts as pushed
/* Encoders known to put the stick's horizontal on axis 1 rather than axis 0. */
const AUTO_SWAP=/0079|dragonrise|generic\s*usb\s*joy/i;
let axRest=null, axLive=[], padLive=[], padName='';
/* Buttons that are already down the moment the pad appears. Cheap encoders float unused inputs,
   and a stuck button is silent poison: an edge is `held && !heldLastFrame`, so if the board reports
   START as permanently pressed the edge fires once at boot and never again. Everything else keeps
   working, which is what makes it so hard to see — the keyboard still starts a credit because its
   taps are latched separately. So anything found pressed at rest is ignored until it is released
   at least once, and the attract screen says so out loud. */
let padStuck=null;
let BIND=(()=>{
  try{
    const j=JSON.parse(localStorage.getItem(BIND_KEY));
    if(j&&j.scan&&Array.isArray(j.scan.codes)){
      // fill in any action added since this store was written, rather than discarding it
      for(const a of BIND_ACTS)
        if(!j[a]||!Array.isArray(j[a].codes))
          j[a]=JSON.parse(JSON.stringify(BIND_DEFAULT[a]));
      return j;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(BIND_DEFAULT));
})();
function saveBind(){
  try{ localStorage.setItem(BIND_KEY,JSON.stringify(BIND)); }catch(e){}
  rebuildKbd();
  applyBtnLabels();
}
/* {SCAN} and friends in any on-screen string become whatever is printed on the cap. */
function btnSub(str){
  return String(str).replace(/\{(SCAN|FIRE|SLOW|START)\}/g,
    (m,k)=>BIND[k.toLowerCase()].label);
}
function codeLabel(code,pad){
  if(pad!=null) return 'B'+(pad+1);
  let m=/^Key([A-Z])$/.exec(code);   if(m) return m[1];
  m=/^Digit(\d)$/.exec(code);        if(m) return m[1];
  if(code==='Enter'||code==='NumpadEnter') return 'GO';
  if(code==='ControlLeft'||code==='ControlRight') return 'A';
  if(code==='AltLeft'||code==='AltRight') return 'B';
  if(code==='Space'||code==='ShiftLeft') return 'C';
  return code.replace(/^(Key|Digit|Numpad)/,'').slice(0,3).toUpperCase();
}

const Input={axis:0,scan:false,scanEdge:false,slow:false,fire:false,fireEdge:false,start:false,startEdge:false,menu:false,menuEdge:false,_pm:false,
  leftEdge:false,rightEdge:false,upEdge:false,downEdge:false,enterEdge:false,
  keys:new Set(),typed:[],_pf:false,_pc:false,_pw:false,_ps:false,_pl:false,_pr:false,_pu:false,_pd:false};

/* Presses are latched as well as polled: a tap shorter than one frame would
   otherwise be dropped between two pollInput() calls. */
const tapped=new Set();
/* The setup screen needs the raw code of a press, not the game's interpretation of it —
   the whole point is that the interpretation is what is being set. */
let keyTap=null, padTap=null, axisTap=null, axWas=[]; const padWas=new Set();
addEventListener('keydown',e=>{
  if(e.code==='F11') return;
  if(!e.repeat){
    tapped.add(e.code); keyTap=e.code;
    if(/^Key[A-Z]$/.test(e.code)) Input.typed.push(e.code.slice(3));
    if(e.code==='Backspace') Input.typed.push('\b');
  }
  Input.keys.add(e.code); e.preventDefault();
});
addEventListener('keyup',e=>Input.keys.delete(e.code));
addEventListener('blur',()=>Input.keys.clear());
// a pad that arrives after the page has to be measured when it arrives, not before
addEventListener('gamepadconnected',()=>{ axRest=null; padStuck=null; });
const held=arr=>arr.some(k=>Input.keys.has(k));

function pollInput(){
  let ax=0,sc=false,fr=false,sl=false,st=false,up=false,dn=false,lf=false,rt=false;
  /* Not just absent but throwing: inside an embed the gamepad feature is blocked
     by permissions policy and the call raises rather than returning nothing. */
  let pads=[];
  try{ if(navigator.getGamepads) pads=navigator.getGamepads()||[]; }catch(e){ pads=[]; }
  // every axis and every pressed button across every pad, gathered once
  axLive=[]; padLive=[]; padName='';
  for(const p of pads){ if(!p) continue;
    if(!padName) padName=p.id||'pad';
    for(let i=0;i<p.axes.length;i++) axLive[i]=p.axes[i]||0;
    for(let i=0;i<p.buttons.length;i++) if(p.buttons[i]&&p.buttons[i].pressed) padLive.push(i);
  }
  if(padStuck===null&&padName) padStuck=new Set(padLive);
  if(padStuck) for(const i of [...padStuck]) if(!padLive.includes(i)) padStuck.delete(i);
  const padDown=padLive.filter(i=>!(padStuck&&padStuck.has(i)));
  if(padDown.length) audioWake();
  /* Rest positions are measured, not assumed: a hat that idles at 3.29 — and they do —
     would otherwise read as permanently pushed one way. But measuring has its own failure
     mode, and it is worse than the one it fixes: sample the rest while the stick happens to
     be held, or before the pad has reported real values, and that direction is dead for the
     rest of the session with nothing on screen to explain it. So the sample is retaken when
     a pad connects and whenever the settings screen opens, and a reading is only trusted as
     "rest" if it is near the middle — an axis found sitting at an extreme is treated as
     centred at zero instead, which is the assumption that at least fails loudly. */
  if(axRest===null&&axLive.length) axRest=axLive.map(v=>Math.abs(v)>0.9?0:v);
  /* Some encoders report the stick's two axes the other way round from the convention —
     the generic 0079:0006 board on this cabinet puts left/right on axis 1 and leaves axis 0
     at zero, which reads as a stick that does nothing at all. Bindings still name axes 0 and
     1; the swap is applied here, at the moment of reading, so one setting fixes every
     direction at once instead of four separate re-bindings. */
  /* Decided by the board unless the operator has said otherwise. The generic 0079:0006
     encoder — the one on this cabinet — is known to report the stick this way round, so it
     is handled without anyone having to find a setting; a standard pad is left alone; and the
     moment the swap row is touched the manual answer wins from then on. */
  const swapOn = VOL.swapSet ? VOL.swap : AUTO_SWAP.test(padName||'');
  const AXI=i=>swapOn?(i===0?1:i===1?0:i):i;
  const defl=i=>{ const k=AXI(i);
    return axLive[k]==null?0:axLive[k]-((axRest&&axRest[k]!=null)?axRest[k]:0); };
  const on=act=>{
    const d=BIND[act]; if(!d) return false;
    if(held(d.codes)||held(KBD_LIVE[act])) return true;
    if((d.pads||[]).some(i=>padDown.includes(i))) return true;
    return (d.axes||[]).some(a=>a.sign>0 ? defl(a.i)>AX_ON : defl(a.i)<-AX_ON);
  };
  sc=on('scan'); fr=on('fire'); sl=on('slow'); st=on('start');
  lf=on('left'); rt=on('right'); up=on('up'); dn=on('down');
  if(lf) ax-=1; if(rt) ax+=1;
  /* A microswitch stick is already at full travel from the two lines above. An analog one
     should keep its travel, so the largest horizontal deflection wins outright. */
  let best=0;
  for(const d of [BIND.left,BIND.right])
    for(const a of (d.axes||[])){
      const v=defl(a.i);
      if(Math.abs(v)>0.22&&Math.abs(v)>Math.abs(best)) best=v;
    }
  if(best!==0) ax=best;
  // whatever is newly down, for the setup screen to capture
  for(const i of padDown) if(!padWas.has(i)) padTap=i;
  padWas.clear(); for(const i of padDown) padWas.add(i);
  if(axisTap===null&&axRest) for(let i=0;i<axLive.length;i++){
    const v=defl(i);
    if(Math.abs(v)>0.7&&Math.abs(axWas[i]||0)<0.3){ axisTap={i,sign:v>0?1:-1}; break; }
  }
  axWas=axLive.map((_,i)=>defl(i));
  const tap=arr=>(arr||[]).some(k=>tapped.has(k));
  const tapAct=act=>tap(BIND[act].codes)||tap(KBD_LIVE[act]);
  Input.axis=clamp(ax,-1,1);
  Input.scan     = sc || tapAct('scan');
  Input.scanEdge = (sc && !Input._pc) || tapAct('scan');  Input._pc=sc;
  Input.slow     = sl;
  Input.slowEdge = (sl && !Input._pw) || tapAct('slow');  Input._pw=sl;
  Input.fire     = fr;
  Input.fireEdge = (fr && !Input._pf) || tapAct('fire');  Input._pf=fr;
  Input.menu     = on('menu');
  Input.menuEdge = (Input.menu && !Input._pm) || tapAct('menu'); Input._pm=Input.menu;
  Input.start    = st;
  Input.startEdge= (st && !Input._ps) || tapAct('start'); Input._ps=st;
  Input.leftEdge = (lf && !Input._pl) || tapAct('left');  Input._pl=lf;
  Input.rightEdge= (rt && !Input._pr) || tapAct('right'); Input._pr=rt;
  Input.upEdge   = (up && !Input._pu) || tapAct('up');    Input._pu=up;
  Input.downEdge = (dn && !Input._pd) || tapAct('down');  Input._pd=dn;
  Input.enterEdge= tapped.has('Enter')||tapped.has('NumpadEnter');
  tapped.clear();
}
/* ── MUSIC ──────────────────────────────────────────────────────────────── */
/* Three loops, one per state the cabinet can be in: a calm one for the attract screen and
   the lesson, then a track for each stage. The calm one covers the attract screen as well
   as the training because a stand has to live with whatever plays there all day, and the
   action theme is not it — and because the lesson needs room under it for the speech
   blips, which sit around 150–260 Hz.

   A browser will not play audio before a gesture, which is why the cabinet is silent until
   somebody touches the panel; the first press starts whichever track the current screen
   wants. Volume is ramped rather than switched, and ducked while the lesson is speaking.
   M mutes, for a stand that has gone quiet for a presentation. A missing file fails soft:
   the element nulls itself and the game runs on without it. */
const MUSIC={calm:'music-calm.mp3', stage1:'music-stage1.mp3', stage2:'music-stage2.mp3'};
/* Levels are the operator's, not the designer's: a stand is loud, a demo room is not, and
   the person who has to sit beside this all day should be able to turn it down without a
   keyboard. Kept with the bindings, in the same shape — set from the panel, saved on the
   machine. The numbers here are the old hard-coded ones, so an untouched cabinet sounds
   exactly as it did. */
const VOL_KEY='crown-runner-vol-v1';
let VOL=(()=>{
  try{
    const j=JSON.parse(localStorage.getItem(VOL_KEY));
    if(j&&typeof j.music==='number'&&typeof j.sfx==='number')
      return {music:j.music, sfx:j.sfx, crt:j.crt!==false, fps:!!j.fps,
              swap:!!j.swap, swapSet:!!j.swapSet,
              idle:(typeof j.idle==='number'?j.idle:60)};
  }catch(e){}
  return {music:0.32, sfx:0.32, crt:true, fps:false, swap:false, swapSet:false, idle:60};
})();
function saveVol(){
  try{ localStorage.setItem(VOL_KEY,JSON.stringify(VOL)); }catch(e){}
  if(A.master) A.master.gain.value=VOL.sfx;
  crtOn=VOL.crt; showFps=VOL.fps;
}
/* Ducking is a fraction of the set level, and 0.30 was too deep to be a duck. At the
   default 0.32 it put the track at 0.096 — quiet enough to read as the music having
   stopped for the speech rather than having stepped back behind it. 0.55 keeps it
   plainly there. Ducking also gets its own, much shorter ramp: MUS_FADE is the length
   of a track change, and taking 1.6s to step back means the doctor's first line is over
   the top of the music at full level and the last line is under a track still climbing
   out. Coming back is slower than going down, which is how it is done everywhere else. */
const nowMs=()=>(performance&&performance.now?performance.now():0);
const MUS_DUCK_MUL=0.55, MUS_FADE=1.6, MUS_DUCK_DOWN=0.22, MUS_DUCK_UP=0.55;
const MUS_PAUSE_MUL=0.10;                // a pause takes it right down, but never off
/* A fade to black with something happening behind it. Used to hand over from the lesson to the
   shift: the cut is where a new level starts, so the change of scene is not something the
   player has to watch being assembled. */
let wipeT=0, wipeDir=0, wipeThen=null;
let wipeSecs=0.55;
/* secs is per leg, so a value of 1.6 is 1.6 down and 1.6 back up. The lesson's hand-overs use
   the default; the end of the shift asks for something much slower, because it is a change of
   scene rather than a change of level. */
function wipeTo(fn,secs){ if(wipeDir>0) return; wipeDir=1; wipeThen=fn||null; wipeSecs=secs||0.55; }
function wipeTick(dt){
  if(!wipeDir) return;
  wipeT=clamp(wipeT+wipeDir*dt/wipeSecs,0,1);
  if(wipeDir>0&&wipeT>=1){ wipeDir=-1; const f=wipeThen; wipeThen=null; if(f) f(); }
  else if(wipeDir<0&&wipeT<=0){ wipeDir=0; }
}
const musEl={};
let musWant=null, musMuted=false;
function musFor(key){
  if(!musEl[key]){
    /* Two slots can point at the same file — the calm loop has not been written, so the build
       aliases it to the shift's track. Given an element each, they cross-fade AGAINST EACH
       OTHER on the way out of the lesson: same music, two playheads, seconds apart. That is
       the doubling. A slot whose source is already loaded shares that element instead. */
    for(const k of Object.keys(MUSIC)){
      if(k!==key && MUSIC[k]===MUSIC[key] && musEl[k]){ musEl[key]=musEl[k]; return musEl[key]; }
    }
    const a=new Audio();
    a.src=MUSIC[key]; a.loop=true; a.volume=0; a.preload='auto';
    a.load();                      // or a 404 may never report and the slot never falls back
    /* Falls back from .mp3 to .m4a once, then gives up quietly. Suno hands back whatever
       it hands back, and a track that has been trimmed on this machine comes out as m4a —
       there is no reason to make that a naming chore. A data URI in the single-file build
       matches neither pattern, so it goes straight to giving up. */
    a.addEventListener('error',()=>{
      if(!a.dataset.alt && /\.mp3$/.test(a.src)){
        a.dataset.alt='1'; a.src=a.src.replace(/\.mp3$/,'.m4a');
      } else musEl[key]=null;
    });
    /* And a watchdog, because the error event is not guaranteed. A host that answers an unknown
       path with its own HTML page — which is what a static site does — returns 200, so nothing
       ever fires, the slot never fails over, and the attract screen and the whole lesson run in
       silence while the shift has music. Anything that has not become playable in two seconds is
       treated as absent. */
    a.dataset.t0=String(nowMs());
    musEl[key]=a;
  }
  return musEl[key];
}
/* A slot whose file is not there yet falls through to one that is, rather than playing
   nothing. The calm loop has not been generated, and without this the attract screen, the
   lesson and the whole closing report were silent — which reads as the music having broken
   rather than as one track being absent. */
const MUS_FALLBACK={calm:'stage1', stage2:'stage1', stage1:'calm'};
function musResolve(key){
  for(let hop=0; key && hop<3; hop++){
    if(musEl[key]!==null) return key;      // null means it tried to load and failed
    key=MUS_FALLBACK[key];
  }
  return null;
}
function musTick(dt){
  musWant = musMuted || mode==='BIND' ? null
          : mode!=='PLAY'               ? 'calm'
          : (G&&G.tut&&G.tut.on)        ? 'calm'
          : implanting()                ? 'stage2'
          :                               'stage1';
  /* Touch the wanted slot so it gets its chance to load and report, then resolve: one that
     has already failed hands over to its fallback. */
  if(musWant){
    const a0=musFor(musWant);
    if(a0 && a0.readyState===0 && nowMs()-(+a0.dataset.t0||0) > 2000) musEl[musWant]=null;
    musWant=musResolve(musWant);
  }
  /* The whole lesson sits under the speech, not just the moments a panel is open. Ducking on
     `paused` meant it lifted back to full between one slide and the next and dropped again a
     third of a second later — a jump every beat. The lesson is one quiet passage. */
  const ducked = mode==='PLAY' && G && G.tut && G.tut.on;
  /* A pause is deeper than a duck. Somebody has stopped to talk to a visitor, or walked
     away from the cabinet — the track goes down to almost nothing but keeps running, so
     coming back off the pause is the music rising rather than a track starting again. */
  const halted = mode==='PLAY' && G && G.paused;
  /* Over elements, not over slot names: with a shared element two slots would set its volume
     twice in the same frame, one of them to zero, and which won would depend on key order. */
  const wanted=musWant?musEl[musWant]:null, seen=new Set();
  for(const key of Object.keys(MUSIC)){
    const a=musEl[key]; if(!a||seen.has(a)) continue; seen.add(a);
    const want = a===wanted;
    const target = want ? VOL.music*(halted?MUS_PAUSE_MUL:ducked?MUS_DUCK_MUL:1) : 0;
    /* A track being swapped out crossfades over MUS_FADE; the one that is staying and only
       stepping aside for the speech moves in a fraction of that. */
    const step=dt/(want ? (target<a.volume ? MUS_DUCK_DOWN : MUS_DUCK_UP) : MUS_FADE);
    a.volume = clamp(a.volume + clamp(target-a.volume,-step,step), 0, 1);
    /* Only a track on its way out is allowed to stop. The wanted one is never paused, so
       ducking can never turn into silence — at a low master level the ducked volume can
       land near enough to zero that this used to pause it, and a paused element does not
       resume until the next play() lands, which is a hole the speech falls straight into. */
    if(a.volume<=0.001 && !a.paused && !want) a.pause();
  }
  if(musWant){
    const a=musFor(musWant);
    /* Not gated on the AudioContext. The two are separate permissions — an element can be
       allowed to play when no context exists — and gating on it is why a cabinet with no
       keyboard ran silent. */
    if(a&&a.paused) a.play().catch(()=>{});
  }
}
/* Mouse / touch stand-ins so the game is playable on a laptop: move to aim,
   left button scans, right button fires. */
let ptrX=null;
function ptr(e){ const r=cvs.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  ptrX=((t.clientX-r.left)/r.width*VW - PX)/(LANE_X*2.95);
}
cvs.addEventListener('mousemove',ptr);
cvs.addEventListener('touchmove',ptr,{passive:true});
cvs.addEventListener('contextmenu',e=>e.preventDefault());
cvs.addEventListener('mousedown',e=>{ Input.keys.add(e.button===2?'AltLeft':'ControlLeft'); tapped.add(e.button===2?'AltLeft':'ControlLeft'); });
cvs.addEventListener('mouseup',e=>Input.keys.delete(e.button===2?'AltLeft':'ControlLeft'));
cvs.addEventListener('touchstart',e=>{ ptr(e); Input.keys.add('ControlLeft'); tapped.add('ControlLeft'); },{passive:true});
cvs.addEventListener('touchend',()=>Input.keys.delete('ControlLeft'));

/* ── AUDIO (synth only, so the cabinet needs no asset files) ─────────────── */
const A={ac:null,master:null,drone:null,droneF:null,on:true};
function audioInit(){
  if(A.ac) return;
  try{ A.ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ A.on=false; return; }
  A.master=A.ac.createGain(); A.master.gain.value=VOL.sfx; A.master.connect(A.ac.destination);
  const o=A.ac.createOscillator(),g=A.ac.createGain(),f=A.ac.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=44; f.type='lowpass'; f.frequency.value=220;
  g.gain.value=0; o.connect(f); f.connect(g); g.connect(A.master); o.start();
  A.drone=g; A.droneF=f;
}
addEventListener('pointerdown',audioInit,{once:true});
addEventListener('keydown',audioInit,{once:true});
/* And the panel. Those two listeners are a keyboard and a mouse, and the cabinet has neither —
   a stick and eight buttons raise no pointer and no key event, so on the machine this was
   actually built for the context was never created and nothing ever made a sound. A pad press
   is a user gesture as far as the browser is concerned; it just has to be noticed by hand. */
function audioWake(){
  audioInit();
  if(A.ac&&A.ac.state==='suspended') A.ac.resume().catch(()=>{});
}

function tone(freq,dur,{type='sine',vol=0.3,slide=0,delay=0}={}){
  if(!A.ac||!A.on) return;
  const t=A.ac.currentTime+delay;
  const o=A.ac.createOscillator(),g=A.ac.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0006,t+dur);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t+dur+0.05);
}
/* The decay used to be baked into the sample buffer, which meant every burst began
   at full amplitude — an unavoidable click on the attack. The envelope lives on a
   gain node now, so a sound can swell instead of snapping, and the filter can be
   swept down over the tail. */
function noise(dur,{vol=0.3,lp=1200,lpEnd=0,delay=0,attack=0.006}={}){
  if(!A.ac||!A.on) return;
  const t=A.ac.currentTime+delay, n=Math.max(1,(A.ac.sampleRate*dur)|0);
  const buf=A.ac.createBuffer(1,n,A.ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=A.ac.createBufferSource(); s.buffer=buf;
  const f=A.ac.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(lp,t);
  if(lpEnd) f.frequency.exponentialRampToValueAtTime(Math.max(40,lpEnd),t+dur);
  const g=A.ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+Math.min(attack,dur*0.5));
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  s.connect(f); f.connect(g); g.connect(A.master); s.start(t); s.stop(t+dur+0.02);
}
let scanHum=null;
function scanHumOn(on,prog){
  if(!A.ac||!A.on) return;
  if(on&&!scanHum){
    const o=A.ac.createOscillator(),g=A.ac.createGain();
    o.type='triangle'; o.frequency.value=420; g.gain.value=0.07;
    o.connect(g); g.connect(A.master); o.start();
    scanHum={o,g};
  }
  if(scanHum){
    if(on) scanHum.o.frequency.value=420+prog*520;
    else { try{ scanHum.g.gain.value=0; scanHum.o.stop(); }catch(e){} scanHum=null; }
  }
}
const SFX={
  lock:   ()=>tone(760,0.07,{type:'square',vol:0.10}),
  scanned:()=>{ [0,4,7].forEach((s,i)=>tone(659*Math.pow(2,s/12),0.20,{type:'triangle',vol:0.15,delay:i*0.05})); },
  millStart:()=>{ noise(0.22,{vol:0.16,lp:2200}); tone(200,0.26,{type:'sawtooth',vol:0.12,slide:2.2}); },
  dock:   ()=>{ tone(880,0.10,{type:'square',vol:0.13}); tone(1320,0.09,{type:'sine',vol:0.09,delay:0.05}); },
  fire:   ()=>{ noise(0.10,{vol:0.20,lp:3000}); tone(520,0.12,{type:'square',vol:0.13,slide:2.0}); },
  seat:   ()=>{ [0,4,7,12].forEach((s,i)=>tone(523.25*Math.pow(2,s/12),0.30,{type:'sine',vol:0.17,delay:i*0.05})); },
  match:  ()=>{ [0,4,7,12,16].forEach((s,i)=>tone(659*Math.pow(2,s/12),0.32,{type:'triangle',vol:0.15,delay:i*0.05})); },
  miss:   ()=>tone(300,0.20,{type:'sawtooth',vol:0.15,slide:0.55}),
  hit:    ()=>{ noise(0.26,{vol:0.42,lp:520}); tone(96,0.24,{type:'square',vol:0.24,slide:0.5}); },
  smash:  ()=>{ noise(0.18,{vol:0.28,lp:1800}); tone(160,0.16,{type:'square',vol:0.14,slide:0.6}); },
  /* A tooth failing, not a firecracker. No transient at all — everything swells in
     — over about 1.7s: a low cluster of root, minor third and tritone, detuned
     against itself so it beats, sagging in pitch the whole way down, with grinding
     noise swept from a rumble into dust. Minor and unpleasant on purpose. */
  crumble:()=>{
    const root=68;
    [[1,0.075],[1.189,0.055],[1.414,0.042]].forEach(([mul,v],i)=>{
      tone(root*mul,      1.5,{type:'triangle',vol:v,     slide:0.62,delay:0.02+i*0.05});
      tone(root*mul*1.008,1.5,{type:'sine',    vol:v*0.7, slide:0.62,delay:0.03+i*0.05});
    });
    tone(root*0.5,1.7,{type:'sawtooth',vol:0.05,slide:0.60,delay:0.02});
    noise(1.35,{vol:0.15,lp:900,lpEnd:120,attack:0.16,delay:0.02});
    noise(0.90,{vol:0.07,lp:300,lpEnd:70, attack:0.30,delay:0.35});
  },
  upgrade:()=>{ [0,5,7,12,17].forEach((n,i)=>tone(523*Math.pow(2,n/12),0.34,{type:'square',vol:0.13,delay:i*0.06})); },
  /* Speech is a blip per glyph, the way an 8-bit box talks. The doctor sits lower
     than the intern so the two voices are told apart by ear. */
  speak:  low=>tone((low?148:262)+Math.random()*64,0.042,{type:'square',vol:0.05}),
  ui:     ()=>tone(880,0.07,{type:'square',vol:0.11}),
  start:  ()=>{ [0,7,12,19].forEach((s,i)=>tone(392*Math.pow(2,s/12),0.4,{type:'triangle',vol:0.18,delay:i*0.09})); },
  over:   ()=>{ [12,7,3,0].forEach((s,i)=>tone(392*Math.pow(2,s/12),0.5,{type:'triangle',vol:0.18,delay:i*0.16})); },
};

/* ── LEADERBOARD ────────────────────────────────────────────────────────── */
const LB_KEY='gw.crownrunner.hs.v2';
function lbLoad(){ try{ const v=JSON.parse(localStorage.getItem(LB_KEY)); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function lbSave(l){ try{ localStorage.setItem(LB_KEY,JSON.stringify(l.slice(0,10))); }catch(e){} }
function lbAdd(n,s){ const l=lbLoad(); l.push({n,s}); l.sort((a,b)=>b.s-a.s); lbSave(l); return l.slice(0,10); }
function lbQualifies(s){ const l=lbLoad(); return s>0 && (l.length<10 || s>l[l.length-1].s); }

/* ── STATE ──────────────────────────────────────────────────────────────── */
const PIPELINE=['SCAN','DESIGN','MILL','DELIVER'];
let mode='ATTRACT', G=null, T=0, idle=0, shake=0;
const objs=[], parts=[], pops=[], dust=[], bursts=[];
/* Arcade starbursts: eight spikes of blocks that shoot out and snap off, the way the
   reference sheet draws an explosion. The soft square particles stay for dust and
   powder, where a scatter is right — this is for the moment of a hit. */
function pixBurst(x,y,col,size){ bursts.push({x,y,col,size:size||1,t:0}); }
function drawBursts(){
  for(const s2 of bursts){
    const k=Math.max(2,Math.round(4*s2.size));
    const grow=s2.t/0.34, len=Math.round((1.5+grow*5.5)*s2.size);
    ctx.globalAlpha=clamp(1-grow,0,1);
    ctx.fillStyle=s2.col;
    for(let d=0;d<8;d++){
      const a=d*Math.PI/4, dx=Math.cos(a), dy=Math.sin(a);
      const from=Math.max(0,len-3);
      for(let i=from;i<=len;i++)
        ctx.fillRect(Math.round(s2.x+dx*i*k-k/2),Math.round(s2.y+dy*i*k-k/2),k,k);
    }
    ctx.globalAlpha=1;
  }
}

function newGame(){
  objs.length=0; parts.length=0; pops.length=0; bursts.length=0;
  G={ t:CFG.round, score:0, combo:1, level:1, caseNo:1, stamp:0,
      remakes:CFG.remakes, endedBy:'TIME', warn:0, ringFlash:0,
      stage:'RESTORE', implantQ:0, extracted:0, placed:0, inter:0, interText:null, wave:0,
      formX:0, formDir:1, rowZ:null, wave:0, ammo:null, misses:0, paused:false,
      queuePop:0, closing:0, warned9:false, podLabelled:false,
      salt:1+Math.floor(Math.random()*100000), tut:null,
      x:0, vx:0, roll:0, bob:0,
      speed:CFG.speed.base, thrust:1, power:100, slowing:false,
      tier:0, podIn:9,
      mag:[], mill:[], target:null, designFlash:0, spawnIn:0.6,
      hint:'HOLD  SCAN  ON  A  CRACKED  TOOTH', hintT:4,
      flash:0, flashCol:CFG.col.good, banner:null, bannerCol:CFG.col.white, bannerT:0,
      scans:0, seats:0, matches:0, lost:0, hits:0, pods:0 };
}
function banner(t,c){ G.banner=t; G.bannerCol=c; G.bannerT=1.15; }
function hint(t,s=2.8){ G.hint=t; G.hintT=s; }
function flash(c){ G.flash=1; G.flashCol=c; }
function scrParts(worldX,col,n,spd){
  const p=proj(worldX,PLANE_Y,SHIP_Z);
  for(let i=0;i<n;i++){ const a=rnd(0,6.283), v=rnd(spd*0.3,spd);
    parts.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,life:rnd(.35,.9),max:.9,col,sz:rnd(2,6)}); }
}

const tier=()=>CFG.scanner[G.tier];
/* One switch decides what the bore sends and what the mill cuts. */
const implanting=()=>G&&G.stage==='IMPLANT';
/* The free round between the lesson and the shift. The lesson teaches the three verbs one
   at a time behind a panel; this is the first time all three run together in the bore, and
   the one thing it takes away is the implant line. Watching a tooth come apart teaches
   nothing while you are still working out which one to point at — so here nothing is lost,
   nothing is timed, and a cracked tooth stays scannable the whole way in. The line, and the
   reason it exists, are met in the shift, by which point the loop is already in the hands. */
/* Deliberately still true while the round is handing over: the fade to black takes half a
   second, and dropping the flag early would pop the implant line back into a frame the
   player can still see. It clears when newGame() builds the shift. */
const practising=()=>!!(G&&G.practice);
const drill=()=>G&&G.practice?G.practice.id:null;
const PRACTICE_OUT=1.7;     // a beat to register the last case before the cut

/* Three drills, each between the plates that teach it, and each one verb wide. A lesson that
   explains all three and then asks for all three at once is a lesson the player fails at the
   first one and never finds out which. So: learn the scan, do three scans; learn the mill and
   the crown, do three seats with the scanning already done for you; then do the whole case.
   None of them has the implant line — that arrives with the shift, as a complication. */
const DRILLS={
  scan:{need:3, head:'SCAN DRILL',  count:'scans',
        hint:'HOLD  {SCAN}  ON  EVERY  CRACKED  TOOTH',
        banner:'SCAN ONLY  ·  NOTHING IS TIMED', next:'tutor'},
  seat:{need:3, head:'SEAT DRILL',  count:'seats',
        hint:'THESE ARE ALREADY SCANNED  ·  PRESS  {FIRE}',
        banner:'SEAT ONLY  ·  CROWNS ARE READY',   next:'full'},
  full:{need:3, head:'FULL CASE',   count:'seats',
        hint:'SCAN  ·  MILL  ·  SEAT',
        banner:'NOW THE WHOLE CASE',                next:'tutor'},
};
/* Which plate to come back to after a drill. Module scope on purpose: every drill starts with
   newGame(), which builds a fresh G, so anything parked on G would not survive the trip. */
let tutResumeStep=0;
/* Called wherever a countable thing happens. Each drill names the one it counts, so a scan
   during the seat drill — there are none, but still — cannot advance it. */
function drillTick(what){
  if(!practising()) return;
  const P=G.practice, D=DRILLS[P.id];
  if(D.count!==what || P.over>0) return;
  P.done++;
  if(P.done>=P.need){
    P.over=PRACTICE_OUT;
    banner(D.next==='tutor'?'GOOD  ·  CARRY ON':'GOOD  ·  NEXT',CFG.col.score);
  } else {
    banner(P.done+'  /  '+P.need,CFG.col.score);
  }
}
const stock=()=>implanting()?CFG.implants:CFG.crowns;
/* How far a cracked tooth has come through the work zone: 0 at the far edge,
   1 at the point of no return. Drives the visible decay. */
function decayOf(o){
  if(mode!=='PLAY') return 0;
  return clamp((scanFar()-o.z)/(scanFar()-scanNear()),0,1);
}
/* The implant line. Inside it there is no runway left to cut a crown and still fire
   it home, so the scanner will not open the case — clinically the tooth is past
   restoring and becomes an extraction and an implant instead. The in-range brackets
   vanish at the same boundary, which teaches 'scan early'. */
const scanNear=()=>SHIP_Z+420;
const scanFar=()=>SHIP_Z+(G?tier().range:1180);

/* ── SPAWNING ───────────────────────────────────────────────────────────── */
function freeX(z,gap){
  for(let i=0;i<24;i++){
    const c=rnd(-LANE_X,LANE_X);
    if(objs.every(o=>o.kind==='shot'||Math.abs(o.z-z)>520||Math.abs(o.x-c)>gap)) return c;
  }
  return null;
}
/* Three standing lanes for the drills, and never the same one twice running. Left to itself
   the spawner picks a uniform random x, which on a drill sending one tooth at a time means two
   and three in a row can arrive within a few units of each other — and a player who never has
   to move never learns that they can. Rotating the lane makes steering part of every rep
   without making it a separate lesson. The shift keeps the random spread: by then the bore is
   busy enough that position takes care of itself. */
const DRILL_LANES=[-150,0,150];
let lastLane=-1;
function drillLane(){
  let i; do{ i=(Math.random()*DRILL_LANES.length)|0; }while(i===lastLane);
  lastLane=i; return DRILL_LANES[i];
}
/* Drill teeth start 400 units short of the full bore. At drill speed the stretch from
   FAR_Z to the scan window alone is 3.2 seconds of watching a dot approach — dead time in
   the one place dead time costs the most. Spawned at 2600 they are tiny and dim on arrival
   (depth alpha covers the pop-in) and scannable in about a second and a half. */
const DRILL_Z=1600;
function spawnTooth(){
  const x=practising()?drillLane():freeX(FAR_Z,170);
  if(x===null) return;
  const z0=practising()?DRILL_Z:FAR_Z;
  /* The seat drill hands them over already opened: the scanning is the previous drill's
     subject, and asking for it again here would make this drill about two things. */
  if(drill()==='seat'){
    objs.push({kind:'tooth',state:'prepped',crown:pick(stock()),x,z:z0,pz:z0,
               r:44,scan:1,pulse:rnd(0,6.28),done:false,flake:0});
    return;
  }
  objs.push({kind:'tooth',state:'broken',crown:null,x,z:z0,pz:z0,
             r:44,scan:0,pulse:rnd(0,6.28),done:false,
             chip:[rnd(0,6.28),rnd(0,6.28),rnd(0,6.28),rnd(0,6.28)],flake:0});
}
/* Debris must never wall off the line the player has to shoot, so it keeps its
   distance from live teeth and stays capped. */
function spawnDebris(){
  if(objs.filter(o=>o.kind==='debris').length>=2) return;
  const x=freeX(FAR_Z,190); if(x===null) return;
  objs.push({kind:'debris',x,z:FAR_Z,pz:FAR_Z,r:36,spin:rnd(0,6.28),sv:rnd(-2.4,2.4),done:false,
             seed:[rnd(.7,1.3),rnd(.7,1.3),rnd(.7,1.3),rnd(.7,1.3),rnd(.7,1.3)]});
}
/* Scanner upgrade: the Glidewell G tile itself, floating in the bore. */
function spawnPod(){
  const x=freeX(FAR_Z,190); if(x===null) return;
  objs.push({kind:'pod',x,z:FAR_Z,pz:FAR_Z,r:38,spin:0,done:false});
}
/* Load the case into the wand's own mill. Nothing flies in from behind. */
function startMilling(crown){
  G.mill.push({crown,prog:0});
  SFX.millStart();
}

/* A tooth that reaches the point of no return breaks up completely. Without this
   the scan window just silently closed and there was no way to tell why. */
/* The tooth does not explode and it does not vanish — it comes apart over more than
   a second, as a process you watch. Dumping every fragment on one frame read as a
   single detonation however slow the fragments were, so the tooth now enters a
   'crumbling' state: it breaks into bands that slide and sink, sheds powder the
   whole way down, and only then goes. */
const CRUMBLE_SECS=1.25;
function beginCollapse(o){
  o.state='crumbling'; o.cr=0; o.puff=0;
  /* Nothing is simply discarded: past the line the tooth is an extraction, and
     extractions are what stage two exists to fix. */
  if(!implanting()){
    // practice does not put anybody on the surgery list
    if(!(G.tut&&G.tut.on)){
      G.extracted++; G.implantQ++; G.queuePop=1.0;
    }
    /* The stage used to hand over on the very frame the tenth extraction landed, and
       enterImplantStage kills every object outright — so teeth mid-flight and a crown in the
       magazine disappeared at once, which is what made the first stage feel like it was cut
       off rather than finished. Now the bench closes: no new teeth are sent, whatever is
       already in the bore flies through and can still be finished, and the hand-over waits
       for the bore to clear or for CLOSING_SECS, whichever comes first.

       One extraction earlier there is a word about it, because the queue along the foot of
       the screen is not where anyone is looking. */
    if(G.implantQ===CFG.implantsToAdvance-1 && !G.closing && !G.warned9){
      G.warned9=true;
      banner('ONE MORE  ·  THEN SURGERY',CFG.col.score);
    }
    if(G.implantQ>=CFG.implantsToAdvance && !G.closing){
      G.closing=CLOSING_SECS;
      banner('BENCH CLOSING  ·  FINISH THE CASE',CFG.col.score);
    }
  }
  if(G.target===o) G.target=null;
  G.ringFlash=0.55;
  SFX.crumble();
  dustFrom(o,7,0.5);            // the first fracture, and nothing more yet
}
/* The shift moves on. The clock and the bore hold while the doctor says so. */
const CLOSING_SECS=2.6;
/* Runs down the closing window: nothing new is sent, the cases in hand still count, and the
   hand-over happens the moment the bore is actually empty rather than on a fixed beat. */
function closingTick(dt){
  G.closing-=dt;
  const busy=objs.some(o=>!o.dead&&(o.kind==='tooth'||o.kind==='shot'))
          || G.mill.length>0 || G.mag.length>0;
  if(G.closing<=0 || !busy){ G.closing=0; enterImplantStage(); }
}
/* The line stopping ends the restoration shift — it does not end the day. Anything already
   extracted still needs an implant, and quietly dropping those cases is what made the second
   stage look like it randomly did not happen: burn three remakes at nine in the morning and
   the credit was over with two extractions sitting unoperated on the bench. Same rule as the
   whistle now — whatever accumulated goes to surgery, however the bench closed. */
function stopLine(){
  G.endedBy='REMAKES';
  if(G.implantQ>0 && !implanting()){
    banner('LINE STOPPED  ·  TO SURGERY WITH '+G.implantQ,CFG.col.score);
    enterImplantStage(); return;
  }
  endGame();
}
function enterImplantStage(){
  /* Capped to what the board can hold. The formation is two ranks of cols, so eleven lost
     teeth still make ten sockets — and the line that announces the number has to say the
     number you can count on screen, not the one in the tally. */
  G.waveSeed=Math.min(G.implantQ, CFG.surgery.cols*2);
  G.stage='IMPLANT'; G.implantQ=0; G.closing=0;
  G.interStep=0; G.inter=3.4;
  /* Through the same substitution as the lesson. These were the last two hard-coded key
     letters in the game — on a cabinet with no keyboard, 'Z' and 'X' name nothing. */
  /* The count is whatever the shift actually lost, so the line has to say that number. It read
     'TEN EXTRACTIONS' whatever was on the board — and the board is right there to be counted. */
  const N=G.waveSeed;
  const SPELL=['NO','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN'];
  const word=(N>=0&&N<SPELL.length)?SPELL[N]:String(N);
  G.interText=[word+(N===1?' EXTRACTION':' EXTRACTIONS')+' ON THE BENCH.',
               'NEAR RANK FIRST.  {SCAN}  PUTS THE',
               'FIXTURE IN,  {FIRE}  CAPS IT.'].map(btnSub);
  G.mag.length=0; G.mill.length=0; G.target=null;
  for(const o of objs) if(o.kind!=='socket'&&o.state!=='crumbling') o.dead=true;
  G.wave=0; spawnWave();
  SFX.upgrade(); flash(CFG.col.white);
}
/* A rank of sockets. Column spacing is bounded so the wand can still reach the
   outermost one when the formation is at the far end of its march. */
function spawnWave(){
  const S=CFG.surgery;
  G.wave++;
  /* Exactly the number of teeth the shift lost. Six extractions put six sockets on the board —
     this is your own backlog, not a level, and there is only ever one of them. The near rank
     takes the odd one, so it is always the fuller of the two and still shields the far one. */
  const FULL=S.cols*2;
  const total = clamp(G.waveSeed||FULL,1,FULL);
  const counts=[Math.ceil(total/2), Math.floor(total/2)];
  G.rowZ=[S.rowZ[0],S.rowZ[1]];
  G.formX=0; G.formDir=1;
  /* Stock against the board's own size: three spare crowns, so there is room for two misses and
     no more. It no longer has to run dry to bound the stage — clearing the board ends it. */
  G.ammo={imp:total+7, crown:total+3};
  for(let r=0;r<2;r++){
    const c=counts[r];
    for(let i=0;i<c;i++)
      objs.push({kind:'socket',row:r,col:i,
                 baseX:(i-(c-1)/2)*S.colGap,
                 x:0,z:G.rowZ[r],pz:G.rowZ[r],r:40,
                 need:'implant',done:false,pulse:rnd(0,6.28)});
  }
  hint(btnSub('NEAR RANK FIRST  ·  {SCAN} IMPLANT  ·  {FIRE} CROWN'),3.4);
}
const liveSockets=r=>objs.filter(o=>o.kind==='socket'&&!o.dead&&o.need&&o.row===r).length;
/* The rank you can hit: the near one until it is finished. */
function activeRow(){ return liveSockets(0)>0?0:(liveSockets(1)>0?1:-1); }

function dustFrom(o,n,scale){
  const p=proj(o.x,PLANE_Y,o.z), R=o.r*p.s;
  for(let i=0;i<n;i++){
    const a=rnd(0,6.283), v=rnd(5,34)*scale;
    parts.push({x:p.x+rnd(-R*0.8,R*0.8), y:p.y+rnd(-R*0.8,R*0.8),
                vx:Math.cos(a)*v, vy:Math.abs(Math.sin(a))*v*0.6+rnd(3,20),
                g:50, drag:1.8, life:rnd(0.9,1.9), max:1.9,
                col:i%4?'#8A8275':'#D8D0BE', sz:rnd(1.3,3.2)});
  }
}
function chunkFrom(o,n){
  const p=proj(o.x,PLANE_Y,o.z), R=o.r*p.s;
  for(let i=0;i<n;i++){
    const a=rnd(0.2,2.94), v=rnd(24,96);
    parts.push({x:p.x+rnd(-R*0.5,R*0.5), y:p.y+rnd(-R*0.35,R*0.5),
                vx:Math.cos(a)*v*0.7, vy:Math.abs(Math.sin(a))*v*0.5,
                g:420, life:rnd(0.7,1.4), max:1.4,
                col:i%2?'#5C5548':'#7E7566', sz:rnd(4,8)});
  }
}

/* ── SCAN / FIRE ────────────────────────────────────────────────────────── */
function bestTarget(){
  let b=null;
  for(const o of objs){
    if(o.kind!=='tooth'||o.state!=='broken'||o.done) continue;
    // no line in practice, so the case never closes on distance — scan it right up to the wand
    if(o.z<(practising()?NEAR_CULL:scanNear())||o.z>scanFar()) continue;
    if(Math.abs(o.x-G.x)>tier().align) continue;
    if(!b||o.z<b.z) b=o;
  }
  return b;
}
function fire(){
  /* Silently, not with NO CROWN ABOARD. During the scan drill the crown button is simply not
     part of the game yet, and telling someone their magazine is empty is an answer to a
     question they have not been taught to ask. */
  if(drill()==='scan') return;
  if(!G.mag.length){ SFX.miss(); banner('NO CROWN ABOARD',CFG.col.dim); return; }
  const crown=G.mag.shift();
  objs.push({kind:'shot',crown,x:G.x,z:SHIP_Z+40,pz:SHIP_Z+40,r:30,spin:0,done:false});
  SFX.fire();
}
/* Whether a kind is drawn from stock at all. One place, because four others ask. */
const freeStock=k=>k==='implant'?CFG.surgery.unlimitedImplants:CFG.surgery.unlimitedCrowns;
/* Stage two fires from stock, when the stock is counted: one button per kind, and
   nothing is refunded. */
function fireStock(kind){
  const S=CFG.surgery, box=kind==='implant'?'imp':'crown';
  const free=freeStock(kind);
  if(!free){
    if(G.ammo[box]<=0){ SFX.miss(); banner('OUT OF '+kind.toUpperCase()+'S',CFG.col.bad); return; }
    G.ammo[box]--;
  }
  objs.push({kind:'shot',crown:kind==='implant'?S.implant:S.crown,ptype:kind,
             x:G.x,z:SHIP_Z+40,pz:SHIP_Z+40,r:30,spin:0,done:false});
  SFX.fire();
}

/* ── UPDATE ─────────────────────────────────────────────────────────────── */
let scroll=0;
function update(dt){
  T+=dt;
  /* The shift is over and the picture is fading. Nothing may move, spawn, march or breach
     behind the black — but the scene keeps being drawn, so what fades is the bore the player
     was just looking at. Above camTick as well: a zoom easing under the fade would be a thing
     happening in a scene that has ended. */
  if(ending) return;
  /* Above every early return in this function. The lesson can hand the frame back
     to itself for a dozen reasons — a panel typing, a prop being resent, the
     intermission — and if the ease only ran on the paths that reach the bottom,
     the zoom would stick wherever it happened to be when one of them fired. */
  camTick(dt);
  shake=Math.max(0,shake-dt*3.2);
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=(p.g===undefined?520:p.g)*dt;
    if(p.drag){ const k=1-p.drag*dt; p.vx*=k; p.vy*=k; }
    p.life-=dt;
    if(p.life<=0) parts.splice(i,1); }
  for(let i=pops.length-1;i>=0;i--){ pops[i].t+=dt; if(pops[i].t>1.1) pops.splice(i,1); }
  for(let i=bursts.length-1;i>=0;i--){ bursts[i].t+=dt; if(bursts[i].t>0.34) bursts.splice(i,1); }

  const sp = mode==='PLAY' ? G.speed*G.thrust : CFG.speed.base*0.8;
  scroll+=sp*dt;
  if(A.drone){ const tgt=mode==='PLAY'?0.055:0.02;
    A.drone.gain.value=lerp(A.drone.gain.value,tgt,dt*3);
    A.droneF.frequency.value=lerp(A.droneF.frequency.value,160+sp*0.34,dt*3); }

  if(mode!=='PLAY'){
    scanHumOn(false,0);
    if(objs.length<6 && Math.random()<dt*2){
      const r=Math.random();
      objs.push(r<0.6
        ? {kind:'tooth',state:'broken',crown:null,x:rnd(-LANE_X,LANE_X),z:FAR_Z,pz:FAR_Z,r:44,scan:0,pulse:0,done:true,
           chip:[0,0,0,0]}
        : {kind:'tooth',state:'prepped',crown:pick(stock()),x:rnd(-LANE_X,LANE_X),z:FAR_Z,pz:FAR_Z,r:44,scan:1,pulse:0,done:true});
    }
    for(let i=objs.length-1;i>=0;i--){ const o=objs[i]; o.pz=o.z; o.z-=sp*dt;
      o.pulse=(o.pulse||0)+dt*3;
      if(o.z<NEAR_CULL) objs.splice(i,1); }
    return;
  }

  if(G.paused) return;               // frozen: the clock, the bore and the formation

  /* The stage hand-off pauses the round rather than switching mode, so the bore and
     the HUD stay exactly where they were. */
  if(G.inter>0){
    G.inter-=dt;
    const skip=Input.fireEdge||Input.scanEdge||Input.slowEdge||Input.startEdge;
    if(G.inter<=0||skip){
      if(G.interStep===0){ G.interStep=1; G.inter=3.6; SFX.ui(); }
      else G.inter=0;
    }
    return;
  }

  if(G.tut&&G.tut.on){ if(tutorTick(dt)) return; }
  if(G.closing>0){ closingTick(dt); }
  if(!(G.tut&&G.tut.on)&&G.inter<=0&&!G.paused) jimTick(dt);

  /* ── live game ── */
  // the pre-level is untimed: the clock only starts on the real shift
  /* The clock holds through surgery. It used to keep running, so arriving at the second
     stage with twenty seconds left meant being cut off mid-operation with ten sockets still
     on the board — which reads, correctly, as the game breaking rather than as a rule. The
     second stage is a set piece and ends on its own terms: out of crowns, out of remakes,
     or a rank reaching the wand. It stays bounded because each wave issues one part fewer
     than the last (surgery.ammoStep is -1), so the stock runs out on its own. */
  if(!(G.tut&&G.tut.on)&&!implanting()&&!practising()){
    G.t-=dt;
    if(G.t<=0){
      G.t=0;
      /* The whistle. Anything left on the bench goes to surgery; a shift that lost nothing has
         nothing to operate on, so it ends here — which is the only way to finish without the
         second stage, and it takes a flawless run. */
      if(G.implantQ>0&&G.closing<=0){
        G.closing=CLOSING_SECS;
        banner('TIME  ·  TO SURGERY WITH '+G.implantQ,CFG.col.score);
      } else if(G.implantQ<=0){ endGame(); return; }
    }
  }
  G.level=1+Math.floor((CFG.round-G.t)/CFG.levelSec);
  if(!(G.tut&&G.tut.on)&&!practising())
    G.speed=Math.min(CFG.speed.max,CFG.speed.base+(G.level-1)*CFG.speed.perLevel);

  /* Slowing is the strategic resource: it buys time to line up a scan or a
     shot, and it is the only thing POWER pays for. */
  G.slowing=Input.slow&&G.power>2;
  if(G.slowing){ G.power=Math.max(0,G.power-dt*CFG.power.drain); G.thrust=lerp(G.thrust,CFG.speed.slow,dt*6); }
  else { G.power=Math.min(100,G.power+dt*CFG.power.regen); G.thrust=lerp(G.thrust,1,dt*4); }

  /* Aim. This used to read the stick as a POSITION — the target was `axis * SHIP_MAX_X`, so a
     panel stick, which only ever reports -1, 0 or +1, could only ever ask for hard left, centre
     or hard right. Hold it and the wand flew to the wall; let go and it snapped back. Three
     places, and no way to sit between them.

     Now the stick asks for a VELOCITY: it accelerates while held, coasts to a stop when let
     go, and the position is whatever that adds up to. Hold it briefly and you move a little.
     A mouse still works positionally, because a mouse genuinely does report a position. */
  const ax=Input.axis;
  /* The panel takes the wand off the mouse and keeps it. ptrX is set the first time a pointer
     crosses the canvas and never cleared, so the moment a stick or an arrow key was released
     the code fell into the mouse branch and drove the wand back to wherever the cursor happened
     to be — which on a cabinet, or on a laptop with the pointer parked in the middle, looks
     exactly like a spring pulling it to the centre. Moving the mouse again hands it back. */
  if(ax!==0) ptrX=null;
  if(ax===0 && ptrX!==null){
    const tx=clamp(ptrX*1.15,-1,1)*SHIP_MAX_X;
    G.vx=lerp(G.vx,(tx-G.x)*7.6,dt*9);
  } else {
    G.vx += ax*SHIP_ACCEL*dt;
    if(ax===0) G.vx -= G.vx*Math.min(1,dt*14);          // coast down, do not stop dead
    G.vx = clamp(G.vx,-SHIP_VMAX,SHIP_VMAX);
  }
  const nx=G.x+G.vx*dt;
  if(nx<=-SHIP_MAX_X||nx>=SHIP_MAX_X) G.vx=0;           // no bouncing off the walls
  G.x=clamp(nx,-SHIP_MAX_X,SHIP_MAX_X);
  G.roll=lerp(G.roll,clamp(G.vx/900,-.5,.5),dt*7);
  G.bob=Math.sin(T*2.6)*5;

  // spawn pressure — stage one only; stage two arrives as a formation
  if(!implanting()&&!(G.tut&&G.tut.on)){
  G.spawnIn-=dt;
  /* A drill holds exactly one tooth. One is a rep; a stream is a shift, and the first cut
     of this put teeth on a one-second timer regardless of what was already in the bore —
     which is how "too many at once" happens in the one mode built for repetition. The
     steady timer is disarmed entirely: the ONLY way a drill tooth spawns is the bore going
     empty, and then it comes at once. */
  if(practising()){
    /* "Busy" means the rep is unfinished, not that something is still on screen. On the scan
       drill the job is over the instant the tooth is scanned — it then coasts past the wand
       with nothing left to do, and waiting for it to clear cost about three seconds of empty
       bore between every rep. The other two drills genuinely are unfinished until the crown
       is on, and a seated tooth sets done itself. */
    const id=G.practice.id;
    const alive=objs.filter(o=>o.kind==='tooth'&&!o.dead&&!o.done);
    /* The next tooth waits on the SCAN, not on the crown being seated. Holding it back until
       the case was finished meant that carrying a milled crown stopped new teeth arriving —
       from the seat it looks exactly like the scanner refusing to work while something is
       aboard. It is also the wrong lesson: the whole point of the pipeline is that the
       scanner takes the next tooth while the mill is still cutting the last one. The seat
       drill is the exception, because there the arriving tooth IS the work. */
    const unfinished = id==='seat' ? alive.some(o=>o.state==='prepped')
                                   : alive.some(o=>o.state==='broken');
    /* …and never more than two on the glass at once. Releasing on the scan alone let a third
       arrive while two scanned ones were still coasting out, which is the clutter this mode
       is supposed to be free of: one to work, one leaving. */
    const busy = unfinished || alive.length>=2;
    G.spawnIn = (!busy&&G.practice.over<=0) ? Math.min(G.spawnIn,0.2) : 999;
  }
  // bent, not linear — see CFG.spawn.curve
  const shift=Math.pow(clamp(1-G.t/CFG.round,0,1),CFG.spawn.curve);
  // the bench is closed to new cases while it is closing, timer already due or not
  if(G.spawnIn<=0&&G.closing<=0){
    spawnTooth();
    G.spawnIn=practising()?999:lerp(CFG.spawn.gapStart,CFG.spawn.gapEnd,shift);
  }
  const elapsed=CFG.round-G.t;
  if(G.closing<=0&&elapsed>CFG.spawn.debrisAfter
     &&Math.random()<dt*CFG.spawn.debrisRate*shift*2)
    spawnDebris();
  G.podIn-=dt;
  if(G.podIn<=0&&G.closing<=0){ spawnPod(); G.podIn=rnd(13,19); }
  }

  /* Scanning: hold the button with a tooth aligned ahead. Nothing gates it. A full magazine
     used to block acquisition — the reasoning was that the milled crown would otherwise be
     discarded — but from the seat that is the instrument refusing to do its one job because
     you are carrying something, which is not a rule anybody reads off the screen. The case is
     protected at the other end instead: the mill HOLDS a finished crown until a slot frees
     (see the mill loop below), so nothing is lost and nothing is barred. */
  if(implanting()){
    surgeryTick(dt);
    if(mode!=='PLAY') return;          // a breach can end the round outright
  } else {
  const prev=G.target;
  G.target = Input.scan ? bestTarget() : null;
  if(G.target&&G.target!==prev) SFX.lock();
  scanHumOn(!!G.target, G.target?G.target.scan:0);
  for(const o of objs){
    if(o.kind!=='tooth'||o.state!=='broken') continue;
    if(o===G.target){
      o.scan=Math.min(1,o.scan+dt/tier().time);
      if(o.scan>=1){

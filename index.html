/* ── FLOW ───────────────────────────────────────────────────────────────── */
function startGame(){ SFX.start(); enterPlay(); }
/* A taught pre-level. One tooth, at half speed, and at each beat the thing that
   matters is picked out on screen for a second before a short panel explains it.
   Nothing is on a timer and nothing can be lost here — this is where the verbs are
   learned, so the shift proper starts with the player already knowing them. */
/* One onboarding instead of two. The comic panels and the guided level said the
   same things twice, so the doctor and the intern moved into the level: he explains
   the element that is lit, she asks the question a first-timer actually has, and the
   text still types itself out in their two voices. */
/* `tooth:true` marks a beat that cannot come true without a cracked tooth in the bore,
   and `hold` is the one line kept on screen while the beat is still waiting — see
   tutorTick for why both exist. */
/* Five beats, down from nine. On a stand nobody is going to sit through a lesson, and
   four of the nine were not teaching a verb: the closing ring repeated the beat before
   it, "SEATED — A CASE CLOSED" only narrated something the screen had just shown, the
   mill and the magazine were the same action split in two, and the remake rule was a
   fact about the slip rather than something to do. What is left is scan, the line, cut
   and fire, the mark, the moisture. Placeholders in braces are swapped for whatever is
   printed on the cabinet's own buttons — see applyBtnLabels. */
/* `at` is when the beat may speak; `done` is when the player has actually done the thing
   it taught. A beat is not finished by dismissing its panel — it is finished by the verb.
   Without that the lesson talked over itself: the implant-line beat answers at() with a
   flat true, so 1.1s after the scan panel was dismissed it fired again, mid-scan, and the
   player was interrupted in the middle of the one action they had just been asked to do.
   A beat with no verb to practise says done:()=>true and passes straight through. */
/* `zoom` is how far the lesson pushes in while the beat is current. Three of them
   have one, and they are the three that carry the actual idea of the cabinet: the
   scan, the cut, the seat. Everything else stays at 1 — a zoom on every beat is a
   camera that never sits still, and it stops meaning "look here". */
const TUTOR=[
 {tgt:'tooth', zoom:1.7,
  text:['THIS TOOTH IS CRACKED.','HOLD  {SCAN}  TO SCAN IT.'],
  tooth:true, hold:'HOLD  {SCAN}  ON THE CRACKED TOOTH',
  at:()=>{const t=tutTooth(); return t&&t.state==='broken'&&t.z<scanFar();},
  done:()=>G.scans>0, diagram:'scan', drillAfter:'scan'},
 /* One beat, not two. The file and the cut were separate screens saying consecutive halves of
    the same sentence, and the lesson is meant to be short — so the ones and zeros are now the
    first second of the mill plate rather than a stop of their own. Straight on from the scan,
    and deliberately not back through the bore: scan, cut, seat is one continuous thing, which
    is the argument the cabinet exists to make. */
 {tgt:'mill',
  text:['THE SCAN GOES TO THE MILL.','IT CUTS THE CROWN HERE.'],
  at:()=>true, done:()=>true, diagram:'mill', anim:3.6},
 /* The one stage the player performs rather than watches, and it is performed with the same
    button that fires a crown in the shift — so the lesson is not a demonstration of seating,
    it is seating. `verb` names the input the beat is waiting for; the panel will not move on
    until it has been given. */
 {tgt:'seated',
  text:['NOW SEAT IT.','PRESS  {FIRE}.'],
  at:()=>true, done:()=>true, diagram:'seat', verb:'fire', drillAfter:'seat'},
 /* The implant line and the moisture used to be taught here, and they were the two beats that
    broke the sequence: both are about the bore, so both dropped the plate and threw the player
    back into the tunnel in the middle of a lesson that had just spent four screens staying out
    of it. They are also the two that teach themselves. The line carries a permanent label in
    play — NO CROWN BEYOND THIS POINT, drawn on the ring itself — and moisture announces what it
    costs the first time it is hit. What is left is one unbroken run: scan, file, cut, seat. */
 /* The send-off. The lesson has to end on somebody saying it is over, or the plate simply
    stops appearing and the player is left wondering whether they missed something. */
 {text:['THAT IS THE WHOLE JOB.','YOU ARE READY.'],
  at:()=>true, done:()=>true, finale:true, diagram:'recap'},
];
/* The raw templates are kept so the labels can be re-applied when the panel is rebound
   without reloading the page. */
const TUTOR_RAW=TUTOR.map(b=>({text:b.text.slice(), hold:b.hold}));
function applyBtnLabels(){
  TUTOR.forEach((b,i)=>{
    b.text=TUTOR_RAW[i].text.map(btnSub);
    if(TUTOR_RAW[i].hold) b.hold=btnSub(TUTOR_RAW[i].hold);
  });
}
/* The tooth the lesson is about is one with work left in it. Any tooth used to count,
   and a crowned one takes about six seconds to drift from where it was seated out past
   the wand — for all of that time it answered "is there a tooth?" with yes, so no
   replacement was sent and the beats could not fire on it either. Four of those in a
   row is most of the pre-level spent watching a finished case leave.

   A prepped one counts only while a crown is actually on its way — in the mill or in the
   magazine. Prepped with nothing coming means the shot was missed and the case is
   already lost, and letting it stand in for a live tooth bought another six seconds of
   watching it fall. The cracked tooth is looked for first so the lesson always reads the
   case the player is working, not one drifting out behind it. */
const tutTooth=()=>
     objs.find(o=>o.kind==='tooth'&&!o.dead&&o.state==='broken')
  || objs.find(o=>o.kind==='tooth'&&!o.dead&&o.state==='prepped'
                  &&(G.mill.length>0||G.mag.length>0));
const tutObj=k=>objs.find(o=>o.kind===k&&!o.dead);
/* A seated case: the tooth is still in the bore for a few seconds after the crown
   goes in, and that is the window the closing beat speaks in. */
const tutObj2=(k,st)=>objs.find(o=>o.kind===k&&!o.dead&&o.state===st);
/* Is the player in the middle of something? A scan part-way round the ring, a shot still
   travelling, a crown on the cutter or waiting in the magazine. Used only to hold off the
   timeouts: someone who is working must never be timed out of the beat they are working
   on, however long they take over it. */
const tutBusy=()=>
     objs.some(o=>o.kind==='shot'||(o.kind==='tooth'&&o.scan>0&&o.scan<1))
  || G.mill.length>0 || G.mag.length>0;
/* Props for the lesson are placed near the wand, not sent from the far wall. At
   scanning distance the mark and the debris were specks, so the doctor's line about
   them arrived before there was anything on screen to look at. This puts each one
   close enough to read the moment it is mentioned, and near enough the centre that
   it is reachable once the panel clears. */
/* The lesson's own tooth. spawnTooth() sends one from the far wall and can decline the
   spot altogether if a prop is parked there — at the pre-level's reduced speed that
   meant four seconds of empty bore at best and an endless one at worst. This one is
   placed inside scanning range straight away and never refuses. */
function tutSendTooth(){
  const z=SHIP_Z+1700;
  objs.push({kind:'tooth',state:'broken',crown:null,x:rnd(-90,90),z,pz:z,
             r:44,scan:0,pulse:0,done:false,flake:0,
             chip:[rnd(0,6.28),rnd(0,6.28),rnd(0,6.28),rnd(0,6.28)]});
}
function tutProp(kind){
  const before=objs.length;
  if(kind==='pod') spawnPod(); else spawnDebris();
  if(objs.length===before){
    // the placement guard declined the spot; the lesson still needs the prop
    objs.push(kind==='pod'
      ? {kind:'pod',x:0,z:FAR_Z,pz:FAR_Z,r:38,spin:0,done:false}
      : {kind:'debris',x:0,z:FAR_Z,pz:FAR_Z,r:36,spin:0,sv:1.4,done:false,
         seed:[1,1.12,0.9,1.2,1.02]});
  }
  const o=tutObj(kind);
  if(o){ o.z=SHIP_Z+560; o.pz=o.z; o.x=clamp(o.x,-140,140); }
}
/* Taught once per launch. Whoever put a second credit in has just been through it, and
   sitting them back down in the lesson is the fastest way to lose them. Deliberately not
   persisted: the cabinet runs all day in front of a new person every time, so a fresh
   start of the page teaches again. Finishing it and skipping it both count. */
let taught=false;
function enterPlay(){
  newGame(); mode='PLAY'; idle=0;
  if(taught){ hint('SCAN THE CRACKED TEETH',3); return; }
  // a short opening gap: the first lesson has to land before a curious player scans
  G.tut={on:true,step:0,paused:false,seen:false,hlT:0,ch:0,rch:0,cool:0.6};
  G.speed=CFG.speed.base*0.45;
  tutSendTooth();
  if(TUTOR[0].enter) TUTOR[0].enter();
}
/* The lesson hands over to a free round, not to the shift. Three verbs learned one at a
   time behind panels do not yet add up to the job: this is where they run together, in the
   bore, at the player's own pace. */
function startDrill(id){
  const D=DRILLS[id];
  camReset();                      // nothing past the lesson is played zoomed
  newGame();                       // a clean bore, with nothing carried over
  G.tut=null;
  G.practice={id, need:D.need, done:0, over:0, leaving:false};
  /* Faster than the lesson's 45%, slower than the opening of a shift. The point is that
     there is time to look at a tooth before deciding, not that nothing moves. */
  G.speed=CFG.speed.base*0.58;
  G.spawnIn=1.2;
  banner(D.banner,CFG.col.score);
  /* hint() does not substitute — every caller does its own, and the brace is not in the face,
     so an unsubstituted {FIRE} draws as ?FIRE? rather than as the letter on the cap. */
  hint(btnSub(D.hint),4.5);
}
/* A drill is over. Either the next drill follows straight on, or the lesson picks up at the
   plate after the one that sent us here. */
function afterDrill(id){
  const nx=DRILLS[id].next;
  if(nx==='tutor') resumeTutor();
  else startDrill(nx);
}
function resumeTutor(){
  camReset();
  newGame();
  G.tut={on:true, step:tutResumeStep, paused:false, seen:false, hlT:0, ch:0, rch:0, cool:0.6};
  G.speed=CFG.speed.base*0.45;
  const st=TUTOR[tutResumeStep];
  /* Only the beats that talk about something in the bore need a prop sent. The mill, the seat
     and the send-off all play on their own plate, and spawning a tooth under them just puts
     something wandering about behind the panel. */
  if(st&&st.tgt==='tooth') tutSendTooth();
  if(st&&st.enter) st.enter();
}
function startShift(){
  camReset();
  G.tut=null; taught=true;
  newGame();                       // a clean shift, with nothing carried over
  /* The line is the shift's first new rule, so it is named on arrival rather than
     discovered by losing a tooth to it. It was present from the first frame before the
     free round existed; now it is a complication, and complications get announced. */
  banner('THE SHIFT  ·  MIND THE LINE',CFG.col.red);
  /* The instruction, not a second copy of the banner. The ring carries its own caption —
     IMPLANT LINE / NO CROWN BEYOND THIS POINT — so a third sentence about the line meant
     three messages saying one thing in three voices, stacked on top of each other. */
  hint('SCAN THE CRACKED TEETH',3);
  G.ringFlash=0.9;                 // and the line itself flares, which is what to look at
}
/* Returns true while the pre-level owns the frame, so update() stops there. */
function tutorTick(dt){
  const U=G.tut, st=TUTOR[U.step];
  if(U.leaving) return true;              // frozen behind the fade until the shift takes over
  /* Above the paused branch, because the seat plate has to animate while its panel is on
     screen — that is the only moment anybody is looking at it. It starts after the element
     has had its second alone, so the crown is not already down before the eye arrives. */
  if(st&&st.anim){ if(U.hlT<=0) U.animT=(U.animT||0)+dt; }
  else if(st&&st.verb){ if(U.verbDone) U.animT=(U.animT||0)+dt; }
  else { U.animT=0; U.verbDone=false; }
  /* Push in on whatever this beat is about, and hold it until the beat is finished —
     not just while its panel is up. The scan and the seat are things the player has
     to *do*, and pulling back the moment the panel clears would hide the very action
     the zoom was there to show. tutTarget reads the unzoomed projection, which is
     exactly the focus point wanted. If the thing has left the bore, ease back out. */
  const zb=(st&&st.zoom)?tutTarget(st.tgt):null;
  if(zb){ CAM.want=st.zoom; CAM.wx=zb.x+zb.w/2; CAM.wy=zb.y+zb.h/2; }
  else CAM.want=1;
  /* All three buttons together skips the lesson. Held rather than tapped, and for long
     enough to be a decision: a visitor mashing through the panels must not be able to
     drop out of the training by accident, and someone who already knows the game should
     not have to sit through it. Checked before the paused branch so it works with a
     panel on screen, which is where anyone who wants out will be. */
  if(Input.scan&&Input.fire&&Input.slow){
    U.skip=(U.skip||0)+dt;
    // holding all three skips the free round as well: whoever does this already knows the game
    if(U.skip>=TUTOR_SKIP){ SFX.ui(); startShift(); return true; }
  } else U.skip=0;
  if(U.paused){
    if(U.hlT>0){ U.hlT-=dt; return true; }     // the element gets its second alone
    const mainLen=st.text.join('').length, replyLen=st.reply?st.reply.length:0;
    const typing=U.ch<mainLen||U.rch<replyLen;
    const press=Input.fireEdge||Input.scanEdge||Input.slowEdge
              ||Input.startEdge||Input.enterEdge;
    /* A plate that is mid-cut cannot be skipped past. The three seconds the mill takes are
       the answer to the question the intern just asked, so a player who taps through them is
       told nothing — and told it twice, because the next beat lands on an empty plate. */
    const playing = st.anim && (U.animT||0) < st.anim;
    /* A beat with a verb hands the button over instead of consuming it: the first press
       finishes the line as always, then FIRE seats the crown, and only after it is down does
       another press move the lesson on. Pressing anything else does nothing, so the button
       being taught is the button that works. */
    if(st.verb&&!typing&&!U.verbDone){
      if(Input.fireEdge){ U.verbDone=true; U.animT=0; SFX.dock(); }
      return true;
    }
    // the landing flash is part of the beat, so the gate outlasts the travel by its length
    const seating = st.verb && U.verbDone && (U.animT||0) < SEAT_SECS+0.32;
    /* And then it goes on by itself. Asking for a second press after the crown is already on
       is a button press that changes nothing — you have done the thing, you watch it land, the
       lesson carries you. A beat left waiting there felt like the game had stalled. */
    if(st.verb && U.verbDone && (U.animT||0) >= SEAT_SECS+1.15){
      U.paused=false; U.doing=true; U.cool=TUT_GAP(); U.wait=0;
      return true;
    }
    if(press && !((playing||seating) && !typing)){
      /* Same two stages as before: the first press finishes the line, the next one
         lets the level run on. */
      if(typing){ U.ch=mainLen; U.rch=replyLen; }
      else {
        /* Dismissing the panel does not finish the beat — it hands the controls back so
           the beat can be practised. The step only moves on once done() says the verb
           happened. */
        if(st.finale){ U.leaving=true; wipeTo(startShift); SFX.ui(); return true; }
        U.paused=false; U.doing=true; U.cool=TUT_GAP(); U.wait=0;
      }
      SFX.ui();
      return true;
    }
    if(U.ch<mainLen){
      const was=Math.floor(U.ch);
      U.ch=Math.min(mainLen,U.ch+TYPE_CPS*dt);
      speakFor(st.text.join(''),was,Math.floor(U.ch),true);
    } else if(U.rch<replyLen){
      const was=Math.floor(U.rch);
      U.rch=Math.min(replyLen,U.rch+TYPE_CPS*dt);
      speakFor(st.reply,was,Math.floor(U.rch),false);
    }
    return true;
  }
  /* A missed shot used to end the lesson for good: the tooth was gone, no more are
     sent during the pre-level, and the beat that closes the loop waits on a seated
     crown that could never happen. So while the loop is unfinished, another tooth is
     always sent — as many as it takes to get the whole cycle done once.

     The guard used to read `G.seats===0`, which is the wrong question, and it is what
     left you flying with nothing to do. Anyone who works the pipeline faster than the
     beats fire — and the gap between beats is 1.7s — seats a crown while the beat about
     the closing ring is still current. From then on G.seats is 1, so no tooth is ever
     sent again, and the three beats about the ring, the mill and the magazine each sit
     out their full nine-second timeout over an empty bore: nearly half a minute of
     flying. The question is what the *current beat* needs, not how far the player got. */
  /* Aged here, above both early returns. Left further down it was reset every time a
     replacement tooth was sent, so a beat waiting on a button that never gets pressed
     could never age out either — the lesson stayed put indefinitely. It is a safety
     valve; it has to keep counting whatever else the frame decides to do. */
  U.wait=(U.wait||0)+dt;
  /* A beat drawn on a plate has the bore behind it, so the player cannot line up on the
     thing they are being asked to scan or hit — and these beats are about the verb, not
     about the aim, which the shift proper teaches on its own. The lesson's tooth keeps
     station with the wand while a diagram is up, so holding the button is enough. */
  if(st&&st.diagram){
    const t=tutTooth();
    if(t) t.x += (G.x-t.x)*Math.min(1,dt*4);
  }
  const needsTooth = st && st.tooth && !tutTooth() && !objs.some(o=>o.kind==='shot');
  if(needsTooth){
    U.retry=(U.retry||0)+dt;
    if(U.retry>0.25){
      U.retry=0; tutSendTooth();
      hint(G.seats===0 ? 'CASE LOST — HERE IS ANOTHER. RUN IT AGAIN.'
                       : 'ANOTHER TOOTH — LET US TAKE IT FROM THE TOP.',2.6);
    }
    return false;
  }
  U.retry=0;

  /* The beat has been explained and the player is working on it. Nothing else may speak
     until they have finished — that is the whole of what "the logic should teach" means
     here. The one-line reminder stays up, and the safety valve only counts while the
     player is idle, so a slow scan or a crown still in the mill never times them out. */
  if(U.doing){
    if(st&&st.done&&!st.done()){
      if(st.hold&&!U.paused&&U.wait>TUTOR_GAP+0.9&&G.hintT<=1.0) hint(st.hold,1.4);
      if(st.enter&&st.tgt&&!tutObj(st.tgt)) st.enter();
      if(U.wait>18&&!tutBusy()){ U.wait=0; }        // fall through and move on
      else return false;
    }
    U.doing=false;
    /* The beat is finished and it owes a drill: park the plate we would have gone to next and
       hand the bore over. resumeTutor() picks it up from there when the drill is done. */
    if(st&&st.drillAfter){
      tutResumeStep=U.step+1; U.leaving=true;
      wipeTo(()=>startDrill(st.drillAfter));
      return true;
    }
    U.step++; U.ch=0; U.rch=0; U.wait=0; U.cool=TUT_GAP();
    U.seen=false;
    if(U.step>=TUTOR.length){ startShift(); return true; }
    const nx=TUTOR[U.step]; if(nx.enter) nx.enter();
    return false;
  }

  // let the level move for a beat before the next one is allowed to interrupt
  if(U.cool>0){ U.cool-=dt; return false; }

  /* A beat that waits on a prop could hang the whole lesson: collect the mark or let
     the debris go by during the gap between beats and the thing it is about is gone,
     so the condition can never come true — and because the pre-level is still running
     no teeth arrive either. You end up flying an empty bore forever. Two guards: send
     the prop again if it has vanished, and skip any beat that somehow still has not
     fired, rather than let it block the shift. */
  /* Once a panel is dismissed the level runs on with nothing on screen saying what it
     is waiting for, so a player who did not act on the line has no way back to it. The
     beat's own one-line instruction stays up until the beat fires — held at full
     strength, and never over the top of a message that is already running. */
  /* Only once the panel is gone. With one up, the banner and the bubble said the same
     sentence at the same time in two different voices. */
  if(st&&st.hold&&!U.paused&&U.wait>TUTOR_GAP+0.9&&G.hintT<=1.0) hint(st.hold,1.4);
  if(st&&st.enter&&st.tgt&&!tutObj(st.tgt)) st.enter();
  if(U.wait>13&&!tutBusy()){
    // the same escape hatch as above: a stalled beat still owes its drill
    if(st&&st.drillAfter){
      tutResumeStep=U.step+1; U.leaving=true;
      wipeTo(()=>startDrill(st.drillAfter));
      return true;
    }
    U.step++; U.ch=0; U.rch=0; U.wait=0; U.cool=0.6;
    U.seen=false;
    if(U.step>=TUTOR.length){ startShift(); return true; }
    const nx=TUTOR[U.step]; if(nx.enter) nx.enter();
    return false;
  }
  if(st&&st.at()){
    /* No highlight second on a plate beat. hlT exists to pick an element out of the bore
       before anybody talks about it — but a plate beat has nothing in the bore to point at,
       and drawTutor returns before the figures while it counts down. So the plate went up,
       sat there for a full second on its own, and only then did Jim arrive. */
    U.paused=true; U.seen=true; U.hlT=st.diagram?0:1.0;
    U.ch=0; U.rch=0; U.wait=0; G.hintT=0; SFX.lock();
  }
  return false;
}
/* Where each named element actually is this frame. */
function tutTarget(kind){
  if(kind==='tooth'){
    const t=tutTooth(); if(!t) return null;
    const p=proj(t.x,PLANE_Y,t.z), r=t.r*p.s*1.7;
    return {x:p.x-r,y:p.y-r,w:r*2,h:r*2,round:true};
  }
  if(kind==='line'){
    const r=BORE_R*(FOV/scanNear())*0.92*1.06;
    return {x:PX-r,y:HZ-r,w:r*2,h:r*2,round:true};
  }
  if(kind==='mill'){
    const p=proj(G.x,PLANE_Y+G.bob,SHIP_Z), R=28*p.s;
    return {x:p.x+R*0.5,y:p.y-R*1.9,w:R*1.7,h:R*1.7,round:true};
  }
  if(kind==='seated'){
    const t=tutObj2('tooth','repaired'); if(!t) return null;
    const p=proj(t.x,PLANE_Y,t.z), r=t.r*p.s*1.7;
    return {x:p.x-r,y:p.y-r,w:r*2,h:r*2,round:true};
  }
  if(kind==='pod'||kind==='debris'){
    const o=tutObj(kind); if(!o) return null;
    const p=proj(o.x,PLANE_Y,o.z), r=o.r*p.s*1.8;
    return {x:p.x-r,y:p.y-r,w:r*2,h:r*2,round:true};
  }
  if(kind==='mag') return {x:SLIP.x+14,y:812,w:SLIP.w-28,h:80,round:false};
  return null;
}
/* The way out, always legible while the lesson is running — an escape nobody is told
   about is not an escape. Shows the hold filling so it is obvious the press registered. */
function drawTutorSkip(U){
  /* Centred between the two figures. Against the right edge it sat on the intern. */
  const y=VH-22, prog=clamp((U.skip||0)/TUTOR_SKIP,0,1);
  txt(btnSub('HOLD  {SCAN} + {FIRE} + {SLOW}   SKIP TRAINING'),PX,y,
      {size:16,weight:700,ls:'2px',font:F_MONO,align:'center',
       col:prog>0?CFG.col.score:'rgba(138,131,119,0.6)'});
  if(prog>0){
    const bw=300, bx=PX-bw/2, by=y+8;
    ctx.fillStyle='rgba(122,128,138,0.25)'; ctx.fillRect(bx,by,bw,PIXEL_K);
    ctx.fillStyle=CFG.col.score;
    ctx.fillRect(bx,by,Math.round(bw*prog/PIXEL_K)*PIXEL_K,PIXEL_K);
  }
}
/* ── THE SCAN, DRAWN AS A DIAGRAM ───────────────────────────────────────────
   The lesson's first idea is the one the whole cabinet is for, and inside the bore it was
   being taught on a tooth forty pixels tall, tumbling away from the player, in the middle
   of a red tunnel. So for those beats the runner stops being the subject: the screen dims,
   a plate comes up, and the tooth is drawn large and still on it — a schematic, the way the
   scanner's own software would show it, not the way the game shows a target.

   The sweep is the same verb as in play — top to bottom, once down the tooth — and it is
   driven by the player's real scan whenever they are actually holding the button. With
   nobody scanning it runs its own slow loop so the plate is never a dead illustration. */
/* ── THE DIAGRAMS, ON A BLOCK GRID ──────────────────────────────────────────
   Everything on these plates was bezier curves with gradients — vector art on a pixel-art
   screen, which is why it never read as 16-bit however neat it got.

   The shapes are rasterised ONCE onto a coarse grid and everything is drawn from that grid.
   The prep is not a second shape: it is the crown's own mask eroded by the wall thickness in
   whole cells, so the two cannot drift apart when either is moved — which is how they came
   apart in the first place, by my hand, not by any fault of the curves. */
/* One atom for every diagram: six screen pixels. The mask blocks are 6, and the digits are
   set at a size that resolves to the font's 6px generation — so a block of tooth and a
   pixel of a '1' are the same square. They were 15 and 3, a fivefold difference in the same
   picture, which is the single worst thing you can do to pixel art. */
const DBLK=6, DDIGIT=40;                 // genFor(40) === 1, i.e. six pixels per glyph pixel
const MASK_CACHE=new Map();
function pixMask(key,pathFn,cells,x0,x1,y0,y1){
  /* The resolution is part of the identity. Keyed on the name alone, the first caller's grid
     was handed to every later one — so the recap cells, which ask for 26 cells, were served the
     scan plate's 54 and drew at twice the width, straight over their neighbours. */
  key=key+'@'+cells+'@'+x0+','+x1+','+y0+','+y1;
  const hit=MASK_CACHE.get(key); if(hit) return hit;
  const rows=Math.round(cells*(y1-y0)/(x1-x0));
  const c=document.createElement('canvas'); c.width=cells; c.height=rows;
  const g=c.getContext('2d');
  g.setTransform(cells/(x1-x0),0,0,rows/(y1-y0),-x0*cells/(x1-x0),-y0*rows/(y1-y0));
  pathFn(g); g.fillStyle='#fff'; g.fill();
  const d=g.getImageData(0,0,cells,rows).data, grid=new Uint8Array(cells*rows);
  for(let i=0,n=cells*rows;i<n;i++) grid[i]=d[i*4+3]>110?1:0;
  const m={w:cells,h:rows,g:grid,x0,x1,y0,y1};
  MASK_CACHE.set(key,m); return m;
}
/* One cell in from the edge, n times. The wall of a crown, in whole blocks. */
function erodeMask(m,n){
  let g=m.g;
  for(let pass=0;pass<n;pass++){
    const out=new Uint8Array(g.length);
    for(let y=0;y<m.h;y++) for(let x=0;x<m.w;x++){
      const i=y*m.w+x;
      if(!g[i]) continue;
      const up   = y>0      ? g[i-m.w] : 0;
      const dn   = y<m.h-1  ? g[i+m.w] : 0;
      const lf   = x>0      ? g[i-1]   : 0;
      const rt   = x<m.w-1  ? g[i+1]   : 0;
      out[i]= (up&&dn&&lf&&rt) ? 1 : 0;
    }
    g=out;
  }
  return {w:m.w,h:m.h,g,x0:m.x0,x1:m.x1,y0:m.y0,y1:m.y1};
}
/* Draws a mask as blocks. `shade` is called per cell so a plate can colour by row — which is
   how the scan splits the tooth into captured and not, without a second shape. */
function drawMask(m,cx,topY,block,shade){
  const ox=Math.round((cx-m.w*block/2)/block)*block;
  for(let y=0;y<m.h;y++){
    const py=topY+y*block;
    for(let x=0;x<m.w;x++){
      if(!m.g[y*m.w+x]) continue;
      const col=shade(x,y,py);
      if(!col) continue;
      ctx.fillStyle=col;
      ctx.fillRect(ox+x*block,py,block,block);
    }
  }
}
/* The outline: every cell of the mask that has empty space beside it gets a dark block laid
   just outside, which is how a sprite is keylined by hand. */
function maskOutline(m,cx,topY,block,col){
  const ox=Math.round((cx-m.w*block/2)/block)*block;
  const at=(x,y)=>(x<0||y<0||x>=m.w||y>=m.h)?0:m.g[y*m.w+x];
  ctx.fillStyle=col;
  for(let y=-1;y<=m.h;y++) for(let x=-1;x<=m.w;x++){
    if(at(x,y)) continue;
    if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1))
      ctx.fillRect(ox+x*block,topY+y*block,block,block);
  }
}
const DIAG={x:1059,y:120,w:819,h:699};
const SEAT_SECS=1.40;      // long enough to watch the crown arrive, not merely to notice it
const DIAG_TOP=-1.22, DIAG_BOT=1.10;         // unit-space extent of the sweep
/* Nothing moves on its own. A sweep running before the player has touched anything says the
   machine is doing the work — and then holding the button feels like watching, not scanning.
   At rest the plate shows the tooth and an empty gauge; the line appears on the first frame
   the scan actually has progress, and it is their progress. */
function tutScanP(){
  const t=tutTooth();
  if(t&&t.state==='broken') return {p:clamp(t.scan,0,1),live:t.scan>0.002};
  if(G.scans>0)             return {p:1,live:false};
  return {p:0,live:false};
}
/* The plates that play rather than mirror. Once the panel is up the level is frozen, so the
   real mill cannot turn and there is nothing live to follow — these run on the beat's own
   clock instead. The scan is the exception and stays on the player's hands. */
function tutAnimP(){
  const U=G.tut, st=U&&TUTOR[U.step];
  if(st&&st.anim){ const p=clamp((U.animT||0)/st.anim,0,1); return {p,live:p<1,held:p>=1}; }
  /* A verb beat sits at zero until the button lands. Without this it fell through to the
     branch below and read the real magazine, which reports "done" before the crown has moved
     — so the landing flash ran early and asked for a circle of negative radius, which is a
     throw, which is the whole script. */
  if(st&&st.verb){
    const pv=U.verbDone?clamp((U.animT||0)/SEAT_SECS,0,1):0;
    return {p:pv,live:U.verbDone&&pv<1,held:pv>=1};
  }
  const m=G.mill[0];
  if(m) return {p:clamp(m.prog,0,1),live:true,held:false};
  const done=G.mag.length>0||G.seats>0;
  return {p:done?1:0,live:false,held:done};
}

/* A grid of the measured field, common to all three plates. */
function diagGrid(cx,top,bot,halfW){

/* ── THE SEND-OFF, AS A SLIDE ───────────────────────────────────────────────
   The last thing before the tunnel, and the first time the three verbs are shown together.
   Each cell is the tooth AS IT LOOKS IN THE BORE at that moment — a half-scanned tooth, a
   blank part-cut on the wand, a crown that has landed — with the button that does it printed
   underneath. So the player crosses into the shift already knowing what they are looking at,
   which is the one thing four screens of plates could not do on their own. */
function recapCell(kind,cx,cy,R,part){
  /* On the block grid like the rest of the plates. The old cells drew a tooth and then a crown
     over it, each with its own dark keyline, so the two outlines crossed inside the shape and
     left black strokes lying across the enamel — which is what you were pointing at. Drawn from
     masks there is one silhouette and one keyline around it, and nothing can cross anything. */
  const B=6;
  const TM=pixMask('tooth', toothPath, 26, -1.12, 1.12, -1.24, 1.14);
  const CM=pixMask('crown'+(part&&part.fixture?'F':'C'),
                   g=>partPath(g,part), 26, -1.14, 1.14, -1.12, 0.62);
  const top=m=>Math.round((cy-m.h*B/2)/B)*B;

  if(kind==='scan'){
    const t0=top(TM), cut=Math.floor(TM.h*0.5);
    maskOutline(TM,cx,t0,B,'#0A0808');
    drawMask(TM,cx,t0,B,(x,y)=>y>=cut?'#5C5548':'#0A1014');
    const ox=Math.round((cx-TM.w*B/2)/B)*B;
    ctx.fillStyle='rgba(127,212,240,0.85)';
    for(let y=0;y<cut;y++) for(let x=0;x<TM.w;x++)
      if(TM.g[y*TM.w+x] && (y%2)===0) ctx.fillRect(ox+x*B,t0+y*B,B,B);   // rows, not a diagonal
    ctx.fillStyle='rgba(236,252,255,0.95)';
    ctx.fillRect(ox,t0+cut*B-B,TM.w*B,B);
  } else if(kind==='mill'){
    const t0=top(CM), cut=Math.floor(CM.h*0.55);
    const ox=Math.round((cx-CM.w*B/2)/B)*B;
    // the blank: a rectangle of stock the crown is coming out of
    ctx.fillStyle='#8B887F'; ctx.fillRect(ox-B,t0-B,(CM.w+2)*B,(CM.h+2)*B);
    ctx.fillStyle='#EAE6DC'; ctx.fillRect(ox,t0,CM.w*B,CM.h*B);
    ctx.fillStyle='#161311'; ctx.fillRect(ox,t0,CM.w*B,cut*B);
    drawMask(CM,cx,t0,B,(x,y)=>y<cut?CFG.col.bone:null);
    ctx.fillStyle=CFG.col.wet; ctx.fillRect(ox-B,t0+cut*B-B/2,(CM.w+2)*B,B);
  } else {
    const t0=top(TM);
    maskOutline(TM,cx,t0,B,'#0A0808');
    drawMask(TM,cx,t0,B,()=>'#DCD3C0');
    // the crown, seated on it: one fill, no second keyline inside the silhouette
    const ct=t0+Math.round(TM.h*0.06)*B;
    drawMask(CM,cx,ct,B,()=>CFG.col.bone);
    const ox=Math.round((cx-CM.w*B/2)/B)*B;
    ctx.fillStyle='rgba(10,8,8,0.55)';
    ctx.fillRect(ox,ct+CM.h*B,CM.w*B,B);            // the margin, one block, nothing else
    const pl=0.5+0.5*Math.sin(T*4);
    glow(cx,cy,R*1.4,'#FFF6E6',0.12+0.10*pl);
  }
}

function drawTutorDiagram(kind){
  if(kind==='recap') return drawDiagRecap();
  if(kind==='mill') return drawDiagMill();
  if(kind==='seat') return drawDiagSeat();
  const D=DIAG, k=PIXEL_K, q=v=>Math.round(v/k)*k;
  const {p,live}=tutScanP();
  diagChrome('INTRAORAL SCAN',live?'LIVE':'DEMO',live);
  /* Fades up over the back half of his line, so the sentence arrives first and the tooth
     lands under it rather than competing with it. */
  const U0=G.tut, stx=U0&&TUTOR[U0.step];
  const mlen=stx?stx.text.join('').length:1;
  const appear=(U0&&U0.paused)?clamp(((U0.ch/Math.max(1,mlen))-0.30)/0.30,0,1):1;

  diagBody(()=>{
  /* The tooth moves right and the wand takes the left of the plate. Until now the lesson
     showed a tooth being scanned by nothing at all — and the thing the player is actually
     flying, the one object on screen they control, was never explained. It is the same sprite
     drawn by the same function as the one in the bore, just bigger, so "that white thing in
     the tunnel" and "the scanner" become one idea rather than two. */
  ctx.globalAlpha=appear;
  const cx=1520, cy=414, s=150;

  txt('SCANNER',wx,wy+wHalf+34,
      {size:15,weight:800,col:CFG.col.dim,align:'center',ls:'3px',font:F_MONO,max:240});
  /* The field, opening from the optics to the tooth's full width — the same shape the beam
     makes in play, so the plate is not inventing a second visual language for one instrument. */
  if(p>0){
    /* Opens onto the whole tooth, top to bottom. It used to end on the tooth's width at its
       middle, which from a wand sitting down and to the left is a thin wedge pointing at one
       spot — the language of a targeting laser, and the opposite of what the instrument does.
       An intraoral scanner throws a field over the whole tooth and reads it; so the two edges
       now land on the far side of the tooth at its crown and at its root, and everything
       between them is inside the field. */
    const y0=wy-wHalf, w0=PIXEL_K*3;
    /* The near face, not the far one. Carried to the far side the two edges ran straight
       through the tooth and out the other side, which is a beam passing over it rather than
       landing on it. They stop where the surface is. */
    const fx1=cx-1.06*s, yTop=uy(DIAG_TOP)-9, yBot=uy(DIAG_BOT)+9;
    ctx.save();
    ctx.globalAlpha=0.13; ctx.fillStyle=CFG.col.wet;
    ctx.beginPath();
    ctx.moveTo(wx-w0,y0); ctx.lineTo(fx1,yTop); ctx.lineTo(fx1,yBot); ctx.lineTo(wx+w0,y0);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(176,234,252,0.75)'; ctx.lineWidth=PIXEL_K;
    ctx.beginPath();
    ctx.moveTo(wx-w0,y0); ctx.lineTo(fx1,yTop);
    ctx.moveTo(wx+w0,y0); ctx.lineTo(fx1,yBot);
    ctx.stroke();
    ctx.restore();
    glow(wx,y0,42,'#7FD4F0',0.42);
  }

  /* The tooth, on the same block grid as everything else on these plates. Below the sweep the
     tooth as it arrived; above it, cells that have been captured — dark, with a one or a zero
     in each. Same mask, two treatments, so the split is a row of the grid rather than a second
     drawing laid over the first. */
  const TB=DBLK;

  const tTop=q(cy-Math.round(TM.h*TB/2/TB)*TB);
  const rowOf=yy=>Math.floor((yy-tTop)/TB);

  drawMask(TM,cx,tTop,TB,(gx,gy)=>gy>=cutRow?'#4A3E39':'#10222B');   // captured, but still a tooth
  /* The digits fill the captured area edge to edge and are cut by the tooth's own silhouette —
     a glyph that runs off a cusp is cropped, not dropped. Dropping them left holes wherever the
     shape narrowed, which is what made the field look pasted on rather than read as the tooth's
     contents. The clip is built from the mask's own rows, merged into runs, so it is a few dozen

            {size:DDIGIT,weight:800,col:CFG.col.wet,font:F_MONO});
      }
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }
  // the head: a bar the width of the tooth, with a bracket either side of the plate

      ctx.fillRect(bx,ly-k*4,24,k); ctx.fillRect(bx,ly+k*3,24,k);
      ctx.fillRect(d<0?bx:bx+21,ly-k*4,k,k*8);
    });
  }

  });
  ctx.globalAlpha=1;

}

     odd thing to state. Now it is a band with ends: the top edge falls away toward left and
     right and meets the foot of the plate, so the tissue closes on itself the way a longitudinal

  const HW=(y)=>{ const i=y-PT_TOP; return (i<0||i>=PT_HEAD.length)?0:PT_HEAD[i]; };
  const CXC=32;                                 // the head's centre column
  const chin=PT_TOP+PT_HEAD.length;             // first row below the head
  const lit=skTone(p,-1), loc=p.skin, shd=skTone(p,1), deep=skTone(p,2);
  const hairDk='#1E1A16';

  // ── shoulders, and what kind of top it is ──
  const sy=chin+6;
  for(let y=sy;y<PT_H;y++){
    const t=clamp((y-sy)/6,0,1);
    const hw=Math.round(16+t*14);
    P(CXC-hw,y,hw*2,1,p.top);
  }
  P(CXC-16,sy,32,1,K);
  // a shoulder that catches the light, and one that does not
  for(let y=sy+1;y<PT_H;y++){
    const t=clamp((y-sy)/6,0,1), hw=Math.round(16+t*14);
    P(CXC-hw,y,3,1,'rgba(255,255,255,0.10)');
    P(CXC+hw-3,y,3,1,'rgba(10,12,16,0.22)');
  }
  if(p.topStyle===1){                           // an open collar
    P(CXC-8,sy,5,6,'#EFE9DA'); P(CXC+3,sy,5,6,'#EFE9DA');
    P(CXC-8,sy,5,1,K);        P(CXC+3,sy,5,1,K);
    P(CXC-1,sy,2,7,K);
  }
  if(p.topStyle===2){ P(CXC-5,sy,10,6,loc); P(CXC-5,sy,10,1,K); }        // v-neck
  if(p.topStyle===3){ P(CXC-30,sy+8,60,1,'rgba(10,12,16,0.45)'); }       // blouse seam

  // ── neck, in shadow because the head is over it ──
  for(let y=chin-3;y<sy;y++) P(CXC-5,y,10,1,y<chin?loc:shd);
  P(CXC-5,chin,10,2,deep);                      // the jaw's own shadow on the throat

  // ── the head ──
  for(let y=PT_TOP;y<chin;y++){
    const hw=HW(y);
    P(CXC-hw,y,hw*2,1,loc);
    P(CXC-hw,y,3,1,lit);                        // lit rim, upper left
    P(CXC+hw-2,y,2,1,shd);                      // turning away on the right
  }
  // keyline: one cell outside the silhouette, stepped with it
  for(let y=PT_TOP;y<chin;y++){
    const hw=HW(y);
    P(CXC-hw-1,y,1,1,K); P(CXC+hw,y,1,1,K);
    const up=HW(y-1), dn=HW(y+1);
    if(up<hw) { P(CXC-hw-1,y-1,hw-up+1,1,K); P(CXC+up,y-1,hw-up+1,1,K); }
    if(dn<hw) { P(CXC-hw-1,y+1,hw-dn+1,1,K); P(CXC+dn,y+1,hw-dn+1,1,K); }
  }

  // ── hair ──
  const S=p.style;
  if(S===5){
    // bald: the crown catches the light, and that IS the hairstyle
    for(let y=PT_TOP;y<PT_TOP+5;y++) P(CXC-HW(y)+2,y,5,1,lit);
  } else {
    const capTo = S===2 ? PT_TOP+13 : PT_TOP+10;
    for(let y=PT_TOP;y<capTo;y++){
      const hw=HW(y)+(S===2?1:0);
      P(CXC-hw,y,hw*2,1,p.hair);
      P(CXC+hw-3,y,3,1,hairDk);                 // the far side of the head
    }
    // a hairline that dips at the temples instead of cutting straight across
    P(CXC-HW(capTo)+3,capTo,2,1,p.hair);
    P(CXC+HW(capTo)-5,capTo,2,1,p.hair);
    P(CXC-HW(capTo),capTo,3,1,p.hair);
    P(CXC+HW(capTo)-3,capTo,3,1,p.hair);
    P(CXC-HW(PT_TOP)+2,PT_TOP+1,4,1,'rgba(255,255,255,0.12)');   // one highlight, upper left
    if(S===1||S===3){                            // sideburns / length down the sides
      const to = S===3 ? chin-2 : capTo+4;
      for(let y=capTo;y<to;y++){ const hw=HW(y);
        P(CXC-hw-(S===3?1:0),y,S===3?4:2,1,p.hair);
        P(CXC+hw-(S===3?3:2),y,S===3?4:2,1,S===3?hairDk:p.hair); }
    }
    if(S===4){ P(CXC-4,PT_TOP-5,8,5,p.hair); P(CXC-4,PT_TOP-5,8,1,K); }   // bun
    P(CXC-HW(PT_TOP)-1,PT_TOP-1,HW(PT_TOP)*2+2,1,K);
  }

  // ── eyes ──
  const ey=PT_TOP+18;
  P(CXC-12,ey-5,7,2,hairDk); P(CXC+5,ey-5,7,2,hairDk);           // brows
  P(CXC-12,ey,6,4,'#FFF6E6'); P(CXC+6,ey,6,4,'#FFF6E6');
  P(CXC-10,ey+1,3,3,'#1E1A16'); P(CXC+8,ey+1,3,3,'#1E1A16');     // iris
  P(CXC-12,ey,6,1,shd); P(CXC+6,ey,6,1,shd);                     // lid, not a black bar
  if(p.glasses){
    P(CXC-14,ey-2,9,1,K); P(CXC-14,ey+5,9,1,K);
    P(CXC-14,ey-2,1,8,K); P(CXC-6,ey-2,1,8,K);
    P(CXC+5,ey-2,9,1,K);  P(CXC+5,ey+5,9,1,K);
    P(CXC+5,ey-2,1,8,K);  P(CXC+13,ey-2,1,8,K);
    P(CXC-5,ey,5,1,K);
  }
  // ── nose: a plane turning away, not a grey box ──
  P(CXC,ey+5,2,4,shd); P(CXC-2,ey+8,4,1,shd); P(CXC+2,ey+7,1,2,deep);

  // ── the smile ──
  /* Built column by column off a parabola, so the corners lift and the teeth follow the curve.
     A straight band of white between two lines is a grill; a smile is an arc. */
  const my=PT_TOP+28, mx0=CXC-7, mx1=CXC+7;
  for(let x=mx0;x<=mx1;x++){
    const t=(x-CXC)/7, lift=Math.round(t*t*3), th=3-Math.round(t*t);
    P(x,my+lift,1,1,'#3A1A20');                       // the line between the lips
    const gapCol = (!after && Math.floor((x-mx0)/3)===p.gap);
    P(x,my+lift+1,1,th,gapCol?'#180C10':'#FFFBF2');   // enamel
    if((x-mx0)%3===0&&x>mx0) P(x,my+lift+1,1,th,'#D8CFC0');   // separations between teeth
    P(x,my+lift+1+th,1,1,'#7A3038');                  // lower lip
    P(x,my+lift+2+th,1,1,shd);                        // and its shadow on the chin
  }
  /* A beard follows the jaw and leaves the mouth alone. Filling every row below the lip across
     the full width of the head — which is what this did — is a dark bib that swallows the one
     thing the whole screen exists to show. */
  if(p.beard){
    for(let y=ey+6;y<chin;y++){ const hw=HW(y);
      P(CXC-hw,y,3,1,p.hair); P(CXC+hw-3,y,3,1,hairDk); }        // up the jaw, both sides
    for(let y=my+7;y<chin;y++){ const hw=HW(y);
      P(CXC-hw+3,y,hw*2-6,1,p.hair); }                            // the chin itself
    P(CXC-6,my-1,5,1,p.hair); P(CXC+2,my-1,5,1,p.hair);           // moustache, clear of the smile
  }
}

/* One patient, not a wall of them. A grid of eight pairs was a chart; one face with something
   to say is a person, and a person is what the shift was actually made of. The rest are still
   counted underneath, because the number is the claim and the face is the evidence for it.

   The quote is the patient's, in the paper language the rest of the game already speaks — the
   case slip, the sponsor plate — rather than as a floating caption. */
const NAMES=['MAYA','DEREK','PRIYA','TOMAS','ANNA','KWAME','LENA','HIRO','SOFIA','OMAR',
             'GRACE','MATEO','NINA','JONAS','AISHA','ELIAS','RUTH','SAM','IVY','NOAH',
             'CLARA','ANDRE','FATIMA','JUNE','PABLO','ESTHER','LUCA','MEI','DANIEL','ZARA'];
const QUOTES=[
  ['I CAME IN AT LUNCH WITH A CRACKED','MOLAR AND WALKED OUT WITH THE CROWN','ALREADY IN. ONE APPOINTMENT.'],
  ['THEY SCANNED IT, CUT IT AND FITTED','IT WHILE I SAT THERE. I STILL DO','NOT QUITE BELIEVE IT.'],
  ['NO TEMPORARY. NO SECOND TRIP ACROSS','TOWN. I WAS BACK AT WORK THE SAME','AFTERNOON.'],
  ['I HAD PUT IT OFF FOR A YEAR BECAUSE','OF THE TWO VISITS. TURNS OUT IT','ONLY TAKES ONE.'],
  ['MY DAUGHTER ASKED WHY I WAS SMILING','SO MUCH. I TOLD HER IT WAS FINISHED','ALREADY.'],
];
function drawTestimonial(){
  const people=Math.max(0,Math.floor(G.seats/2));
  ctx.save(); ctx.fillStyle='rgba(8,8,10,0.92)'; ctx.fillRect(0,0,VW,VH); ctx.restore();
  marqueeLeft(88);
  if(people===0){
    txt('NO CASES CLOSED',RAIL,232,{size:96,weight:800,col:CFG.col.white,ls:'10px'});
    titleRule(RAIL+404,252,404);
    txt('RUN THE SHIFT AGAIN — THERE IS A CHAIR FREE',RAIL,320,
        {size:24,weight:800,col:CFG.col.score,ls:'4px',font:F_MONO});
    return;
  }
  const salt=G.salt||1;
  const r=lcg(salt*31+7);
  const p=makePatient(0,salt);
  const name=NAMES[Math.floor(r()*NAMES.length)];
  const quote=QUOTES[Math.floor(r()*QUOTES.length)];

  /* The count moved to the subline: at gen 2 the headline is 73px a character, and
     'ONE OF 8 HAPPY PATIENTS' measured 1659px against 1620 of usable rail — it ran off the
     screen, and worse for a two-digit shift. */
  txt('HAPPY PATIENT',RAIL,232,{size:96,weight:800,col:CFG.col.white,ls:'10px'});
  titleRule(RAIL+404,252,404);
  txt(people===1?'THE ONE YOU TREATED  ·  AND THE ONLY VISIT IT TOOK'
               :'ONE OF  '+people+'  THIS SHIFT  ·  AND THE ONLY VISIT IT TOOK',RAIL,300,
      {size:19,weight:700,col:'rgba(138,131,119,0.9)',ls:'4px',font:F_MONO});

  /* Two cards side by side: the photo and what they said. Everything else in this game is
     paperwork — the case slip, the sponsor plate — so a face on paper reads as a photo clipped
     to a file rather than as a small drawing adrift on a black screen, which is what it was
     when it stood on its own. The cards share a height so the screen has a floor. */
  /* Two blocks per art pixel instead of one. At 192x234 the face was a thumbnail on a screen
     whose whole job is to show it — and the teeth, which are the point, were four pixels wide.
     Still an exact multiple of the grid, so nothing softens. */
  /* Re-laid out when the portrait doubled: at 468px tall the photo runs down to 882 and the
     name was set at 878 — inside the picture — with the caption under it and both against the
     card's edge. Everything below the photo now has its own band, measured from the photo's
     real bottom rather than from the card's. */
  const u=PIXEL_K*2, pw=PT_W*u, ph=PT_H*u;
  /* 316 clears the subline at 300; 666 puts the card's foot at 982, sixteen under the caption
     and twenty-eight above the tally at the bottom of the screen. */
  const cy=316, cardH=666;
  const fx=RAIL+40, fw=pw+96;
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(fx+8,cy+10,fw,cardH);
  ctx.fillStyle=CFG.col.paper;     ctx.fillRect(fx,cy,fw,cardH);
  ctx.strokeStyle=CFG.col.ink; ctx.lineWidth=4; ctx.strokeRect(fx,cy,fw,cardH);
  ctx.fillStyle=CFG.col.red; ctx.fillRect(fx,cy,fw,54);
  txt('PATIENT',fx+fw/2,cy+38,
      {size:19,weight:800,col:'#FFF6E6',align:'center',ls:'5px',font:F_MONO});
  // the face sits on its own panel inside the card, the way a photo would
  const fy=cy+84;
  ctx.fillStyle='rgba(20,22,28,0.92)'; ctx.fillRect(fx+40,fy-10,pw+16,ph+20);
  drawPatient(fx+48,fy,u,p,true,true);
  /* A glint on one tooth, on the same cycle as the crown on the title art. It is the only
     moving thing on the screen, so it is what the eye lands on — and what it lands on is the
     result of the whole shift. */
  const tw=(T%2.6)/2.6;
  if(tw<0.16){
    const kk=Math.sin(tw/0.16*Math.PI);
    const gx=fx+48+32*u, gy=fy+40*u;      // the teeth run x 22..42, y 36..42 in art pixels
    glow(gx,gy,58*kk,'#FFF6E6',0.85*kk);
    ctx.fillStyle='rgba(255,255,255,'+(0.95*kk).toFixed(2)+')';
    const r0=Math.round(30*kk/PIXEL_K)*PIXEL_K;
    ctx.fillRect(Math.round(gx-r0),Math.round(gy-PIXEL_K/2),r0*2,PIXEL_K);
    ctx.fillRect(Math.round(gx-PIXEL_K/2),Math.round(gy-r0),PIXEL_K,r0*2);
  }
  const capY=fy+ph+22;                       // measured off the photo, not off the card
  rule(fx+28,capY,fx+fw-28,'rgba(110,106,96,0.5)',2);
  txt(name+',  '+p.age,fx+fw/2,capY+42,
      {size:24,weight:800,col:CFG.col.ink,align:'center',ls:'3px',font:F_MONO,max:fw-56});
  txt('SAME-DAY CROWN',fx+fw/2,capY+76,
      {size:15,weight:700,col:CFG.col.red,align:'center',ls:'0px',font:F_MONO,max:fw-56});

  /* The quote carries the screen, so it is set large — and the attribution gets its own band
     below a rule rather than sharing the last line, which it used to overlap. */
  const qx=fx+fw+60, qy=cy, qw=VW-qx-RAIL;
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(qx+8,qy+10,qw,cardH);
  ctx.fillStyle=CFG.col.paper;     ctx.fillRect(qx,qy,qw,cardH);
  ctx.strokeStyle=CFG.col.ink; ctx.lineWidth=4; ctx.strokeRect(qx,qy,qw,cardH);
  ctx.fillStyle=CFG.col.red; ctx.fillRect(qx,qy,qw,54);
  txt('IN THEIR WORDS',qx+34,qy+38,
      {size:19,weight:800,col:'#FFF6E6',ls:'5px',font:F_MONO});
  const LN=54, top=qy+150;
  quote.forEach((l,i)=>
    txt(l,qx+34,top+i*LN,
        {size:28,weight:800,col:CFG.col.ink,ls:'2px',font:F_MONO,max:qw-68}));
  rule(qx+34,qy+cardH-96,qx+qw-34,'rgba(110,106,96,0.5)',2);
  txt(name+',  '+p.age+'  ·  PATIENT, THIS SHIFT',qx+34,qy+cardH-52,
      {size:17,weight:700,col:'rgba(110,106,96,0.95)',ls:'3px',font:F_MONO});
  txt('ONE VISIT',qx+qw-34,qy+cardH-52,
      {size:17,weight:800,col:CFG.col.red,align:'right',ls:'4px',font:F_MONO});

  txt('TWO TEETH IS ONE PATIENT  ·  '+G.seats+' TREATED  ·  '+people+' PATIENTS',RAIL,VH-70,
      {size:16,weight:700,col:'rgba(138,131,119,0.7)',ls:'2px',font:F_MONO});
}
/* ── INPUT SETUP ─────────────────────────────────────────────────────────── */
/* Driven entirely from the panel, because at a stand there is no keyboard. Rows are the
   four actions plus a reset and a save; the stick moves and cycles, the FIRE button
   acts. Re-binding an action captures the very next press, whatever it sends. */
let bindHold=0, startHold=0, idlePlay=0;
let bindUI={row:0,capture:null,armed:false,saved:0};
/* One list, three kinds of row: a button to bind, a level to set, an action to take. */
const MENU_ROWS=[
  ...BIND_ACTS.map(a=>({kind:'bind',act:a})),
  {kind:'vol',key:'music',name:'MUSIC  VOLUME'},
  {kind:'vol',key:'sfx',  name:'EFFECTS  VOLUME'},
  /* The operator's switches. They were on P, K and F, which is no use on a cabinet with
     no keyboard in it — the whole panel is eight buttons and a stick. */
  {kind:'toggle',key:'swap',name:'SWAP  STICK  AXES'},
  {kind:'toggle',key:'crt', name:'CRT  TUBE'},
  {kind:'toggle',key:'fps', name:'FRAME  RATE  READOUT'},
  /* A stand is left mid-game constantly — somebody is called away, or simply walks off. The
     cabinet has to put itself back to the title so the next person meets the attract screen
     rather than a stranger's half-played shift. The operator sets how patient it is. */
  {kind:'choice',key:'idle',name:'BACK  TO  TITLE',
   opts:[60,180,300,0], labels:['1  MINUTE','3  MINUTES','5  MINUTES','NEVER']},
  {kind:'act',   act:'cal', name:'RECALIBRATE  STICK  CENTRE'},
  {kind:'act',   act:'fs',  name:'FULL  SCREEN'},
  {kind:'reset',name:'RESET EVERYTHING'},
  {kind:'exit', name:'SAVE AND EXIT'},
];
function enterBind(){
  mode='BIND'; bindHold=0; axRest=null; padStuck=null;   // retake the centre and the rest state
  bindUI={row:0,capture:null,armed:false,saved:0};
  keyTap=null; padTap=null;
  SFX.ui();
}
function bindTick(){
  const U=bindUI;
  /* Nothing is read until every button is up. We arrived here on a three-second hold, so
     the button that opened the screen is still down and would be captured instantly. */
  if(!U.armed){
    if(Input.keys.size===0&&!Input.scan&&!Input.fire&&!Input.slow&&padTap===null){
      U.armed=true;
    }
    keyTap=null; padTap=null; axisTap=null;
    return;
  }
  U.saved=Math.max(0,U.saved-0.016);
  if(U.capture){
    /* A key, a pad button or an axis push — whichever the hardware sends first. The axis
       branch is the one that matters for a stick: plenty of encoders report it as a hat on
       an axis nobody would have guessed, and there is no way to know but to watch. */
    if(keyTap!==null||padTap!==null||axisTap!==null){
      const act=U.capture, wasLabel=BIND[act]?BIND[act].label:'';
      BIND[act]={codes:keyTap!==null?[keyTap]:[],
                 pads:padTap!==null?[padTap]:[],
                 axes:axisTap!==null?[axisTap]:[],
                 label:axisTap!==null
                   ? (wasLabel&&/^STICK/.test(wasLabel)?wasLabel
                      :'AXIS '+axisTap.i+(axisTap.sign>0?'+':'-'))
                   : codeLabel(keyTap,padTap)};
      keyTap=null; padTap=null; axisTap=null; U.capture=null; U.saved=1.2;
      saveBind(); SFX.lock();
    }
    return;
  }
  keyTap=null; padTap=null; axisTap=null;
  const rows=MENU_ROWS, n=rows.length;
  if(Input.upEdge)   { U.row=(U.row+n-1)%n; SFX.ui(); }
  if(Input.downEdge) { U.row=(U.row+1)%n;   SFX.ui(); }
  const r=rows[U.row], dir=Input.rightEdge?1:(Input.leftEdge?-1:0);
  if(dir&&r.kind==='bind'){
    // left and right walk the list of letters that could be printed on the cap
    const a=BIND[r.act], i=PANEL_LABELS.indexOf(a.label), L=PANEL_LABELS.length;
    a.label=PANEL_LABELS[((i<0?0:i)+(dir>0?1:L-1))%L];
    saveBind(); SFX.ui();
  }
  if(dir&&(r.kind==='toggle')){
    VOL[r.key]=!VOL[r.key];
    if(r.key==='swap') VOL.swapSet=true;      // from here on it is the operator's call
    saveVol(); SFX.ui();
  }
  if(dir&&r.kind==='choice'){
    const i=r.opts.indexOf(VOL[r.key]), n2=r.opts.length;
    VOL[r.key]=r.opts[((i<0?0:i)+(dir>0?1:n2-1))%n2];
    saveVol(); SFX.ui();
  }
  if(dir&&r.kind==='vol'){
    VOL[r.key]=clamp(Math.round((VOL[r.key]+dir*0.05)*20)/20,0,1);
    saveVol();
    // heard, not read: the blip is the preview for effects, the loop for music
    if(r.key==='sfx') SFX.lock(); else SFX.ui();
  }
  if(Input.fireEdge||Input.startEdge){
    if(r.kind==='bind'){ U.capture=r.act; SFX.ui(); }
    else if(r.kind==='vol'){ SFX.lock(); }
    else if(r.kind==='toggle'){
      VOL[r.key]=!VOL[r.key];
      if(r.key==='swap') VOL.swapSet=true;
      saveVol(); SFX.ui();
    }
    else if(r.kind==='choice'){
      const i=r.opts.indexOf(VOL[r.key]);
      VOL[r.key]=r.opts[((i<0?0:i)+1)%r.opts.length];
      saveVol(); SFX.ui();
    }
    else if(r.kind==='act'){
      if(r.act==='fs') goFS();
      if(r.act==='cal'){ axRest=null; padStuck=null; U.saved=1.2; }
      SFX.ui();
    }
    else if(r.kind==='reset'){
      BIND=JSON.parse(JSON.stringify(BIND_DEFAULT)); saveBind();
      VOL={music:0.32,sfx:0.32,crt:true,fps:false,swap:false,swapSet:false,idle:60}; saveVol();
      U.saved=1.2; SFX.ui();
    }
    else { saveBind(); saveVol(); mode='ATTRACT'; bindHold=0; idle=0; SFX.start(); }
  }
}
/* What the hardware is actually sending, live. Without this a stick that reports itself
   in some unexpected way is undebuggable from the cabinet — you cannot bind what you
   cannot see, and the readout is what turns "the joystick does not work" into a fact. */
function drawRawInput(){
  const x=1440, y=366, W=330;
  txt('RAW  INPUT',x,y,{size:17,weight:800,ls:'5px',font:F_MONO,col:CFG.col.dim});
  rule(x,y+12,x+W,'rgba(235,0,69,0.4)',2);
  const keys=[...Input.keys];
  txt(fitPix('KEYS  '+(keys.length?keys.join(' '):'—'),W,15,1),x,y+44,
      {size:15,weight:700,ls:'1px',font:F_MONO,
       col:keys.length?CFG.col.score:'rgba(138,131,119,0.7)'});
  txt(fitPix('PAD   '+(padName||'NONE DETECTED'),W,15,1),x,y+72,
      {size:15,weight:700,ls:'1px',font:F_MONO,
       col:padName?'rgba(214,206,192,0.9)':'rgba(138,131,119,0.7)'});
  txt(fitPix('BTNS  '+(padLive.length?padLive.join(' '):'—'),W,15,1),x,y+100,
      {size:15,weight:700,ls:'1px',font:F_MONO,
       col:padLive.length?CFG.col.score:'rgba(138,131,119,0.7)'});
  for(let i=0;i<Math.min(axLive.length,10);i++){
    const rest=(axRest&&axRest[i]!=null)?axRest[i]:0, v=axLive[i]-rest;
    const yy=y+134+i*26, bw=140, bx=x+112;
    txt('AXIS '+i,x,yy,{size:15,weight:700,ls:'1px',font:F_MONO,
        col:Math.abs(v)>AX_ON?CFG.col.score:'rgba(138,131,119,0.7)'});
    ctx.fillStyle='rgba(122,128,138,0.22)'; ctx.fillRect(bx,yy-10,bw,PIXEL_K*2);
    const half=bw/2, w=clamp(Math.abs(v),0,1)*half;
    ctx.fillStyle=Math.abs(v)>AX_ON?CFG.col.score:'rgba(122,128,138,0.7)';
    ctx.fillRect(v<0?bx+half-w:bx+half,yy-10,Math.max(PIXEL_K,w),PIXEL_K*2);
    txt(v.toFixed(2),x+W,yy,{size:15,weight:700,font:F_MONO,align:'right',
        col:'rgba(138,131,119,0.9)'});
  }
  /* Which axis is actually moving, named outright. This is the one fact needed to bind a
     stick that reports itself in an unexpected way, and reading it off a bar chart is
     harder than reading it in a sentence. */
  let big=-1, bigv=0;
  for(let i=0;i<axLive.length;i++){
    const v=axLive[i]-((axRest&&axRest[i]!=null)?axRest[i]:0);
    if(Math.abs(v)>Math.abs(bigv)){ bigv=v; big=i; }
  }
  if(big>=0&&Math.abs(bigv)>0.25)
    txt('MOVING: AXIS '+big+(bigv>0?' +':' -'),x,y+134+Math.min(axLive.length,10)*26+8,
        {size:15,weight:800,ls:'1px',font:F_MONO,col:CFG.col.score});
  if(!axLive.length&&!padName){
    txt('NO GAMEPAD SEEN.',x,y+134,
        {size:15,weight:700,ls:'1px',font:F_MONO,col:'rgba(138,131,119,0.7)'});
    txt('THE STICK MAY BE',x,y+160,
        {size:15,weight:700,ls:'1px',font:F_MONO,col:'rgba(138,131,119,0.7)'});
    txt('SENDING KEYS INSTEAD.',x,y+186,
        {size:15,weight:700,ls:'1px',font:F_MONO,col:'rgba(138,131,119,0.7)'});
  }
}
function drawBind(){
  const U=bindUI;
  ctx.save(); ctx.fillStyle='rgba(8,8,10,0.94)'; ctx.fillRect(0,0,VW,VH); ctx.restore();
  marqueeLeft(88);
  txt('SETTINGS',RAIL,236,{size:96,weight:800,col:CFG.col.white,ls:'10px'});
  titleRule(RAIL+404,256,404);
  txt('PANEL BUTTONS, WHAT IS PRINTED ON THEM, AND THE LEVELS',RAIL,306,
      {size:17,weight:700,col:'rgba(138,131,119,0.85)',ls:'2px',font:F_MONO});

  const NAMES={scan:'SCAN',fire:'FIRE CROWN',slow:'SLOW DOWN',start:'START / PAUSE',
               left:'JOYSTICK  LEFT',right:'JOYSTICK  RIGHT',
               up:'JOYSTICK  UP',down:'JOYSTICK  DOWN',menu:'MENU  BUTTON'};
  /* Nineteen rows now. At 34px the last one landed on the help text at the foot of the
     screen — the list grew and the spacing never did. */
  const y0=322, step=30;
  MENU_ROWS.forEach((r,i)=>{
    const sel=U.row===i, y=y0+i*step;
    if(sel){ ctx.fillStyle='rgba(235,0,69,0.14)'; ctx.fillRect(RAIL-14,y-23,1284,30); }
    if(r.kind==='bind'){
      const a=BIND[r.act];
      txt(NAMES[r.act],RAIL,y,{size:19,weight:800,ls:'3px',font:F_MONO,
          col:sel?CFG.col.white:'rgba(214,206,192,0.8)'});
      txt(a.label,RAIL+420,y,{size:19,weight:800,ls:'2px',font:F_MONO,col:btnCol(a.label)});
      /* Trimmed to its column: a stick bound to a key, a button and an axis lists longer
         than the space between here and the raw readout. */
      const sends=(a.codes||[]).concat((a.pads||[]).map(x=>'BTN '+x))
                               .concat((a.axes||[]).map(x=>'AXIS '+x.i+(x.sign>0?'+':'-')))
                               .concat(KBD_LIVE[r.act]||[]);   // the keyboard mirror
      txt(sends.length?fitPix(sends.join('  ·  '),650,15,1):'NOTHING BOUND',RAIL+600,y,
          {size:15,weight:700,ls:'1px',font:F_MONO,
           col:sends.length?'rgba(138,131,119,0.9)':CFG.col.bad});
    } else if(r.kind==='vol'){
      txt(r.name,RAIL,y,{size:19,weight:800,ls:'3px',font:F_MONO,
          col:sel?CFG.col.white:'rgba(214,206,192,0.8)'});
      // twenty blocks, so a step of 0.05 moves exactly one and the level is countable
      const v=VOL[r.key], bx=RAIL+420, bw=PIXEL_K*4, gap=PIXEL_K;
      for(let k=0;k<20;k++){
        const on=k<Math.round(v*20);
        ctx.fillStyle=on?(sel?CFG.col.score:CFG.col.steel):'rgba(122,128,138,0.20)';
        ctx.fillRect(bx+k*(bw+gap),y-18,bw,PIXEL_K*5);
      }
      txt(v<=0?'MUTED':Math.round(v*100)+'%',bx+20*(bw+gap)+40,y,
          {size:17,weight:800,ls:'2px',font:F_MONO,
           col:v<=0?CFG.col.bad:'rgba(138,131,119,0.9)'});
    } else if(r.kind==='choice'){
      txt(r.name,RAIL,y,{size:19,weight:800,ls:'3px',font:F_MONO,
          col:sel?CFG.col.white:'rgba(214,206,192,0.8)'});
      const i=Math.max(0,r.opts.indexOf(VOL[r.key]));
      txt(r.labels[i],RAIL+420,y,{size:19,weight:800,ls:'2px',font:F_MONO,
          col:VOL[r.key]?CFG.col.score:'rgba(138,131,119,0.9)'});
    } else if(r.kind==='toggle'){
      txt(r.name,RAIL,y,{size:19,weight:800,ls:'3px',font:F_MONO,
          col:sel?CFG.col.white:'rgba(214,206,192,0.8)'});
      const auto = r.key==='swap' && !VOL.swapSet;
      const on = auto ? AUTO_SWAP.test(padName||'') : VOL[r.key];
      txt(on?'ON':'OFF',RAIL+420,y,
          {size:19,weight:800,ls:'2px',font:F_MONO,
           col:on?CFG.col.score:'rgba(138,131,119,0.8)'});
      if(auto) txt('AUTO — FROM THE BOARD',RAIL+520,y,
          {size:15,weight:700,ls:'1px',font:F_MONO,col:'rgba(138,131,119,0.8)'});
    } else {
      txt(r.name,RAIL,y,{size:19,weight:800,ls:'3px',font:F_MONO,
          col:sel?CFG.col.score:'rgba(214,206,192,0.7)'});
    }
  });
  drawRawInput();

  if(U.capture){
    ctx.save(); ctx.fillStyle='rgba(8,8,10,0.86)'; ctx.fillRect(0,0,VW,VH); ctx.restore();
    txt('PRESS THE BUTTON FOR',PX,VH/2-90,
        {size:26,weight:800,col:'rgba(214,206,192,0.9)',align:'center',ls:'6px',font:F_MONO});
    txt(NAMES[U.capture],PX,VH/2+10,
        {size:96,weight:800,col:CFG.col.score,align:'center',ls:'10px'});
    txt('ON THE CABINET PANEL',PX,VH/2+70,
        {size:20,weight:700,col:'rgba(138,131,119,0.8)',align:'center',ls:'4px',font:F_MONO});
  } else if(!U.armed){
    txt('LET GO OF THE BUTTON',RAIL,VH-134,
        {size:22,weight:800,col:CFG.col.score,align:'center',ls:'5px',font:F_MONO});
  } else {
    txt('STICK  UP / DOWN  CHOOSE      STICK  LEFT / RIGHT  CHANGE THE VALUE',
        RAIL,VH-134,{size:16,weight:700,col:'rgba(138,131,119,0.8)',ls:'2px',font:F_MONO});
    txt('THE KEYBOARD ALWAYS MIRRORS THE PANEL — BINDING HERE DOES NOT TAKE IT AWAY',
        RAIL,VH-64,{size:15,weight:700,col:'rgba(138,131,119,0.55)',ls:'2px',font:F_MONO});
    txt('THE  FIRE  BUTTON  ACTS  ON  THE  HIGHLIGHTED  ROW',
        RAIL,VH-100,{size:16,weight:700,col:'rgba(138,131,119,0.8)',ls:'2px',font:F_MONO});
  }
  if(U.saved>0){
    ctx.globalAlpha=clamp(U.saved,0,1);
    txt('SAVED',VW-RAIL,VH-88,
        {size:22,weight:800,col:CFG.col.score,align:'right',ls:'6px',font:F_MONO});
    ctx.globalAlpha=1;
  }
}
/* The end of the shift, before the numbers. The two of them meet on the cut plane and he
   says what the cabinet is there to say — in his own voice, to a colleague, rather than as a
   headline on a results screen. It is the same claim the report prints and the same one the
   game has been demonstrating for the last minute: the work went out the same day.

   Only on the clock running out. Losing the line to three remakes is not a moment for a
   pitch, and the second stage holds the clock, so this is the ordinary way a shift ends. */
/* Turn and turn about, and they are facing each other while they do it — which is the only
   reason to have two people on a screen at all. The crops come off a poster where the pair
   stand back to back, so one of them has to be turned inward; measured off the art, Jim's lit
   side is his right and the intern's is his left, so the intern is the one that keeps the
   poster's own orientation and they meet in the middle. */
const OUTRO=[
  {who:'jim',   lines:['THAT IS THE SHIFT.','EVERY CROWN CUT AND SEATED','WHILE THE PATIENT WAS','STILL IN THE CHAIR.']},
  {who:'intern',lines:['NO SECOND APPOINTMENT.','NO TEMPORARY.','NOTHING LEFT THE BUILDING.']},
  {who:'jim',   lines:['SCAN. DESIGN. MILL. DELIVER.','ONE VISIT.','THAT IS  GLIDEWELL.IO']},
];
let outro=null;
/* Set while the shift fades out. The scene must keep being DRAWN — the fade is a fade of
   something, not of a black rectangle — so mode stays PLAY and only the simulation stops.
   update() checks this above everything else. */
let ending=false;
function endGame(){
  if(ending||mode==='OUTRO') return;      // the fade can outlast whatever asked for it
  scanHumOn(false,0); SFX.over(); if(G) G.wave=0;
  /* Through black rather than on the frame the last socket was filled — one instant you are
     operating, the next Jim is talking to you, with nothing in between to say the day had
     ended. Half a second each leg: a second for the whole handover, which is enough to read
     as a change of scene and short enough not to feel like waiting. */
  ending=true;
  wipeTo(()=>{
    ending=false;
    mode='OUTRO'; outro={step:0,ch:0,hold:0.5}; idle=0;
  },0.5);
}
function finishRound(){
  if(lbQualifies(G.score)){ mode='ENTRY'; entry={pos:0,ch:[0,0,0],list:null,mine:-1}; }
  else { mode='OVER'; entry.list=lbLoad(); entry.mine=-1; }
  idle=0;
}
/* Same two stages as the lesson's panels: the first press finishes the line, the next moves
   on — so nobody is ever reading against a timer, and nobody is ever stuck behind one. */
const SMILE_HOLD=3.2;   // the finale gets three seconds of its own before it can be dismissed
function outroTick(dt){
  if(!outro){ finishRound(); return; }
  if(outro.hold>0){ outro.hold-=dt; return; }
  /* One beat past the last line: the patients themselves. It comes after what he says rather
     than under it, because it is the evidence for the line and not decoration on it. */
  if(outro.step>=OUTRO.length){
    /* A held beat, not a frame. Anybody who has just lost a shift is still on the button, and
       without a floor the face appeared and was gone inside two frames — which is how the end
       of the game came to read as "it just resets". The smile arrives, it is given time to be
       a smile, and only then will the panel take a press. */
    outro.smile=(outro.smile||0)+dt;
    if(outro.smile<SMILE_HOLD) return;
    const press=Input.fireEdge||Input.scanEdge||Input.slowEdge||Input.startEdge||Input.enterEdge;
    if(press){ outro=null; SFX.ui(); finishRound(); }
    return;
  }
  const beat=OUTRO[outro.step]; if(!beat){ finishRound(); return; }
  const lines=beat.lines, len=lines.join('').length;
  const press=Input.fireEdge||Input.scanEdge||Input.slowEdge||Input.startEdge||Input.enterEdge;
  if(press){
    if(outro.ch<len) outro.ch=len;
    else {
      outro.step++; outro.ch=0; outro.hold=0.35;
    }
    SFX.ui();
    return;
  }
  const was=Math.floor(outro.ch);
  outro.ch=Math.min(len,outro.ch+TYPE_CPS*dt);
  speakFor(lines.join(''),was,Math.floor(outro.ch),true);
}
function drawOutro(){
  if(outro&&outro.step>=OUTRO.length){ drawTestimonial(); return; }
  ctx.save(); ctx.fillStyle='rgba(8,8,10,0.78)'; ctx.fillRect(0,0,VW,VH); ctx.restore();
  const u=PIXEL_K, jh2=JIM.height*u;
  const figY=Math.round((974-jh2)/u)*u;
  /* The two of them stand together on the left, under the title, and the card sits to their
     right — a portrait needs room around it, and two of them centred under a wide bubble left
     nothing anywhere. */
  /* Opposite ends of the screen, turned towards each other across it. Standing shoulder to
     shoulder in one corner they were a group photograph; apart, with the card moving between
     them, it is a conversation. Both are mirrored: the poster has them back to back, so left
     of frame natively looks left and right of frame looks right — which is outward. */
  const intX=336, docX=VW-336-JIM.width*u;
  /* Measured off the files rather than guessed at: in a three-quarter head the face fills more
     of the side it turns toward, and the centroid of lit skin puts Jim at 0.517 (turned right)
     and the intern at 0.470 (turned left). The intern stands on the left of the screen and Jim
     on the right, so each of them already turns towards the other — and mirroring them, which
     is what I had done, is precisely what pointed them both outward. */
  const speaker=(OUTRO[outro?outro.step:0]||OUTRO[0]).who;
  ctx.globalAlpha=speaker==='intern'?1:0.5;
  if(internOK) castPortrait(INTERN,intX,figY,'INTERN'); else drawIntern(intX,figY,u);
  ctx.globalAlpha=speaker==='jim'?1:0.5;
  if(jimOK) castPortrait(JIM,docX,figY,'JIM'); else drawDoc(docX,figY,u);
  ctx.globalAlpha=1;
  const beat=OUTRO[outro?outro.step:0]||OUTRO[0];
  const lines=beat.lines, speaking=beat.who;
  const bh=26+lines.length*38, bw=bubbleW(lines,24,30,420,880);
  /* The card sits over whoever is talking and its tail lands on them, so a glance says who is
     speaking before a word of it is read. */
  const sx=speaking==='jim'?docX:intX;
  const bx=clamp(sx+Math.round(JIM.width*u/2)-bw/2, RAIL, VW-RAIL-bw);
  const by=figY-bh-52;
  drawBubble(bx,by,bw,bh,sx+Math.round(JIM.width*u*0.42),true,lines,24,outro?outro.ch:999,false);
  const done=!outro||outro.ch>=lines.join('').length;
  if(done&&Math.sin(T*5)>-0.3)
    txt('▼',bx+bw-26,by+bh-14,
        {size:20,weight:800,col:CFG.col.red,align:'right',font:F_MONO});
  txt('SHIFT  OVER',RAIL,236,{size:96,weight:800,col:CFG.col.white,ls:'10px'});
  titleRule(RAIL+404,256,404);
}
function commitEntry(){
  const name=entry.ch.map(i=>ALPHA[i]).join('');
  const list=lbAdd(name,G.score);
  entry.list=list; entry.mine=list.findIndex(e=>e.n===name&&e.s===G.score);
  mode='OVER'; SFX.ui();
}
function handleInput(dt){
  if(mode==='ATTRACT'){
    /* Order matters here, and getting it wrong is what stopped the keyboard from working.
       The presses are handled first and the hold second: `Input.keys.size>0` is true on the
       very frame a key goes down, so with the hold tested first a keyboard Start was counted
       as the beginning of a hold and the credit never began — while a gamepad Start, which
       puts nothing in Input.keys, fell through and worked. Hence "the pad works, the
       keyboard does not".

       Start is excluded from the hold detector for the same reason: it now acts on its edge,
       so it can never also be the button held to reach the settings. Every other button can,
       which keeps the escape hatch usable when the mapping is wrong. */
    if(Input.menuEdge){ enterBind(); return; }
    if(Input.startEdge){ bindHold=0; startGame(); return; }
    const anyDown = Input.scan || Input.fire || Input.slow || Input.menu
                 || [...Input.keys].some(k=>!BIND.start.codes.includes(k)
                                            &&!KBD.start.includes(k));
    if(anyDown){
      bindHold+=dt;
      if(bindHold>3){ enterBind(); return; }
    } else bindHold=0;
    return;
  }
  if(mode==='BIND'){ bindTick(); return; }
  if(mode==='OUTRO'){ outroTick(dt); return; }
  if(mode==='PLAY'){
    /* Nobody at the panel. Every source of input counts, including a stick simply held, so a
       player who is thinking is not timed out — only an abandoned cabinet is. It goes back to
       the attract screen rather than to the report: an unfinished shift is not a result, and
       the next visitor should meet the poster. */
    const touched = Input.scan||Input.fire||Input.slow||Input.start||Input.menu||
                    Input.axis!==0||Input.keys.size>0;
    if(touched) idlePlay=0; else idlePlay+=dt;
    if(VOL.idle>0 && idlePlay>VOL.idle){
      idlePlay=0; objs.length=0; scanHumOn(false,0);
      mode='ATTRACT'; idle=0; newGame(); G.t=CFG.round;
      return;
    }
    if(Input.keys.has('Escape')){ Input.keys.delete('Escape'); endGame(); return; }
    /* Start taps to pause and holds to end the round. Esc above is a keyboard courtesy for
       development; the cabinet has no keyboard, so every way out has to be on the panel.
       Three seconds because ending a stranger's game by accident is unforgivable. */
    if(Input.start){
      startHold+=dt;
      if(startHold>3){ startHold=0; endGame(); return; }
    } else startHold=0;
    /* Start is free during a shift and it is the button a cabinet player reaches
       for. The pre-level and the stage hand-off consume presses of their own, so
       pausing is held back until the round is actually running. */
    if(Input.startEdge&&!(G.tut&&G.tut.on)&&G.inter<=0){ G.paused=!G.paused; SFX.ui(); }
    return;
  }
  if(mode==='ENTRY'){
    if(Input.upEdge){ entry.ch[entry.pos]=(entry.ch[entry.pos]+ALPHA.length-1)%ALPHA.length; SFX.ui(); }
    if(Input.downEdge){ entry.ch[entry.pos]=(entry.ch[entry.pos]+1)%ALPHA.length; SFX.ui(); }
    if(Input.leftEdge&&entry.pos>0){ entry.pos--; SFX.ui(); }
    if(Input.rightEdge&&entry.pos<2){ entry.pos++; SFX.ui(); }
    while(Input.typed.length){
      const k=Input.typed.shift();
      if(k==='\b'){ entry.pos=Math.max(0,entry.pos-1); }
      else { const i=ALPHA.indexOf(k);
        if(i>=0){ entry.ch[entry.pos]=i;
          if(entry.pos<2){ entry.pos++; SFX.ui(); } else { commitEntry(); return; } } }
    }
    if(Input.enterEdge){ commitEntry(); return; }
    if(Input.fireEdge){ if(entry.pos<2){ entry.pos++; SFX.ui(); } else { commitEntry(); return; } }
    return;
  }
  if(mode==='OVER'){
    Input.typed.length=0;
    if(Input.menuEdge){ enterBind(); return; }
    if(Input.startEdge) startGame();
    else { idle+=dt; if(idle>18){ mode='ATTRACT'; objs.length=0; idle=0; } }
  }
}

/* Press P for a frame-rate readout. Worth having on the cabinet: the step clamp
   below means a performance problem shows up as slow motion rather than as
   stutter, so without a number it is impossible to tell the two apart. */
let fpsAvg=60, fpsWorst=0, fpsT=0;
addEventListener('keydown',e=>{ if(e.code==='KeyP') showFps=!showFps;
                               if(e.code==='KeyK') crtOn=!crtOn;
                               if(e.code==='KeyM') musMuted=!musMuted; });

let prev=performance.now(), loopFailed=false;
function frame(now){
  if(loopFailed) return;
  try{ return frameBody(now); }
  catch(err){ loopFailed=true; fatal('render loop: '+(err&&err.message||err), err&&err.stack?String(err.stack).split('\n')[1]:''); }
}
function frameBody(now){
  const raw=(now-prev)/1000;
  const dt=Math.min(0.045,raw); prev=now;
  /* Frames over half a second are the tab being suspended, not render cost —
     counting them made the worst-frame figure meaningless. */
  if(raw<0.5){
    fpsAvg=fpsAvg*0.9+(1/Math.max(raw,0.0001))*0.1;
    fpsWorst=Math.max(fpsWorst,raw*1000);
  }
  fpsT+=raw; if(fpsT>2){ fpsT=0; fpsWorst=0; }
  pollInput(); handleInput(dt); update(dt);

  ctx.save();
  if(shake>0){ const m=shake*16; ctx.translate(rnd(-m,m),rnd(-m,m)); }
  drawWorld();
  ctx.restore();

  // Vignette over the bore only, so it runs before the HUD: laid on top it dimmed
  // the case slip's stock to grey and cost real legibility. Fake CRT scanlines
  // were a costume rather than a choice, so there are none.
  /* Stepped like the background, and cached — a smooth vignette laid over flat bands
     put the continuous ramp straight back. */
  const vg=vigBuffer();
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(vg,0,0,vg.width,vg.height,0,0,VW,VH);
  ctx.imageSmoothingEnabled=true;

  if(mode==='PLAY') drawPlayHUD();
  else if(mode==='ATTRACT') drawAttract();
  else if(mode==='BIND') drawBind();
  else if(mode==='OUTRO') drawOutro();
  else drawOver();

  if(showFps){
    const ok=fpsAvg>50;
    txt(Math.round(fpsAvg)+' FPS   WORST '+fpsWorst.toFixed(0)+' MS',VW-46,VH-24,
        {size:20,weight:800,col:ok?CFG.col.good:CFG.col.redHot,align:'right',ls:'3px',font:F_MONO});
    txt('VIEWPORT '+innerWidth+'x'+innerHeight+'   CANVAS '+cvs.style.width+'x'+cvs.style.height,
        VW-46,VH-50,{size:15,weight:700,col:CFG.col.dim,align:'right',ls:'2px',font:F_MONO});
  }

  /* Counted here rather than in update(): update returns early on a lesson panel, on a pause,
     on the stage hand-over and on the closing speech, so the wave's clock simply stopped and
     the picture stayed swimming through the outro. A screen effect is owned by the screen. */
  if(G&&G.wave>0) G.wave=Math.max(0,G.wave-dt);
  wipeTick(dt);
  if(wipeT>0){ ctx.fillStyle='rgba(0,0,0,'+wipeT.toFixed(3)+')'; ctx.fillRect(0,0,VW,VH); }
  musTick(dt);
  present();
  requestAnimationFrame(frame);
}
newGame(); mode='ATTRACT'; G.t=CFG.round;
applyBtnLabels();          // resolve {SCAN}/{FIRE} in the lesson before anything draws
rebuildKbd();              // the keyboard layer, minus anything the panel has claimed
saveVol();                 // push the stored levels and toggles into the live state
requestAnimationFrame(frame);

function goFS(){ const el=document.documentElement;
  if(!document.fullscreenElement&&el.requestFullscreen) el.requestFullscreen().catch(()=>{}); }
addEventListener('keydown',e=>{ if(e.code==='KeyF') goFS(); });
addEventListener('dblclick',goFS);
</script>

        o.state='prepped'; o.crown=pick(stock());
        G.scans++; G.caseNo++; G.score+=CFG.score.scan*G.combo; G.designFlash=0.5;
        drillTick('scans');
        SFX.scanned();
        /* The scan drill does not run the mill. The player has not been shown it yet — the mill
           plate comes after this drill — so a crown appearing in the magazine both gives away
           the next lesson and hands them a button that is not the subject. Nothing to fire,
           nothing to miss: the drill is one verb wide. */
        if(drill()!=='scan') startMilling(o.crown);
        pops.push({x:o.x,col:o.crown.col,t:0,txt:o.crown.label.toUpperCase()+' '+o.crown.shade});
        G.target=null;
      }
    } else if(o.scan>0) o.scan=Math.max(0,o.scan-dt*0.9);
  }
  G.designFlash=Math.max(0,G.designFlash-dt);

  /* The mill turns whatever the scanner sent it, on its own clock. */
  for(let i=G.mill.length-1;i>=0;i--){
    const m=G.mill[i];
    m.prog=Math.min(1,m.prog+dt/tier().mill);
    /* A finished crown waits in the mill until a slot frees, rather than being thrown away.
       It used to be spliced out on completion and silently dropped if the magazine was full —
       which is what the old scan block existed to prevent. Holding it here is what lets the
       scanner run unconditionally: the case is never lost, it just queues. */
    if(m.prog>=1 && G.mag.length<CFG.magMax){
      G.mill.splice(i,1);
      G.mag.push(m.crown); SFX.dock(); flash(m.crown.col);
    }
  }

  /* The seat drill supplies the crowns, because the thing it is about is the button, not the
     stock. Topped up rather than pre-filled: three cases can outlast one magazine. */
  if(drill()==='seat'&&!G.mag.length&&!G.mill.length) G.mag.push(pick(stock()));

  if(Input.fireEdge) fire();
  }   // end of the stage-one pipeline

  /* Movement and resolution. Removals are marked, never spliced in place: this
     loop walks the array backwards, and a shot that consumed both itself and a
     piece of debris shortened it by two below the cursor, so the next read was
     undefined. Marking, then sweeping once at the end, makes that impossible. */
  for(let i=objs.length-1;i>=0;i--){
    const o=objs[i];
    if(!o||o.dead) continue;
    o.pz=o.z;
    if(o.kind==='shot'){
      o.z+=(CFG.shotSpeed-G.speed*G.thrust)*dt; o.spin+=dt*9;
      // crossing test against every live target at this depth
      let consumed=false;
      /* The nearest socket takes the shot, not the first one the array happens to offer.
         The tolerance is ±84 against a spacing of 85, so two neighbours qualify for almost
         every shot, and array order decided which — meaning a shot lined up dead centre was
         routinely awarded to the socket next door. Measured, the window for hitting the one
         you were aiming at came out at 16 world units against a socket drawn 113 wide, and
         widening the tolerance made it worse rather than better, because it brought a third
         neighbour into the running. Picking the nearest turns the tolerance into what it
         always read as: aim at a socket, hit that socket. */
      let near=null, nearD=Infinity;
      for(const t of objs){
        if(t===o||t.done||t.dead||t.kind!=='socket') continue;
        const pr=t.pz-o.pz, rl=t.z-o.z;
        if(!(pr>0&&rl<=0&&Math.abs(t.x-o.x)<t.r+o.r+CFG.surgery.hitPad)) continue;
        if(t.row!==activeRow()||!t.need) continue;
        const d=Math.abs(t.x-o.x);
        if(d<nearD){ nearD=d; near=t; }
      }
      for(const t of objs){
        if(t===o||t.done||t.dead) continue;
        if(t.kind==='socket'){
          if(t!==near) continue;
          if(t.need===o.ptype){
            if(o.ptype==='implant'){
              t.need='crown'; G.placed++;
              G.score+=CFG.score.seat*G.combo;
              SFX.seat(); flash(o.crown.col);
              pops.push({x:t.x,col:o.crown.col,t:0,txt:'PLACED'});
            } else {
              t.need=null; t.dead=true; G.seats++;
              G.score+=(CFG.score.seat+CFG.score.match)*G.combo;
              G.combo=Math.min(CFG.score.comboCap,G.combo+1); G.stamp=0.6;
              SFX.match(); flash(o.crown.col);
              pops.push({x:t.x,col:CFG.col.score,t:0,txt:'RESTORED'});
            }
            scrParts(t.x,o.crown.col,20,460);
            pixBurst(proj(t.x,PLANE_Y,t.z).x,proj(t.x,PLANE_Y,t.z).y,o.crown.col,0.9);
          } else {
            /* Wrong part, right socket: a mistake of order, not of supply. The crown is not used up
               — it comes back to the magazine. Before this it was spent, and since the board issues
               only three spare crowns, three mis-ordered shots emptied the stock; an empty stock
               costs a remake, and three remakes end the round. That is why the second stage was
               finishing seconds after it began. The combo still breaks, which is punishment enough
               for going out of order. */
            const rbox=o.ptype==='implant'?'imp':'crown';
            if(!freeStock(o.ptype)) G.ammo[rbox]++;
            G.misses++; G.combo=1; SFX.miss();
            pops.push({x:t.x,col:CFG.col.bad,t:0,
                       txt:t.need==='implant'?'NEEDS IMPLANT':'NEEDS CROWN'});
          }
          consumed=true; break;
        }
        if(t.kind==='tooth'&&t.state==='prepped'){
          const prevRel=t.pz-o.pz, rel=t.z-o.z;
          if(prevRel>0&&rel<=0&&Math.abs(t.x-o.x)<t.r+o.r){
            t.done=true; t.state='repaired';
            const match=t.crown.id===o.crown.id;
            let gain=CFG.score.seat*G.combo;
            if(match){ gain+=CFG.score.match*G.combo; G.matches++; }
            G.score+=gain; G.seats++;
            G.combo=Math.min(CFG.score.comboCap,G.combo+1); G.stamp=0.6;
            /* The free round is counted in finished cases, not in seconds. Nobody should be
               moved on by a clock they were told to ignore. */
            drillTick('seats');
            match?SFX.match():SFX.seat(); flash(o.crown.col);
            if(o.crown.fixture) G.placed++;
            pops.push({x:t.x,col:match?CFG.col.score:o.crown.col,t:0,
                       txt:(o.crown.fixture
                            ? (match?'SIZE MATCH  +':'PLACED  +')
                            : (match?'SHADE MATCH  +':'SEATED  +'))+gain});
            scrParts(t.x,o.crown.col,26,520);
            pixBurst(proj(t.x,PLANE_Y,SHIP_Z).x,proj(t.x,PLANE_Y,SHIP_Z).y,
                     match?CFG.col.score:o.crown.col,1.15);
            consumed=true; break;
          }
        } else if(t.kind==='debris'){
          const prevRel=t.pz-o.pz, rel=t.z-o.z;
          if(prevRel>0&&rel<=0&&Math.abs(t.x-o.x)<t.r+o.r){
            t.done=true; G.score+=CFG.score.save*G.combo;
            SFX.smash(); scrParts(t.x,CFG.col.redHot,16,420);
            t.dead=true;
            consumed=true; break;
          }
        }
      }
      if(consumed||o.z>FAR_Z+400) o.dead=true;
      continue;
    }
    if(o.state==='crumbling'){
      /* It has lost the line: half speed, and held clear of the near cull so the
         collapse always gets its full second even at the fastest levels. */
      o.z=Math.max(NEAR_CULL+60,o.z-G.speed*G.thrust*dt*0.5);
      const was=o.cr;
      o.cr+=dt/CRUMBLE_SECS;
      // powder the whole way down, and heavier pieces letting go in stages
      o.puff+=dt;
      if(o.puff>0.05){ o.puff=0; dustFrom(o,2,1); }
      if(was<0.3&&o.cr>=0.3) chunkFrom(o,3);
      if(was<0.62&&o.cr>=0.62) chunkFrom(o,3);
      if(o.cr>=1) o.dead=true;
      continue;
    }
    // world objects scroll toward the camera
    /* On the scan drill a scanned tooth is finished — its case has gone to the lab — so it
       clears out at three times the speed instead of coasting the length of the bore with
       nothing left to do. That coast was three seconds of the next rep waiting behind it. */
    const away=(drill()==='scan'&&o.kind==='tooth'&&o.state==='prepped')?3:1;
    o.z-=G.speed*G.thrust*dt*away;
    if(o.spin!==undefined) o.spin+=dt*(o.sv||(o.kind==='pod'?2.2:0.9));
    if(o.pulse!==undefined) o.pulse+=dt*4;

    // cracked and unscanned: it never reaches the wand, it comes apart on the line
    if(o.kind==='tooth'&&o.state==='broken'&&o.z<=scanNear()&&!practising()){
      beginCollapse(o); continue;
    }
    if(!o.done&&o.pz>SHIP_Z&&o.z<=SHIP_Z){
      o.done=true;
      if(o.kind==='debris'){
        if(Math.abs(o.x-G.x)<o.r+40){
          /* One consequence, and it is the right one: the picture swims for three seconds and
             you cannot aim through it. A wet field does not cost you a hundred points, it costs
             you your view — so the penalty is felt at the stick rather than read off a banner.
             Everything else it used to do (score, combo, speed, shake, a red flash and a line
             of type) went; five simultaneous punishments for one mistake taught nothing. */
          G.wave=WAVE_SECS; SFX.hit();
          scrParts(o.x,CFG.col.wet,22,600);
          pixBurst(proj(o.x,PLANE_Y,SHIP_Z).x,proj(o.x,PLANE_Y,SHIP_Z).y,CFG.col.wet,1.1);
        }
      } else if(o.kind==='pod'){
        /* Whether it was caught or missed, the first mark has now been seen and named, so the
           label retires. Set on the pass rather than on the catch: someone who flew round the
           first one has still read it. */
        G.podLabelled=true;
        if(Math.abs(o.x-G.x)<o.r+40){
          G.pods++;
          if(G.tier<CFG.scanner.length-1){
            G.tier++; G.score+=CFG.score.pod*G.combo;
            banner('SCANNER  '+tier().mk,CFG.col.score);
            hint('FASTER CLOSE  ·  WIDER LOCK  ·  LONGER REACH',3);
          } else {
            G.score+=CFG.score.maxPod*G.combo;
            banner('SCANNER MAXED  +'+CFG.score.maxPod*G.combo,CFG.col.score);
          }
          SFX.upgrade(); flash(CFG.col.white); scrParts(o.x,CFG.col.red,26,520);
          pixBurst(proj(o.x,PLANE_Y,SHIP_Z).x,proj(o.x,PLANE_Y,SHIP_Z).y,'#FFF6E6',1.2);
        }
      } else if(o.kind==='tooth'&&o.state==='prepped'){
        /* A tooth you opened and did not finish is still a tooth the patient has lost, so it
           goes on the surgery list exactly like one that was never touched. Only the collapse
           path counted before, which meant scanning a tooth and then missing it quietly removed
           it from the day's work — the one case where doing more got you less. The remake still
           stands: that is the cost of opening a case you could not close. */
        /* Practice keeps the feedback and drops the bill: the combo breaks and the miss is
           heard, but no remake is spent and nobody joins the surgery list. A free round that
           still punished would not be a free round. */
        if(drill()==='scan'){
          /* Nothing at all. On this drill a scanned tooth is a finished job — there is no mill
             running and no crown to seat, so it flies on through. Breaking the combo here
             punished the player for not doing the thing they had been told not to do yet. */
        } else if(practising()){
          G.combo=1; G.warn=0.9; SFX.miss();
        } else {
        G.lost++; G.combo=1; G.remakes--; G.warn=1.2; shake=0.5;
        if(!(G.tut&&G.tut.on)){ G.extracted++; G.implantQ++; G.queuePop=1.0; }
        SFX.miss(); flash(CFG.col.bad);
        if(G.implantQ===CFG.implantsToAdvance-1 && !G.closing && !G.warned9){
          G.warned9=true; banner('ONE MORE  ·  THEN SURGERY',CFG.col.score);
        }
        if(G.implantQ>=CFG.implantsToAdvance && !G.closing){
          G.closing=CLOSING_SECS; banner('BENCH CLOSING  ·  FINISH THE CASE',CFG.col.score);
        }
        if(G.remakes<=0){
          G.remakes=0; banner('LINE STOPPED',CFG.col.bad);
          stopLine(); return;
        }
        banner('CASE LOST  ·  '+G.remakes+' REMAKE'+(G.remakes===1?'':'S')+' LEFT',CFG.col.bad);
        }
      }
    }
    if(o.z<NEAR_CULL) o.dead=true;
  }
  for(let i=objs.length-1;i>=0;i--) if(objs[i].dead) objs.splice(i,1);

  if(G.practice&&G.practice.over>0){
    G.practice.over-=dt;
    if(G.practice.over<=0&&!G.practice.leaving){
      const id=G.practice.id; G.practice.leaving=true; wipeTo(()=>afterDrill(id));
    }
  }
  G.stamp=Math.max(0,G.stamp-dt);
  G.queuePop=Math.max(0,G.queuePop-dt);
  G.warn=Math.max(0,G.warn-dt);
  G.ringFlash=Math.max(0,G.ringFlash-dt*2);
  G.flash=Math.max(0,G.flash-dt*3.4);
  G.bannerT=Math.max(0,G.bannerT-dt);
  G.hintT=Math.max(0,G.hintT-dt);
}

/* The formation marches, reverses at the span, and steps in every time it turns.
   Reaching the wand is a breach and costs a remake, the same currency as a dropped
   case in stage one. */
function surgeryTick(dt){
  const S=CFG.surgery;
  /* Left to right on the panel is the order of the operation: the fixture goes in
     first, the crown caps it. C keeps meaning "buy me time" in both stages, so only
     the two action buttons change job — Z was dead weight here before. */
  if(Input.scanEdge) fireStock('implant');
  if(Input.fireEdge) fireStock('crown');

  const march=S.marchSpeed*(G.slowing?0.42:1);
  G.formX+=G.formDir*march*dt*(1+G.wave*0.12);
  if(Math.abs(G.formX)>=S.marchSpan){
    G.formX=Math.sign(G.formX)*S.marchSpan;
    G.formDir*=-1;
    for(let r=0;r<2;r++) G.rowZ[r]-=S.stepIn;
    SFX.lock();
  }
  for(const o of objs) if(o.kind==='socket'&&!o.dead){
    o.pz=o.z; o.x=o.baseX+G.formX; o.z=G.rowZ[o.row]; o.pulse+=dt*3;
  }
  /* Surgery is the shift's own backlog, once — not a wave shooter. Both of the failure paths
     below used to wipe every socket and spawn a fresh full rank of ten, which is why unfinished
     sockets vanished mid-operation and a new row marched in: from the seat that reads as the game
     losing track. And it meant the count stopped matching the number of teeth lost after the
     first rank, which is the other thing that made no sense. Now nothing is ever wiped: the same
     sockets stay on the board until they are capped. */
  // the near rank reached the wand
  if(G.rowZ[0]<=S.breachZ&&liveSockets(0)>0){
    G.remakes--; G.warn=1.2; shake=1; SFX.hit(); flash(CFG.col.bad);
    if(G.remakes<=0){ G.remakes=0; banner('LINE STOPPED',CFG.col.bad);
                      stopLine(); return; }
    banner('PUSHED BACK  ·  '+G.remakes+' REMAKE'+(G.remakes===1?'':'S')+' LEFT',CFG.col.bad);
    // the formation retreats and the work stands; a remake buys distance, not a new board
    G.rowZ=[S.rowZ[0],S.rowZ[1]]; G.formX=0; G.formDir=1;
    return;
  }
  // out of crowns with sockets still open — only reachable when crowns are counted
  if(!freeStock('crown')&&G.ammo.crown<=0&&activeRow()>=0){
    G.remakes--; G.warn=1.2; SFX.miss(); flash(CFG.col.bad);
    if(G.remakes<=0){ G.remakes=0; banner('LINE STOPPED',CFG.col.bad);
                      stopLine(); return; }
    // a remake is a re-do, so it resupplies: enough for what is left, plus one spare
    G.ammo.crown=liveSockets(0)+liveSockets(1)+1;
    banner('RESUPPLIED  ·  '+G.remakes+' REMAKE'+(G.remakes===1?'':'S')+' LEFT',CFG.col.score);
    return;
  }
  /* Cleared. This is the only way to finish the shift by finishing it rather than by failing —
     the stage used to have no win at all, which on a stand meant every visitor ended on a loss. */
  if(activeRow()<0){
    banner('ALL CASES CLOSED',CFG.col.score);
    G.endedBy='SURGERY'; SFX.upgrade(); flash(CFG.col.white);
    endGame(); return;
  }
}

/* ── SHAPES ─────────────────────────────────────────────────────────────── */
function toothPath(c){
  c.beginPath();
  c.moveTo(-1.00,-0.20);
  c.bezierCurveTo(-1.10,-0.95,-0.55,-1.20,-0.30,-0.95);
  c.bezierCurveTo(-0.12,-0.78, 0.12,-0.78, 0.30,-0.95);
  c.bezierCurveTo( 0.55,-1.20, 1.10,-0.95, 1.00,-0.20);
  c.bezierCurveTo( 0.95, 0.10, 0.80, 0.30, 0.72, 0.62);
  c.bezierCurveTo( 0.66, 0.98, 0.40, 1.08, 0.30, 0.72);
  c.bezierCurveTo( 0.22, 0.45, 0.10, 0.40, 0.00, 0.40);
  c.bezierCurveTo(-0.10, 0.40,-0.22, 0.45,-0.30, 0.72);
  c.bezierCurveTo(-0.40, 1.08,-0.66, 0.98,-0.72, 0.62);
  c.bezierCurveTo(-0.80, 0.30,-0.95, 0.10,-1.00,-0.20);
  c.closePath();
}
function crownPath(c){
  c.beginPath();
  c.moveTo(-1.00, 0.34);
  c.bezierCurveTo(-1.12,-0.58,-0.55,-1.06,-0.30,-0.80);
  c.bezierCurveTo(-0.12,-0.62, 0.12,-0.62, 0.30,-0.80);
  c.bezierCurveTo( 0.55,-1.06, 1.12,-0.58, 1.00, 0.34);
  c.bezierCurveTo( 0.58, 0.56,-0.58, 0.56,-1.00, 0.34);
  c.closePath();
}
/* A prepared tooth: what is left after the dentist grinds one down to take a crown. Tapered,
   with a shoulder at the margin, and the margin is at y=0 so drawing it on the margin line
   needs no offset. Narrower than the crown at every height — the crown wraps it. */
function abutmentPath(c){
  /* The shoulder is 0.88 wide because the crown's rim is 1.00 wide at 0.90 scale. A narrower
     ledge left the crown's edge hanging in the air on both sides with only its middle in
     contact — which is the gap. */
  c.beginPath();
  c.moveTo(-0.88, 0.00);
  c.lineTo(-0.74,-0.34);
  c.bezierCurveTo(-0.70,-0.74,-0.42,-0.84,-0.20,-0.84);
  c.lineTo( 0.20,-0.84);
  c.bezierCurveTo( 0.42,-0.84, 0.70,-0.74, 0.74,-0.34);
  c.lineTo( 0.88, 0.00);
  c.closePath();
}
/* A Hahn fixture: platform, tapered body, thread ridges. Same unit space as the
   crown so everything that drew a crown can draw one of these instead. */
function implantPath(c){
  c.beginPath();
  c.moveTo(-0.54,-1.00); c.lineTo(0.54,-1.00);
  c.lineTo(0.48,-0.74);  c.lineTo(0.40,-0.60);
  c.bezierCurveTo(0.38,0.10, 0.26,0.62, 0.00,1.06);
  c.bezierCurveTo(-0.26,0.62,-0.38,0.10,-0.40,-0.60);
  c.lineTo(-0.48,-0.74);
  c.closePath();
}
const partPath=(c,part)=>part&&part.fixture?implantPath(c):crownPath(c);
/* A mask key must say WHICH SHAPE, not which product. CFG.crowns holds a crown with id
   'HAHN' and surgery.implant is a FIXTURE also called 'HAHN' — keyed on the id alone the
   cache handed the crown's silhouette to the fixture, so in surgery you appeared to be
   firing a crown while you were in fact firing an implant. */
const partKey=p=>(p&&p.fixture?'fix-':'crown-')+(p?p.id:'?');
/* What a finished part actually occupies in its own unit space, measured rather than assumed.
   The blank it is cut from is sized off this, because the blank has to be the bigger of the
   two — it was drawn at a hand-picked half-width of 0.90 while the crown's curve reaches about
   1.05, so the finished crown came out wider than the block it was milled from. Sampled once
   per part type; the paths are drawn imperatively so there is nothing to read back but the
   fill itself. */
const PART_BOUNDS={};
function partBounds(part){
  const key=part&&part.fixture?'fixture':'crown';
  if(PART_BOUNDS[key]) return PART_BOUNDS[key];
  const c=document.createElement('canvas').getContext('2d');
  const N=120, S=1.5;
  let x0=9,x1=-9,y0=9,y1=-9;
  partPath(c,part);
  for(let i=0;i<=N;i++) for(let j=0;j<=N;j++){
    const x=-S+2*S*i/N, y=-S+2*S*j/N;
    if(c.isPointInPath(x,y)){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
  }
  // a blank is a symmetric block, so each axis takes the larger half-extent
  const hw=Math.max(-x0,x1), hh=Math.max(-y0,y1);
  return PART_BOUNDS[key]={x0,x1,y0,y1,hw,hh};
}
/* An extraction site: a block of bone with an open socket in it. */
function socketPath(c){
  c.beginPath();
  c.moveTo(-1.00,-0.26);
  c.bezierCurveTo(-1.03,-0.76,-0.55,-0.94, 0.00,-0.94);
  c.bezierCurveTo( 0.55,-0.94, 1.03,-0.76, 1.00,-0.26);
  c.lineTo(0.84,0.96); c.lineTo(-0.84,0.96);
  c.closePath();
}
function cavityPath(c){
  c.beginPath();
  c.moveTo(-0.42,-0.70);
  c.bezierCurveTo(-0.44,0.06,-0.28,0.48, 0.00,0.66);
  c.bezierCurveTo( 0.28,0.48, 0.44,0.06, 0.42,-0.70);
  c.closePath();
}
/* The threads, drawn inside the silhouette so they read as a screw at any size. */
function threadLines(c){
  c.save();
  partPath(c,{fixture:true}); c.clip();
  c.strokeStyle='rgba(40,44,50,0.55)'; c.lineWidth=0.055;
  for(let i=0;i<6;i++){
    const y=-0.44+i*0.26;
    c.beginPath(); c.moveTo(-0.45,y); c.lineTo(0.45,y-0.10); c.stroke();
  }
  c.restore();
}
function withT(c,x,y,s,rot,fn){ c.save(); c.translate(x,y); c.rotate(rot||0); c.scale(s,s); fn(); c.restore(); }

/* ── RENDER: WORLD ──────────────────────────────────────────────────────── */
/* The background is fixed — the same wash and the same centre bloom every frame — so it
   is rendered once into a 1/12-scale buffer and blitted up with smoothing off, which puts
   it on flat 12px blocks and costs one drawImage a frame instead of two full-screen
   gradient fills.

   The tones are then snapped to a fixed seven-colour ramp, which is the part that makes
   it read as eight-bit. Posterising each channel to N even levels was the obvious way and
   it was wrong: this palette lives between about 8 and 40 per channel, so an even step of
   36 collapsed the whole wash onto one or two levels and threw hard stripes and magenta
   blocks wherever it crossed a boundary. A hand-picked ramp keeps the hue family and puts
   the steps where the picture actually has range. */
/* 3, not 12. The background was the one thing still drawn at a coarser pixel than everything else
   — four times the block of the type, the rings and the sprites — and on a dark radial falloff that
   reads as giant squares. On the shared block it is 640x360 in the buffer, the same as the title art,
   and costs exactly the same one drawImage.

   Written as a literal rather than as PIXEL_K: that constant is declared nine hundred lines further
   down, and a const referring forward throws on evaluation and takes the whole script with it. */
const BG_BLOCK=3;
/* Fourteen steps rather than seven. Seven put a visible band every few pixels across the falloff;
   doubling them halves the band and keeps the flat-stepped look that makes it read as drawn rather
   than as a photographic ramp. Still a fixed ramp, still in the crimson family. */
/* Warm, not lilac. The old ramp's dark half was blue-grey (#0B0C10, #12141A: blue above red),
   which is what read as cold. Same luminance staircase so the falloff is unchanged; every step
   now sits on the warm side, near-black through deep maroon into warm brick. */
const BG_RAMP=['#0A0808','#0E0B0A','#130E0C','#18110E','#1D1310','#231512','#2A1714',
               '#311816','#391A18','#421C1A','#4B1F1D','#552220','#602624','#6C2A29'];
let BGBUF=null, VIGBUF=null;
function rampTo(buf,w,h,ramp){
  const g=buf.getContext('2d'), img=g.getImageData(0,0,w,h), d=img.data;
  const cols=ramp.map(c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),
                          parseInt(c.slice(5,7),16)]);
  const lum=c=>c[0]*0.30+c[1]*0.59+c[2]*0.11;
  const stops=cols.map(lum);
  let lo=Infinity, hi=-Infinity;
  for(let i=0;i<d.length;i+=4){
    const L=d[i]*0.30+d[i+1]*0.59+d[i+2]*0.11;
    if(L<lo) lo=L; if(L>hi) hi=L;
  }
  const span=Math.max(1,hi-lo), rspan=Math.max(1,stops[stops.length-1]-stops[0]);
  for(let i=0;i<d.length;i+=4){
    // where this pixel sits in the picture's own range, mapped onto the ramp's
    const t=(d[i]*0.30+d[i+1]*0.59+d[i+2]*0.11-lo)/span;
    const want=stops[0]+t*rspan;
    let best=0, bd=Infinity;
    for(let k=0;k<stops.length;k++){ const e=Math.abs(stops[k]-want); if(e<bd){bd=e;best=k;} }
    d[i]=cols[best][0]; d[i+1]=cols[best][1]; d[i+2]=cols[best][2];
  }
  g.putImageData(img,0,0);
}
function bgBuffer(){
  if(BGBUF) return BGBUF;
  const bw=Math.ceil(VW/BG_BLOCK), bh=Math.ceil(VH/BG_BLOCK), k=1/BG_BLOCK;
  const c=document.createElement('canvas'); c.width=bw; c.height=bh;
  const g=c.getContext('2d');
  const lin=g.createLinearGradient(0,0,0,bh);
  lin.addColorStop(0,CFG.col.g0); lin.addColorStop(0.50,CFG.col.g2); lin.addColorStop(1,'#08080A');
  g.fillStyle=lin; g.fillRect(0,0,bw,bh);
  const r=g.createRadialGradient(PX*k,HZ*k,10*k,PX*k,HZ*k,820*k);
  r.addColorStop(0,'rgba(242,236,223,0.15)'); r.addColorStop(0.35,'rgba(235,0,69,0.08)');
  r.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=r; g.fillRect(0,0,bw,bh);
  rampTo(c,bw,bh,BG_RAMP);
  BGBUF=c; return BGBUF;
}
/* The vignette gets the blocks but not the ramp: it is pure alpha over the finished
   picture, and snapping alpha to a few levels striped it the same way. */
function vigBuffer(){
  if(VIGBUF) return VIGBUF;
  const bw=Math.ceil(VW/BG_BLOCK), bh=Math.ceil(VH/BG_BLOCK), k=1/BG_BLOCK;
  const c=document.createElement('canvas'); c.width=bw; c.height=bh;
  const g=c.getContext('2d');
  const v=g.createRadialGradient(PX*k,VH/2*k,VH*0.44*k,PX*k,VH/2*k,VH*1.10*k);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.22)');
  g.fillStyle=v; g.fillRect(0,0,bw,bh);
  VIGBUF=c; return VIGBUF;
}
function drawBackground(){
  const b=bgBuffer();
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(b,0,0,b.width,b.height,0,0,VW,VH);
  ctx.imageSmoothingEnabled=true;
}
/* The bore of the spindle, looking into the puck: concentric cut rings, the
   clamp spokes that hold the disc, and the cut plane the teeth stand on. A round
   bore is what the machine actually has — the wireframe box was the sci-fi
   default, and it is the single most templated shape on a canvas. */
function drawBore(){
  const step=260, off=scroll%step;
  for(let i=13;i>=0;i--){
    const z=SHIP_Z+i*step-off; if(z<60) continue;
    const sc=FOV/z, a=clamp(1-z/FAR_Z,0,1);
    pixRing(PX,HZ,BORE_R*sc,PIXEL_K,`rgba(122,128,138,${(a*0.32).toFixed(3)})`,0,0,0);
  }
  for(let k=0;k<6;k++){
    const ang=k*Math.PI/3+0.26;
    const wx=Math.cos(ang)*BORE_R, wy=Math.sin(ang)*BORE_R;
    const a=proj(wx,wy,SHIP_Z*1.02), b=proj(wx,wy,FAR_Z);
    ctx.strokeStyle=grad('spoke'+k,()=>{
      const g=ctx.createLinearGradient(b.x,b.y,a.x,a.y);
      g.addColorStop(0,'rgba(122,128,138,0.02)'); g.addColorStop(1,'rgba(122,128,138,0.40)');
      return g; });
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(a.x,a.y); ctx.stroke();
  }
  // the cut plane: the chord everything in the game stands on
  const cl=proj(-BORE_R*0.94,PLANE_Y,SHIP_Z*1.05), cr=proj(BORE_R*0.94,PLANE_Y,SHIP_Z*1.05);
  const vp=proj(0,PLANE_Y,FAR_Z);
  ctx.strokeStyle=grad('cutplane',()=>{
    const cg=ctx.createLinearGradient(vp.x,vp.y,cl.x,cl.y);
    cg.addColorStop(0,'rgba(235,0,69,0)'); cg.addColorStop(1,'rgba(235,0,69,0.22)');
    return cg; });
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cl.x,cl.y); ctx.lineTo(vp.x,vp.y); ctx.lineTo(cr.x,cr.y); ctx.stroke();
  /* The flying motes are gone. They were meant as chalk dust off the cut, but at any real
     speed they projected into streaks pointing straight at the camera, and a field of white
     lines converging on the viewer is the one thing on the glass that competes with the
     teeth — the teeth being the only thing anybody is supposed to be looking at. Speed is
     already carried by the bore's own rings scrolling past. */
}

/* The implant line. Fixed distance, so it is a constant ring in the bore: outside
   it a tooth can still be crowned, inside it the case is an implant and the scanner
   will not take it. Drawing and naming it makes the rule legible instead of
   something you infer from failing. */
function drawNoReturn(){
  const sc=FOV/scanNear(), r=BORE_R*sc*0.92;
  const hot=G.ringFlash>0?G.ringFlash:0;
  const pulse=0.5+0.5*Math.sin(T*2.2);
  ctx.save();
  // a standing glow so the boundary is felt even before anything breaks on it
  glow(PX,HZ,r*1.22,'#EB0045',0.10+0.05*pulse+hot*0.30);
  // an outer keyline, then the travelling dashed rule — both plotted on the grid
  pixRing(PX,HZ,r*1.10,PIXEL_K,'rgba(235,0,69,'+(0.30+hot*0.5).toFixed(3)+')',0,0,0);
  pixRing(PX,HZ,r,PIXEL_K,'rgba(255,74,114,'+(0.70+0.12*pulse+hot*0.30).toFixed(3)+')',
          4,3,scroll*0.06);
  // tick marks at the quarters, so it reads as a machine limit, not decoration
  ctx.strokeStyle='rgba(255,74,114,'+(0.5+hot*0.4).toFixed(2)+')'; ctx.lineWidth=3;
  for(let k=0;k<4;k++){
    const a=k*Math.PI/2+Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(PX+Math.cos(a)*r*0.94,HZ+Math.sin(a)*r*0.94);
    ctx.lineTo(PX+Math.cos(a)*r*1.14,HZ+Math.sin(a)*r*1.14);
    ctx.stroke();
  }
  ctx.restore();
}
/* The line's type, drawn on the HUD layer instead of with the ring.
   Inside the zoom it was magnified along with everything else and rode up into the
   hint band across the top — and it cannot simply be nudged back, because anything
   drawn under the transform gets transformed again. So the ring scales, as the
   boundary must, and its label does not: it is placed against where the ring has
   actually ended up, and never allowed above the band. */
function drawNoReturnLabel(){
  /* Faded out as the lesson pushes in. Magnified, the ring fills the frame and there
     is no longer room above it for its own caption — it ends up in the hint band at
     the top of the screen. And it should go anyway: when the camera is close on a
     tooth, the boundary's name is not what is being looked at. The one beat that IS
     about this line asks for no zoom, so the label is at full strength exactly when
     it is the subject. */
  const fade=clamp((1.25-CAM.k)/0.25,0,1);
  if(fade<=0.02) return;
  const sc=FOV/scanNear(), r=BORE_R*sc*0.92*CAM.k;
  const hot=G.ringFlash>0?G.ringFlash:0;
  const c=camPt(PX,HZ);
  const ly=c.y-r-104;
  ctx.save();
  ctx.globalAlpha=fade;
  /* Clear of the ring, not resting on it. Sat this close the subline ran through the
     bore's own rings and the tick marks and stopped being type at all. */
  txt('IMPLANT LINE',c.x,ly,
      {size:19,weight:800,col:'rgba(255,74,114,'+(0.82+hot*0.18).toFixed(2)+')',
       align:'center',ls:'7px',font:F_MONO});
  txt('NO CROWN BEYOND THIS POINT',c.x,ly+42,
      {size:13,weight:700,col:'rgba(255,74,114,'+(0.42+hot*0.3).toFixed(2)+')',
       align:'center',ls:'4px',font:F_MONO});
  ctx.restore();
}

/* Aim line down the bore: this is a shooter, so where the crown will go has to
   be visible before the trigger is pulled. */
function drawAimLine(){
  const a=proj(G.x,PLANE_Y,SHIP_Z*1.3), b=proj(G.x,PLANE_Y,scanFar());
  const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
  const loaded=G.mag.length>0;
  g.addColorStop(0,loaded?'rgba(255,204,51,0.45)':'rgba(122,128,138,0.30)');
  g.addColorStop(1,'rgba(122,128,138,0)');
  ctx.strokeStyle=g; ctx.lineWidth=2; ctx.setLineDash([14,16]);
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.setLineDash([]);
}

/* ── THE TOOTH, AS A SPRITE ─────────────────────────────────────────────── */
/* The mask resolution follows the projected size but is quantised to steps of four cells,
   so the tooth grows in discrete generations as it approaches — which is how a sprite
   scales — and the pixMask cache stays at a couple of dozen entries instead of one per
   depth. The block itself never changes: PIXEL_K everywhere, like the wand. */
function toothCells(R){ return clamp(Math.round(R*2.24/PIXEL_K/4)*4, 8, 96); }
/* A quarter of pixRing, effectively: circle cells plotted only up to `frac` of the way
   round from twelve o'clock. The scan progress used to be a stroked arc with round caps —
   the one drawing in the bore that could not survive the grid. */
function pixArc(cx,cy,r,b,col,frac){
  const rb=Math.max(2,Math.round(r/b));
  const ox=Math.round(cx/b)*b, oy=Math.round(cy/b)*b;
  ctx.fillStyle=col;
  const steps=Math.ceil(6.2832*rb), seen=new Set();
  for(let i=0;i<=steps*clamp(frac,0,1);i++){
    const a=-Math.PI/2+(i/steps)*6.2832;
    const gx=Math.round(Math.cos(a)*rb), gy=Math.round(Math.sin(a)*rb);
    const k=gx+'/'+gy; if(seen.has(k)) continue; seen.add(k);
    ctx.fillRect(ox+gx*b,oy+gy*b,b,b);
  }
}
/* A crack is a run of single dark cells along a polyline given in the tooth's unit space.
   One cell wide, because at this block size a crack IS one pixel: drawn any wider it reads
   as a band, not a fracture. */
function crackCells(m,ox,topY,b,pts,col){
  ctx.fillStyle=col;
  const toCell=(ux,uy)=>[ (ux-m.x0)/(m.x1-m.x0)*m.w, (uy-m.y0)/(m.y1-m.y0)*m.h ];
  for(let s=0;s<pts.length-1;s++){
    const [ax,ay]=toCell(pts[s][0],pts[s][1]), [bx,by]=toCell(pts[s+1][0],pts[s+1][1]);
    const n=Math.max(1,Math.ceil(Math.max(Math.abs(bx-ax),Math.abs(by-ay))));
    for(let i=0;i<=n;i++){
      const gx=Math.round(ax+(bx-ax)*i/n), gy=Math.round(ay+(by-ay)*i/n);
      if(gx<0||gy<0||gx>=m.w||gy>=m.h||!m.g[gy*m.w+gx]) continue;
      ctx.fillRect(ox+gx*b,topY+gy*b,b,b);
    }
  }
}
/* Stain arrives in three discrete stages, not on a slider: each stage is a set of colours
   already in the file, so decay cannot mint in-between shades the palette never chose. */
const TOOTH_TONES=[
  ['#7E7566','#5C5548','#3B372F'],   // fresh crack
  ['#5C5548','#453F35','#2C2823'],   // stained
  ['#453F35','#2C2823','#1A1512'],   // nearly gone
];
const PREP_TONES=['#FBF6EA','#DCD3C0','#8E8676'];
const SOCK_TONES=['#E4D8C4','#C0B29A','#7E7360'];
/* Corner brackets as filled blocks, one block thick. */
function pixBrackets(px,py,q,k,b,col){
  ctx.fillStyle=col;
  const s=v=>Math.round(v/b)*b;
  q=s(q); k=Math.max(b*2,s(k));
  const L=[[px-q,py-q,k,b],[px-q,py-q,b,k],[px+q-k,py-q,k,b],[px+q-b,py-q,b,k],
           [px-q,py+q-b,k,b],[px-q,py+q-k,b,k],[px+q-k,py+q-b,k,b],[px+q-b,py+q-k,b,k]];
  for(const [x,y,w,h] of L) ctx.fillRect(s(x),s(y),w,h);
}
function drawTooth(o){
  const p=proj(o.x,PLANE_Y,o.z); if(p.s<0.05) return;
  const R=o.r*p.s, a=clamp(1-o.z/FAR_Z,0.05,1);
  ctx.globalAlpha=clamp(a*1.5,0,1);

  if(o.state==='crumbling'){
    /* The same three bands, but as slices of the sprite's own cell rows, slid by whole
       blocks and never rotated — turning a pixel sprite breaks the grid it lives on.
       The lower bands go first and fastest — it collapses, not bursts. */
    const c=clamp(o.cr,0,1), fade=1-Math.max(0,(c-0.62)/0.38);
    ctx.globalAlpha=clamp(a*1.5,0,1)*fade;
    const b=PIXEL_K, cells=toothCells(R);
    const TM=pixMask('tooth', toothPath, cells, -1.12, 1.12, -1.24, 1.14);
    const topY=Math.round((p.y-TM.h*b/2)/b)*b;
    const tones=TOOTH_TONES[1];
    for(let k=0;k<3;k++){
      const seed=(o.chip&&o.chip[k])||k*2.1;
      const dx=Math.round(Math.cos(seed)*R*0.34*c/b)*b;
      const dy=Math.round(R*(0.18+0.42*k)*c*c*1.9/b)*b;
      const y0=Math.floor(TM.h*k/3), y1=Math.floor(TM.h*(k+1)/3);
      drawMask(TM,p.x+dx,topY+dy,b,(gx,gy)=>{
        if(gy<y0||gy>=y1) return null;
        const t=gy/TM.h;
        return t<0.32?tones[0]:t<0.70?tones[1]:tones[2];
      });
    }
    // named where it happens, so the loss explains itself
    if(c<0.8){
      ctx.globalAlpha=clamp(1-c/0.8,0,1)*0.95;
      txt('IMPLANT CASE',p.x,p.y-R*1.8,
          {size:Math.max(12,Math.round(R*0.42)),weight:800,col:CFG.col.redHot,
           align:'center',ls:'3px',font:F_MONO});
    }
    ctx.globalAlpha=1;
    return;
  }
  if(o.state==='broken'&&implanting()){
    /* A socket, closing. Here decay is bone growing back over the site: the longer
       you leave it the less of an opening is left, and past the line it is gone.
       The closing is the cavity mask redrawn at fewer cells — on a grid an opening
       shrinks in whole-cell steps, not on a slider. */
    const dec=decayOf(o);
    const b=PIXEL_K, cells=toothCells(R);
    const SM=pixMask('socketW', socketPath, cells, -1.12, 1.12, -1.02, 1.04);
    const topY=Math.round((p.y-SM.h*b/2)/b)*b;
    maskOutline(SM,p.x,topY,b,'#0A0808');
    drawMask(SM,p.x,topY,b,(gx,gy)=>{
      const t=gy/SM.h;
      return t<0.30?SOCK_TONES[0]:t<0.62?SOCK_TONES[1]:SOCK_TONES[2];
    });
    const cavCells=Math.max(4,Math.round(cells*0.42*(1-dec*0.5)/2)*2);
    const CM=pixMask('cavityW', cavityPath, cavCells, -0.46, 0.46, -0.72, 0.68);
    drawMask(CM,p.x,topY+Math.round(SM.h*0.16)*b,b,()=>'#1A1512');
    const live=mode==='PLAY'&&o.z>(practising()?NEAR_CULL:scanNear())&&o.z<scanFar();
    if(live){
      const pl=0.5+0.5*Math.sin(o.pulse);
      ctx.save(); ctx.globalAlpha*=0.22+0.30*pl;
      pixBrackets(p.x,p.y,R*1.35,R*0.42,b,CFG.col.score);
      ctx.restore();
    }
    if(o.scan>0) pixArc(p.x,p.y,R*1.62,b,CFG.col.score,o.scan);
    ctx.globalAlpha=1;
    return;
  }
  if(o.state==='broken'){
    /* Dull and stained, and it keeps failing on the way in: more cracks, chips
       off the cusps, colour going out of it. Decay is three discrete stain stages and
       cell-by-cell damage, not a slider — a sprite gets worse in steps. */
    const dec=decayOf(o);
    // it sags in the final stretch, so the collapse is arriving, not sprung
    const slump=dec>0.86?(dec-0.86)/0.14:0;
    const b=PIXEL_K, cells=toothCells(R);
    const TM=pixMask('tooth', toothPath, cells, -1.12, 1.12, -1.24, 1.14);
    const cy=p.y+Math.round(slump*R*0.16/b)*b;
    const topY=Math.round((cy-TM.h*b/2)/b)*b;
    const ox=Math.round((p.x-TM.w*b/2)/b)*b;
    const tones=TOOTH_TONES[dec<0.33?0:dec<0.66?1:2];
    maskOutline(TM,p.x,topY,b,'#0A0808');
    drawMask(TM,p.x,topY,b,(gx,gy)=>{
      const t=gy/TM.h;
      return t<0.32?tones[0]:t<0.70?tones[1]:tones[2];
    });
    // the original fissure, then more in stages — single-cell runs, a crack is one pixel
    crackCells(TM,ox,topY,b,[[-0.12,-0.86],[0.06,-0.42],[-0.10,-0.10],[0.10,0.24]],'#0A0808');
    if(dec>0.30)
      crackCells(TM,ox,topY,b,[[0.62,-0.72],[0.30,-0.34],[0.44,0.06]],'#0A0808');
    if(dec>0.60){
      crackCells(TM,ox,topY,b,[[-0.66,-0.66],[-0.34,-0.22],[-0.50,0.16]],'#0A0808');
      crackCells(TM,ox,topY,b,[[-0.20,0.30],[0.14,0.36]],'#0A0808');
    }
    // chips broken out of the cusps: two-cell notches of dark, keyed to the same seeds
    const chips=Math.floor(dec*4);
    ctx.fillStyle='#100F0D';
    for(let i=0;i<chips;i++){
      const ca=o.chip[i];
      const gx=Math.round(((Math.cos(ca)*0.78+1.12)/2.24)*TM.w);
      const gy=Math.round(((-0.75+Math.abs(Math.sin(ca))*0.5+1.24)/2.38)*TM.h);
      ctx.fillRect(ox+clamp(gx,0,TM.w-2)*b,topY+clamp(gy,0,TM.h-2)*b,b*2,b*2);
    }
    // it sheds material as it goes
    if(dec>0.45&&Math.random()<dec*0.35){
      const a=rnd(0,6.283), v=rnd(40,150);
      parts.push({x:p.x+Math.cos(a)*R*0.7,y:p.y+Math.sin(a)*R*0.7,
                  vx:Math.cos(a)*v,vy:Math.sin(a)*v+60,life:rnd(0.2,0.5),max:0.5,
                  col:'#6E6656',sz:rnd(2,5)});
    }
    // in-range bracket, and the closing scan ring while the button is held
    const live=mode==='PLAY'&&o.z>(practising()?NEAR_CULL:scanNear())&&o.z<scanFar();
    if(live){
      const pl=0.5+0.5*Math.sin(o.pulse);
      ctx.save(); ctx.globalAlpha*=0.22+0.30*pl;
      pixBrackets(p.x,p.y,R*1.35,R*0.42,b,CFG.col.score);
      ctx.restore();
    }
    if(o.scan>0) pixArc(p.x,p.y,R*1.62,b,CFG.col.score,o.scan);
  }else if(o.state==='prepped'){
    /* Prepped and luminous: bone white is spent only here, so the target you
       must hit is the brightest thing in the chamber. The crown it needs shows
       as a dashed ghost — the proposed restoration, not a crown already there. */
    const col=o.crown.col;
    const b=PIXEL_K, cells=toothCells(R);
    glow(p.x,p.y,R*2.1,'#F2ECDF',0.30*Math.min(1,p.s));
    const TM=pixMask('tooth', toothPath, cells, -1.12, 1.12, -1.24, 1.14);
    const topY=Math.round((p.y-TM.h*b/2)/b)*b;
    const ox=Math.round((p.x-TM.w*b/2)/b)*b;
    maskOutline(TM,p.x,topY,b,'#0A0808');
    /* The margin drawn in the crown's colour: for a fixture the cavity mouth, for a crown a
       single row of cells across the tooth — where the restoration will sit. */
    const marginRow=Math.round(TM.h*0.44);
    drawMask(TM,p.x,topY,b,(gx,gy)=>{
      const t=gy/TM.h;
      if(!o.crown.fixture && gy===marginRow) return col;
      return t<0.30?PREP_TONES[0]:t<0.66?PREP_TONES[1]:PREP_TONES[2];
    });
    if(o.crown.fixture){
      const CM2=pixMask('cavityW', cavityPath, Math.max(4,Math.round(cells*0.42/2)*2),
                        -0.46, 0.46, -0.72, 0.68);
      maskOutline(CM2,p.x,topY+Math.round(TM.h*0.20)*b,b,col);
    }
    /* The ghost turns crimson and beats faster once the case is about to run out
       of runway, so a tooth is never quietly lost. Outline cells of the crown's own
       mask, every other pair skipped — a dashed contour in blocks. */
    const urgent=mode==='PLAY'&&o.z<SHIP_Z+300;
    const hov=Math.round(Math.sin(o.pulse*(urgent?2.4:0.8))*R*0.10/b)*b;
    const gcol=urgent?(Math.sin(T*18)>0?CFG.col.redHot:col):col;
    const PMG=pixMask(partKey(o.crown), g=>partPath(g,o.crown),
                      Math.max(6,Math.round(cells*0.9/2)*2), -1.14, 1.14, -1.12, 0.62);
    const gTop=Math.round((p.y-R*1.20+hov-PMG.h*b/2)/b)*b;
    const gox=Math.round((p.x-PMG.w*b/2)/b)*b;
    ctx.fillStyle=gcol;
    { const at=(x,y)=>(x<0||y<0||x>=PMG.w||y>=PMG.h)?0:PMG.g[y*PMG.w+x];
      let n=0;
      for(let gy=0;gy<PMG.h;gy++) for(let gx=0;gx<PMG.w;gx++){
        if(!at(gx,gy)) continue;
        if(at(gx-1,gy)&&at(gx+1,gy)&&at(gx,gy-1)&&at(gx,gy+1)) continue;
        if(((n++)%4)<2) ctx.fillRect(gox+gx*b,gTop+gy*b,b,b);
      }
    }
    if(p.s>0.55){
      ctx.globalAlpha=clamp((p.s-0.55)*1.4,0,0.95);
      txt(o.crown.shade,p.x,p.y-R*2.05,{size:Math.round(20*Math.min(1.6,p.s)),weight:700,
        col,align:'center',ls:'2px',font:F_MONO});
      ctx.globalAlpha=clamp(a*1.5,0,1);
    }
  }
  ctx.globalAlpha=1;
}
/* Moisture on the field, not space rubble. Saliva and blood are what actually ruin an
   optical scan, so the hazard is a droplet — and a teardrop silhouette says "avoid"
   by its shape, which matters because pale blue reads as friendly everywhere else in
   this game. */
function dropPath(c){
  c.beginPath();
  c.moveTo(0,-1.05);
  c.bezierCurveTo( 0.30,-0.42, 0.72,-0.10, 0.72, 0.30);
  c.bezierCurveTo( 0.72, 0.76, 0.36, 1.05, 0.00, 1.05);
  c.bezierCurveTo(-0.36, 1.05,-0.72, 0.76,-0.72, 0.30);
  c.bezierCurveTo(-0.72,-0.10,-0.30,-0.42, 0.00,-1.05);
  c.closePath();
}
/* The droplet, as cells. Three flat tones of the wet ramp instead of a diagonal gradient,
   and the specular is a two-cell accent — the single-block glint pixel art reserves for
   exactly this. The wobble that was a rotation is now a one-block sway: turning a sprite
   breaks its grid, swaying it does not. */
const DROP_TONES=['#BEEEFC','#7FD4F0','#2E6B84'];
function debrisCells(R){ return clamp(Math.round(R*1.44/PIXEL_K/2)*2, 6, 40); }
function drawDebris(o){
  const p=proj(o.x,PLANE_Y,o.z); if(p.s<0.05) return;
  const R=o.r*p.s, b=PIXEL_K;
  ctx.save(); ctx.globalAlpha=clamp((1-o.z/FAR_Z)*1.6,0,1);
  glow(p.x,p.y,R*1.9,CFG.col.wet,0.22);
  const DM=pixMask('drop', dropPath, debrisCells(R), -0.74, 0.74, -1.07, 1.07);
  const sway=Math.round(Math.sin(o.spin*0.5)*1)*b;
  const topY=Math.round((p.y-DM.h*b/2)/b)*b;
  const ox=Math.round((p.x+sway-DM.w*b/2)/b)*b;
  maskOutline(DM,p.x+sway,topY,b,'#E2F8FF');
  drawMask(DM,p.x+sway,topY,b,(gx,gy)=>{
    const u=(gx/DM.w)+(gy/DM.h)*0.6;           // light falls from the upper left
    return u<0.55?DROP_TONES[0]:u<1.05?DROP_TONES[1]:DROP_TONES[2];
  });
  // the specular that makes it read as a wet bead rather than a blue stone
  ctx.fillStyle='#FFF6E6';
  ctx.fillRect(ox+Math.round(DM.w*0.30)*b,topY+Math.round(DM.h*0.56)*b,b,b*2);
  ctx.restore();
}
/* The flying crown: the same mask the ghost above a prepped tooth uses, so what lands is
   what was promised. Spin became a one-block sway for the same reason as the droplet. */
const CROWN_SHADE_DK='#5A5A5A';
function crownCells(R){ return clamp(Math.round(R*2.28/PIXEL_K/2)*2, 6, 44); }
function drawCrownObj(o,gl){
  const p=proj(o.x,PLANE_Y,o.z); if(p.s<0.05) return;
  const R=o.r*p.s, b=PIXEL_K;
  glow(p.x,p.y,R*1.8,o.crown.col,gl);
  const PM=pixMask(partKey(o.crown), g=>partPath(g,o.crown),
                   crownCells(R), -1.14, 1.14, -1.12, 0.62);
  const sway=Math.round(Math.sin(o.spin)*1)*b;
  const topY=Math.round((p.y-PM.h*b/2)/b)*b;
  maskOutline(PM,p.x+sway,topY,b,'#FFF6E6');
  drawMask(PM,p.x+sway,topY,b,(gx,gy)=>{
    const t=gy/PM.h;
    /* A fixture is a screw, and the threads are what say so in flight: every third cell row
       of the lower body goes dark, which at this size reads as thread the way threadLines'
       strokes never could on a grid. */
    if(o.crown.fixture && t>0.30 && gy%3===0) return '#282C32';
    return t<0.26?'#FFF6E6':t<0.72?o.crown.col:CROWN_SHADE_DK;
  });
}

/* A socket in the arch: an open bore in bone. Once a fixture is in it the platform
   shows, and the crown finishes it. The rank behind the working one is dimmed, so
   which rank is live is never in question. */
function drawSocket(o){
  const p=proj(o.x,PLANE_Y,o.z); if(p.s<0.05) return;
  const R=o.r*p.s, act=o.row===activeRow();
  ctx.save();
  ctx.globalAlpha=clamp((1-o.z/FAR_Z)*1.7,0,1)*(act?1:0.42);
  /* Light coming off the socket rather than a ring drawn round it. Underneath the body, so it
     reads as the thing glowing instead of as a marker sitting on top of it, and coloured by
     what the socket still wants — so "which rank" and "which part" are one signal. Shallow on
     purpose: ten of these breathing in step should register at the edge of the eye, not
     compete with the parts in flight. */
  if(act){
    const need=o.need==='implant'?CFG.surgery.implant:CFG.surgery.crown;
    /* One clock for the whole rank, not each socket's own phase. Ten lights breathing out of
       step read as ten separate things blinking; in step they read as one row saying "here".
       o.pulse is seeded at random and is not advanced for sockets anyway. */
    const pl=0.5+0.5*Math.sin(T*3.0);
    glow(p.x,p.y,R*2.3,need.col,(0.10+0.13*pl)*ctx.globalAlpha);
  }
  /* Cells, like everything else in the bore. The socket, its cavity and the seated fixture
     are three masks on the one block, so a rank of ten reads as ten of the same object
     rather than ten smooth shapes at ten sizes. */
  const b=PIXEL_K, cells=toothCells(R);
  const SM=pixMask('socketW', socketPath, cells, -1.12, 1.12, -1.02, 1.04);
  const topY=Math.round((p.y-SM.h*b/2)/b)*b;
  maskOutline(SM,p.x,topY,b,'#0A0808');
  drawMask(SM,p.x,topY,b,(gx,gy)=>{
    const t=gy/SM.h;
    return t<0.30?SOCK_TONES[0]:t<0.62?SOCK_TONES[1]:SOCK_TONES[2];
  });
  const CM=pixMask('cavityW', cavityPath, Math.max(4,Math.round(cells*0.42/2)*2),
                   -0.46, 0.46, -0.72, 0.68);
  drawMask(CM,p.x,topY+Math.round(SM.h*0.16)*b,b,()=>'#17120F');
  if(o.need==='crown'){                       // the fixture is seated
    const IM=pixMask('fix-'+CFG.surgery.implant.id, g=>partPath(g,CFG.surgery.implant),
                     Math.max(4,Math.round(cells*0.44/2)*2), -1.14, 1.14, -1.12, 0.62);
    const iTop=topY+Math.round(SM.h*0.30)*b;
    drawMask(IM,p.x,iTop,b,(gx,gy)=>
      (gy/IM.h>0.30 && gy%3===0) ? '#282C32' : CFG.surgery.implant.col);
  }
  /* No ring around the socket. Ten of them pulsing at once read as ten targets to deal with
     rather than as a row that is ready, and the thing they were marking is already said twice
     over: the near rank is drawn at full strength while the far one sits at 0.42, and a socket
     that still wants its fixture is visibly empty. */
  ctx.restore();
}

/* The pickup is the Glidewell mark itself — the G tile cropped off the logo.
   It shares crimson with the debris, so the "collect me" signal is carried by
   form and light instead: a clean square tile, a white halo, and a rotating
   bracket. Debris stays a dark unlit shard. */
function drawPod(o){
  const p=proj(o.x,PLANE_Y,o.z); if(p.s<0.05) return;
  const R=o.r*p.s;
  ctx.save(); ctx.globalAlpha=clamp((1-o.z/FAR_Z)*1.6,0,1);
  // halo marks it as a pickup
  glow(p.x,p.y,R*2.0,'#FFF6E6',0.32);
  // the mark, breathing slightly so it never reads as scenery
  const puff=1+Math.sin(o.spin*1.6)*0.05;
  gwLogo(p.x,p.y,R*0.80*puff);
  // rotating collection bracket
  ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=Math.max(1.5,R*0.07);
  ctx.lineCap='round';
  const q=R*1.32, k=R*0.40;
  ctx.translate(p.x,p.y); ctx.rotate(o.spin*0.6);
  ctx.beginPath();
  ctx.moveTo(-q,-q+k); ctx.lineTo(-q,-q); ctx.lineTo(-q+k,-q);
  ctx.moveTo( q-k,-q); ctx.lineTo( q,-q); ctx.lineTo( q,-q+k);
  ctx.moveTo( q, q-k); ctx.lineTo( q, q); ctx.lineTo( q-k, q);
  ctx.moveTo(-q+k, q); ctx.lineTo(-q, q); ctx.lineTo(-q, q-k);
  ctx.stroke();
  ctx.restore();

  /* What it does, said over the top of it while it is still coming. This replaces the
     lesson beat that froze the game to explain the mark: a pickup that has to be
     described in a panel is a pickup that is not reading, and the label costs nothing to
     anyone who has already worked it out. Held to the near half of the bore, where the
     type is large enough to be worth reading, and blinking so it separates from the
     mark's own halo. */
  /* Once. It is a label, not a name — after the first mark has been flown into, the player
     knows what the G does, and repeating it on every pickup turns a piece of teaching into
     screen furniture. Set on the first one seen, kept for the rest of the credit. */
  if(mode==='PLAY'&&!G.podLabelled&&o.z<FAR_Z*0.62&&Math.sin(T*5.5)>-0.35){
    const a=clamp((1-o.z/(FAR_Z*0.62))*1.5,0,1);
    ctx.save(); ctx.globalAlpha=a;
    txt('SCANNER  UPGRADE',p.x,p.y-R*1.9,
        {size:22,weight:800,col:CFG.col.score,align:'center',ls:'4px',font:F_MONO});
    ctx.restore();
  }
}

/* The instrument itself, lifted out of drawShip so the lesson and the shift draw the same
   object rather than two drawings of it. WW is its width in blocks; everything else follows
   from that, so the same code makes a 40-block wand in the bore and a 60-block one on a plate
   and both land square on the grid. */
function drawWandSprite(px,py,WW,{bank=0,scanning=false,milling=false,slowing=false}={}){
  const b=PIXEL_K;
  const WH=Math.round(WW*1.625);
  const rw=(f)=>Math.round(f*WH);          // feature rows, as fractions of the height
  const OPT=[rw(0.075),rw(0.17)], COL=[rw(0.19),rw(0.29)],
        HAT=[rw(0.42),rw(0.55)], BTN=[rw(0.65),rw(0.75)];
  const fx=WW*0.155;                       // feature half-width, in blocks
  /* The profile is a FRACTION of the half-width, not a block count — it used to be
     written for a 16-block grid, so raising the block count to keep one pixel size
     turned the wand into a sliver. */
  const half=gy=>{
    const t=gy/(WH-1), hwMax=WW/2;
    let f;
    if(t<0.10)      f=0.375+(t/0.10)*0.250;
    else if(t<0.55) f=0.625+((t-0.10)/0.45)*0.187;
    else if(t<0.90) f=0.812+((t-0.55)/0.35)*0.125;
    else            f=0.937-((t-0.90)/0.10)*0.500;
    return f*hwMax;
  };
  /* The origin snaps to the grid, and a cell is exactly b×b. It used to be ceil(b)+1 from a
     fractional origin — a pixel of overlap smearing the seams shut — which put the single most
     looked-at object in the game on 4px blocks in a 3px world. With the origin a multiple of b
     and gx*b always a multiple of b, every cell lands flush and there are no seams to smear:
     the +1 was curing a symptom of the unsnapped origin. The wand now moves in whole blocks,
     which is what a sprite on a grid does. */
  const ox=Math.round((px-WW*b/2+bank*b)/b)*b, oy=Math.round((py-WH*b*0.52)/b)*b;
  const cell=(gx,gy,col)=>{
    ctx.fillStyle=col;
    ctx.fillRect(ox+gx*b,oy+gy*b,b,b);
  };

  const bc = scanning?CFG.col.score : slowing?CFG.col.blueLt : CFG.col.blue;

  /* Four tones and a hard outline, the way the reference sheet does it. The first pass
     builds the silhouette, the second lays a dark keyline in every empty cell that
     touches it, and only then is the body filled — without that keyline a sprite has
     nothing to hold it off the background and reads as a blocky gradient. */
  const inside=[];
  for(let gy=-1;gy<=WH;gy++){
    inside[gy+1]=[];
    for(let gx=-1;gx<=WW;gx++){
      const cx=gx-(WW-1)/2;
      inside[gy+1][gx+1]=(gy>=0&&gy<WH&&gx>=0&&gx<WW&&Math.abs(cx)<=half(gy));
    }
  }
  const isIn=(gx,gy)=>!!(inside[gy+1]&&inside[gy+1][gx+1]);
  for(let gy=-1;gy<=WH;gy++)
    for(let gx=-1;gx<=WW;gx++)
      if(!isIn(gx,gy) &&
         (isIn(gx-1,gy)||isIn(gx+1,gy)||isIn(gx,gy-1)||isIn(gx,gy+1)))
        cell(gx,gy,'#0A0C10');

  for(let gy=0;gy<WH;gy++){
    const hw=half(gy);
    for(let gx=0;gx<WW;gx++){
      if(!isIn(gx,gy)) continue;
      const cx=gx-(WW-1)/2;
      let col;
      const e=Math.max(1,WW*0.055);
      if(cx<-hw+e)        col='#FFF6E6';
      else if(cx<-hw+e*2.4) col='#E7ECF2';
      else if(cx> hw-e*1.4) col='#7C858F';
      else                  col='#B9C2CC';
      const edge=Math.max(1,WW*0.06);
      if(gy>=COL[0]&&gy<=COL[1])
        col = (gy>=COL[1]-1) ? '#5F666F' : (cx<-hw+edge*1.4?'#EDF0F3':'#98A0AA');
      if(gy>=OPT[0]&&gy<=OPT[1]&&Math.abs(cx)<=fx)
        col = (gy<=OPT[0]+1&&cx<0)?'#7FD4F0':'#14171C';
      if(gy>=HAT[0]&&gy<=HAT[1]&&Math.abs(cx)<=fx)
        col = milling
          ? ((gy>=HAT[0]+2&&gy<=HAT[0]+3&&Math.abs(cx)<=fx*0.6) ? CFG.col.score : '#0E1014')
          : '#1E2228';
      if(gy>=BTN[0]&&gy<=BTN[1]&&Math.abs(cx)<=fx)
        col = (gy<=BTN[0]+1&&cx<=-0.5) ? '#FFF6E6' : bc;
      cell(gx,gy,col);
    }
  }
}
function drawShip(){
  const gx = mode==='PLAY'?G.x:Math.sin(T*0.7)*140;
  const gy = PLANE_Y + (mode==='PLAY'?G.bob:Math.sin(T*1.9)*6);
  const p=proj(gx,gy,SHIP_Z), R=28*p.s;
  const roll = mode==='PLAY'?G.roll:Math.sin(T*0.7+1.57)*0.2;
  const slowing = mode==='PLAY'&&G.slowing;

  /* No exhaust plume. A tapered cone under a standing white capsule reads as a
     desk stand, which kills the sense of flight — and a scanner has no engine
     anyway. Thrust shows as a halo around the instrument instead. */
  if(slowing){
    ctx.save();
    glow(p.x,p.y,R*2.2,CFG.col.blue,0.38);
    // retro thrusters firing forward: the brake has to be visible, not just felt
    ctx.strokeStyle='rgba(67,169,232,0.8)'; ctx.lineWidth=Math.max(2,R*0.07);
    for(const sx of [-0.55,0.55]){
      ctx.beginPath();
      ctx.moveTo(p.x+sx*R,p.y-R*0.5);
      ctx.lineTo(p.x+sx*R*1.25,p.y-R*(1.5+0.35*Math.sin(T*30)));
      ctx.stroke();
    }
    ctx.restore();
  }
  /* The scan, as a scan. It used to be two amber lines converging from the wand to a point on
     the tooth, which is the language of a targeting laser — something being shot at. An
     intraoral scanner does the opposite: it throws a field over the whole tooth and reads it
     line by line. So the beam leaves the optics narrow and OPENS to exactly the tooth's width,
     it is pale blue and translucent rather than hot and solid, and a bright rule sweeps down
     the face of the tooth. The sweep runs faster as the lock closes, so the beam reports
     progress without a number.

     Banded in blocks of the shared grid rather than filled as a smooth quad, so a light beam
     is made of the same pixels as everything else on screen. */
  if(mode==='PLAY'&&G.target){
    const o=G.target, q=proj(o.x,PLANE_Y,o.z);
    /* A little wider than the tooth, so the field visibly encloses it rather than just
       reaching it — that is what says "scanned" instead of "aimed at". */
    const tw=Math.max(12,o.r*q.s*1.25);
    const w0=Math.max(PIXEL_K*2,R*0.07);        // a narrow aperture, so the opening reads
    /* Starting at the optics slot rather than above the nose: at scan range the tooth is near
       the vanishing point and there are only about 140px between them, so a beam that began
       clear of the sprite had almost nothing left to be seen in. */
    const y0=p.y-R*1.25, y1=q.y;
    const k=PIXEL_K*2, span=Math.abs(y1-y0);
    const steps=Math.max(3,Math.ceil(span/k));
    ctx.save();
    for(let i=0;i<steps;i++){
      const t=i/steps, tn=(i+1)/steps;
      const yA=lerp(y0,y1,t), yB=lerp(y0,y1,tn);
      const w=lerp(w0,tw,t), cx=lerp(p.x,q.x,t);
      // brighter at the tooth than at the wand: the field is what does the work
      ctx.fillStyle='rgba(127,212,240,'+(0.07+0.15*t).toFixed(3)+')';
      ctx.fillRect(Math.round(cx-w),Math.round(Math.min(yA,yB)),
                   Math.max(k,Math.round(w*2)),Math.ceil(Math.abs(yB-yA))+1);
      // a brighter core, so the field has a spine and not just an even wash
      ctx.fillStyle='rgba(190,236,252,'+(0.07+0.10*t).toFixed(3)+')';
      ctx.fillRect(Math.round(cx-w*0.34),Math.round(Math.min(yA,yB)),
                   Math.max(PIXEL_K,Math.round(w*0.68)),Math.ceil(Math.abs(yB-yA))+1);
    }
    // the two edges, so the field has a shape and not just a haze
    ctx.strokeStyle='rgba(176,234,252,0.85)'; ctx.lineWidth=PIXEL_K;
    ctx.beginPath();
    ctx.moveTo(p.x-w0,y0); ctx.lineTo(q.x-tw,y1);
    ctx.moveTo(p.x+w0,y0); ctx.lineTo(q.x+tw,y1);
    ctx.stroke();
    /* The read itself, on the tooth's own face. It was three bars strobing over a bounding
       box — decoration, and it told you nothing. Now the line's position IS the lock: it starts
       at the crown of the tooth, walks down as the scan closes, and everything above it is
       redrawn in data blue. So the tooth visibly turns into a scan while you hold the button,
       and the beam stops being an effect and becomes the progress bar.

       Clipped by the tooth's own silhouette rather than by a rectangle, so the blue stops
       exactly where the tooth does and never bleeds onto the bore behind it. Everything is
       stepped off PIXEL_K expressed in the tooth's own space, so the rules land on the shared
       grid at any distance. */
    const tr=o.r*q.s;                                  // the tooth's own radius on screen
    const TOP=-1.22, BOT=1.10;
    const ly=TOP+clamp(o.scan,0,1)*(BOT-TOP);
    withT(ctx,q.x,q.y,tr,0,()=>{
      const px=PIXEL_K/tr;                             // one screen block, in tooth space
      // what has been read
      ctx.save();
      ctx.beginPath(); ctx.rect(-1.3,TOP,2.6,Math.max(0,ly-TOP)); ctx.clip();
      /* Light wash, strong rules. A flat 0.44 fill turned a fully-read tooth into a solid
         blue blob — the form went and with it the sense that a thing is being measured. The
         texture of the sampling lines is what should carry it. */
      toothPath(ctx); ctx.fillStyle='rgba(127,212,240,0.26)'; ctx.fill();
      ctx.fillStyle='rgba(200,240,252,0.46)';
      for(let yy=TOP;yy<ly;yy+=px*3) ctx.fillRect(-1.3,yy,2.6,px);
      ctx.restore();
      // the leading line, lying on the face and following its edge
      ctx.save();
      ctx.beginPath(); ctx.rect(-1.3,ly-px,2.6,px*2); ctx.clip();
      toothPath(ctx); ctx.fillStyle='rgba(236,252,255,0.96)'; ctx.fill();
      ctx.restore();
    });
    glow(q.x,q.y+ly*tr,tr*1.05,'#7FD4F0',0.18);
    glow(p.x,y0,w0*4,'#7FD4F0',0.40);          // the aperture, lit
    ctx.restore();
  }

  /* The instrument, drawn as a sprite on a block grid rather than as beziers with
     gradients. This is the first asset converted by hand: downsampling the whole
     frame unified the styles but dirtied everything, so the game stays crisp and the
     art is pixellated one piece at a time.

     The silhouette comes from a width profile per row, so the shape is authored but
     still lands square on the grid, and the block size follows the projection — the
     wand pixellates consistently at any distance. It deliberately does not rotate:
     rotating a pixel sprite destroys the grid, so banking is a one-block shift. */
  /* One block for the whole screen. The wand sits at a fixed depth so its size never
     changes — the fix is therefore to raise the block COUNT until each block is the
     same PIXEL_K as the type and the rings, not to scale the blocks. */
  const WW=Math.max(8,Math.round(R*1.62/PIXEL_K));
  drawWandSprite(p.x,p.y,WW,{bank:Math.round(clamp(roll*3.2,-1,1)),
                             scanning:mode==='PLAY'&&!!G.target,
                             milling:mode==='PLAY'&&!!G.mill[0], slowing});
  if(mode==='PLAY') drawOnBoardMill(p.x,p.y,R);
}

/* The blank is pushed out of the hatch and cut in the open, above the nose, so the
   crown you fire is visibly the crown you just watched being made. A cut line
   descends through it: finished crown above, raw puck below, cutter riding the
   line and throwing chalk. Runs on its own clock while the scanner works ahead. */
/* A straight run of cells between two points — the pixel line the mill's arm needed.
   Plotted at the block, ends snapped, so a diagonal is a stair of whole blocks. */
function pixLine(x1,y1,x2,y2,b,col){
  const sx=Math.round(x1/b), sy=Math.round(y1/b), ex=Math.round(x2/b), ey=Math.round(y2/b);
  const n=Math.max(Math.abs(ex-sx),Math.abs(ey-sy),1);
  ctx.fillStyle=col;
  for(let i=0;i<=n;i++)
    ctx.fillRect(Math.round(sx+(ex-sx)*i/n)*b,Math.round(sy+(ey-sy)*i/n)*b,b,b);
}
function drawOnBoardMill(px,py,R){
  /* Either the job being cut, or — once the mill falls idle — the crown already aboard and
     waiting to be fired. It used to vanish on the frame the cut finished, because the entry
     was spliced out of G.mill the moment it completed: the crown you had just made was
     visible for one frame and then the instrument looked empty while you were carrying it.
     Nothing new is stored — what is parked IS the next round in the magazine, so the picture
     cannot disagree with what the button will fire. */
  const job=G.mill[0];
  const crown=job?job.crown:G.mag[0];
  if(!crown) return;
  const prog=job?job.prog:1;
  const b=PIXEL_K;
  // the arm still swings out for a fresh job; a crown already parked is simply out there
  const eject=job?clamp(prog/0.14,0,1):1;
  const s=R*0.52;
  /* Out of the hatch and away to the flank, not up over the nose: parked on the
     centreline it capped the instrument and sat right where the teeth come in. */
  const cx=px+R*1.32*eject;
  const cy=py-R*0.16-R*1.05*eject;

  /* The part's own mask sets every other dimension: the blank is the mask plus two cells
     of stock on each side — which is what a blank is — so a crown and the taller, narrower
     fixture both work with no separate numbers. */
  const cells=Math.max(8,Math.round(s*2.28/b/2)*2);
  const PM=pixMask(partKey(crown), g=>partPath(g,crown), cells, -1.14,1.14,-1.12,0.62);
  const bw=PM.w+4, bh=PM.h+4;
  const ox=Math.round((cx-bw*b/2)/b)*b, topY=Math.round((cy-bh*b/2)/b)*b;

  // arm carrying the work out of the hatch, and the jaws hugging the blank
  pixLine(px+R*0.10,py-R*0.02, ox+bw*b*0.35, topY+bh*b, b, '#B0B8C2');
  pixLine(ox-b,      topY+bh*b*0.60, ox+b*2,      topY+bh*b*0.96, b, '#C8D0DA');
  pixLine(ox+bw*b+b, topY+bh*b*0.60, ox+bw*b-b*2, topY+bh*b*0.96, b, '#C8D0DA');

  /* The cut is a row index. Above it the finished part shows; below it raw stock still
     stands. One number, both halves — they cannot disagree. */
  const cutRow=Math.round(bh*clamp(prog,0,1));
  for(let gy=cutRow;gy<bh;gy++)
    for(let gx=0;gx<bw;gx++){
      if((gy===cutRow&&cutRow>0?false:gy===0||gy===bh-1)&&(gx===0||gx===bw-1)) continue;
      const t=gx/bw;
      ctx.fillStyle= t<0.24?'#8B887F' : t<0.58?'#EAE6DC' : '#949087';
      ctx.fillRect(ox+gx*b,topY+gy*b,b,b);
    }
  const crTop=Math.round((cy-PM.h*b/2)/b)*b;
  const crownCut=Math.round((topY+cutRow*b-crTop)/b);
  drawMask(PM,cx,crTop,b,(gx,gy)=>{
    if(gy>=crownCut) return null;
    if(crown.fixture && gy/PM.h>0.30 && gy%3===0) return '#282C32';
    const t=gy/PM.h;
    return t<0.26?'#FFF6E6':t<0.72?crown.col:'#6A6A6A';
  });

  /* The cutter is a plus of cells riding the cut line. It does not rotate — the traverse
     and the sparks carry the spinning; turning the sprite would just break its grid. */
  if(prog<1&&eject>=1){
    const bx=Math.round((cx+(bw*b/2)*0.92*Math.sin(T*8.5))/b)*b;
    const cutY=topY+cutRow*b;
    ctx.fillStyle='#DCE2EA';
    ctx.fillRect(bx-b*2,cutY,b*5,b);
    ctx.fillRect(bx,cutY-b*2,b,b*5);
    if(Math.random()<0.65){
      const a=rnd(-2.5,-0.65), v=rnd(140,420);
      parts.push({x:bx,y:cutY,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
                  life:rnd(0.18,0.42),max:0.42,col:'#FFF6E6',sz:rnd(1.5,3.6)});
    }
  }

  // progress collar + the shade being cut
  pixArc(cx,cy,s*1.52,b,crown.col,clamp(prog,0,1));
  if(eject>=1)
    txt(crown.label.toUpperCase()+' '+crown.shade,cx,cy+s*2.15,
        {size:Math.max(11,Math.round(R*0.19)),weight:800,col:crown.col,
         align:'center',ls:'1px',font:F_MONO});
}

function drawWorld(){
  drawBackground();                    // the room stays put; only the bore is magnified
  const zoomed=camPush();
  drawBore();
  if(mode==='PLAY'){ if(!implanting()&&!practising()) drawNoReturn(); drawAimLine(); }
  const list=objs.filter(o=>o&&!o.dead).sort((a,b)=>b.z-a.z);
  for(const o of list){
    if(o.kind==='tooth') drawTooth(o);
    else if(o.kind==='debris') drawDebris(o);
    else if(o.kind==='socket') drawSocket(o);
    else if(o.kind==='pod') drawPod(o);
    else if(o.kind==='shot') drawCrownObj(o,0.40);
  }
  // On the overlay screens the wand would sit right under PRESS START and the
  // score table, so the chamber carries the backdrop alone.
  if(mode==='PLAY') drawShip();
  drawBursts();
  for(const p of parts){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.col; ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
  }
  ctx.globalAlpha=1;
  camPop(zoomed);
  /* Score pops are type, not world: read at 34px they have to stay put and stay
     the size they were designed at, so they are drawn after the zoom is lifted. */
  for(const q of pops){
    const t=q.t/1.1;
    ctx.globalAlpha=clamp(1-t,0,1);
    const pp=proj(q.x,PLANE_Y,SHIP_Z), sp=camPt(pp.x,pp.y);
    txt(q.txt,clamp(sp.x,560,VW-150),sp.y-140-t*90,
        {size:34,weight:800,col:q.col,align:'center',ls:'3px',font:F_MONO});
  }
  ctx.globalAlpha=1;
}

/* ── RENDER: TYPE + CHROME ──────────────────────────────────────────────── */
/* Two voices: a grotesque for display, and a machine readout for every label
   and number. The mill's control panel is where the utility voice comes from. */
const F_DISP='system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif';
const F_MONO='ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace';

/* Canvas shadowBlur was on every tooth, crown, pod, ring and the wand — it is
   the most expensive operation in this renderer and it alone dropped the frame
   rate into single digits. Glows are cached radial sprites now: one allocation
   per colour, then a plain drawImage. */
const glowCache=new Map();
function glowSprite(col){
  let c=glowCache.get(col); if(c) return c;
  const S=128, m=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(col);
  const rgb = m ? [parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)] : [255,255,255];
  c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d');
  const rg=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  rg.addColorStop(0,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},1)`);
  rg.addColorStop(0.35,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.55)`);
  rg.addColorStop(1,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
  g.fillStyle=rg; g.fillRect(0,0,S,S);
  glowCache.set(col,c); return c;
}
function glow(x,y,r,col,a){
  ctx.save(); ctx.globalAlpha=a; ctx.globalCompositeOperation='lighter';
  ctx.drawImage(glowSprite(col),x-r,y-r,r*2,r*2);
  ctx.restore();
}
/* Gradients whose coordinates never change are built once. Canvas transforms a
   gradient by the CTM at paint time, so the unit-space ones are reusable even
   though every object draws them under a different scale. */
const GRAD={};
function grad(key,make){ return GRAD[key]||(GRAD[key]=make()); }


/* ── A BITMAP FACE ──────────────────────────────────────────────────────── */
/* Drawn here rather than loaded: the cabinet is offline and the published page
   blocks external hosts, so a webfont was never an option — and a hand-built 5x7
   face lands exactly on the grid the sprites use, which a hinted outline font never
   would. Digits are four columns wide so long numbers stay compact; letters are five.
   Every glyph is seven rows of '#' and '.'. */
const GLYPH_H=7;
const FONT5x7=(()=>{
  const raw={
  'A':'.###.|#...#|#...#|#####|#...#|#...#|#...#',
  'B':'####.|#...#|####.|#...#|#...#|#...#|####.',
  'C':'.###.|#...#|#....|#....|#....|#...#|.###.',
  'D':'####.|#...#|#...#|#...#|#...#|#...#|####.',
  'E':'#####|#....|####.|#....|#....|#....|#####',
  'F':'#####|#....|####.|#....|#....|#....|#....',
  'G':'.###.|#...#|#....|#..##|#...#|#...#|.###.',
  'H':'#...#|#...#|#####|#...#|#...#|#...#|#...#',
  'I':'.###.|..#..|..#..|..#..|..#..|..#..|.###.',
  'J':'..###|...#.|...#.|...#.|...#.|#..#.|.##..',
  'K':'#...#|#..#.|#.#..|##...|#.#..|#..#.|#...#',
  'L':'#....|#....|#....|#....|#....|#....|#####',
  'M':'#...#|##.##|#.#.#|#...#|#...#|#...#|#...#',
  'N':'#...#|##..#|#.#.#|#..##|#...#|#...#|#...#',
  'O':'.###.|#...#|#...#|#...#|#...#|#...#|.###.',
  'P':'####.|#...#|#...#|####.|#....|#....|#....',
  'Q':'.###.|#...#|#...#|#...#|#.#.#|#..#.|.##.#',
  'R':'####.|#...#|#...#|####.|#.#..|#..#.|#...#',

function scale2x(g){

     quantisation lives in pixWidth, or centred text would measure one width and draw

     block grid cannot express. The whole ring sits half a block up-left of where it did,

/* The button map lives on screen permanently. On a show floor nobody reads an
   attract screen twice, and a player who has to ask what to press has lost. */
/* Every tooth lost past the line lands here as an open socket, left to right along
   the foot of the screen. The tally used to live as seven-pixel glyphs in the slip
   header, where nobody noticed a case being lost — this is the same information at
   a size that registers, and the newest slot flashes as it lands. */
function drawImplantQueue(){
  /* Centred under the bore, with the two figures flanking it — it used to sit in the
     bottom-left corner where it read as a stray row of marks. */
  /* Bigger than it was. At r=15 the rim was five blocks of radius and the bore two,
     which is not enough grid to draw a socket on — ten of them read as a row of fuzzy
     dots. There is width to spare down here, so the icon gets a radius it can be
     drawn at. */
  const n=CFG.implantsToAdvance, step=66, r=23, y=VH-88;
  const q=Math.min(G.implantQ,n);      // the bench can lose one more while closing
  const groupW=n*step+120, x0=Math.round(PX-groupW/2);
  const pop=G.queuePop;
  /* Plotted, not stroked. These were dashed arcs with a radial gradient inside, which
     is the one thing that cannot survive the tube — the outline came out as grey fuzz
     and the whole row read as dirt. And the label was too dim for type this small, so
     it carries proper contrast now. */
  /* Naming the consequence, not just the count. The row said "IMPLANT QUEUE 8 / 10" and
     nothing on screen explained that the tenth one ends the shift and sends you to surgery,
     so the hand-over arrived as a surprise however smoothly it was staged. */
  txt('IMPLANT QUEUE',x0+n*step/2,VH-132,
      {size:17,weight:800,ls:'5px',font:F_MONO,align:'center',
       col:pop>0?CFG.col.redHot:'rgba(214,206,192,0.92)'});
  txt(G.closing>0?'BENCH CLOSING':'AT '+n,x0+n*step+16,VH-108,
      {size:14,weight:700,ls:'2px',font:F_MONO,
       col:q>=n-2?CFG.col.score:'rgba(138,131,119,0.75)'});
  txt(q+' / '+n,x0+n*step+16,VH-78,
      {size:24,weight:800,ls:'2px',font:F_MONO,
       col:q?CFG.col.redHot:'rgba(190,182,168,0.85)'});
  for(let i=0;i<n;i++){
    const cx=x0+r+i*step, filled=i<q, newest=filled&&i===q-1;
    if(filled){
      if(newest&&pop>0) glow(cx,y,r*2.4,'#FF4A72',pop*0.5);
      pixDisc(cx,y,r,PIXEL_K,'#0A0C10');                       // keyline
      pixDisc(cx,y,r-PIXEL_K,PIXEL_K,'#D8CCB6');               // bone plate
      pixDisc(cx-r*0.28,y-r*0.28,r*0.28,PIXEL_K,'#F2E9D8');    // one specular
      pixDisc(cx,y,r*0.46,PIXEL_K,'#140F0C');                  // the socket itself
      if(newest&&pop>0) pixRing(cx,y,r+PIXEL_K,PIXEL_K,CFG.col.redHot,0,0,0);
    } else {
      /* An unlit socket, drawn as the same two circles the filled one has — the plate
         rim and the bore inside it. A single circle on black said nothing about what
         it was counting; rim-inside-rim reads as a bore seen from above, and empty
         against filled becomes a difference in brightness alone. */
      pixRing(cx,y,r,PIXEL_K,'rgba(126,122,116,0.85)',0,0,0);           // plate rim
      pixRing(cx,y,r*0.46,PIXEL_K,'rgba(104,100,95,0.70)',0,0,0);       // the bore
    }
  }
}

/* The legend is drawn as the panel it refers to: a ball-top stick and lettered arcade
   buttons. Two lines of small grey type per control was something nobody reads at a
   glance — the sign has to be at least as big as the word. */
function icoJoystick(cx,cy,r){
  ctx.save();
  ctx.fillStyle='#23262B';
  ctx.beginPath(); ctx.ellipse(cx,cy+r*0.86,r*0.86,r*0.28,0,0,6.2832); ctx.fill();
  ctx.strokeStyle='#4C525B'; ctx.lineWidth=r*0.24; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx,cy+r*0.78); ctx.lineTo(cx,cy-r*0.18); ctx.stroke();
  pixDisc(cx,cy-r*0.42,r*0.56,PIXEL_K,'#0A0C10');
  pixDisc(cx,cy-r*0.42,r*0.44,PIXEL_K,CFG.col.red);
  pixDisc(cx-r*0.16,cy-r*0.58,r*0.14,PIXEL_K,'#FF9AAC');
  ctx.fillStyle='rgba(242,236,223,0.8)';
  [-1,1].forEach(d=>{
    const x=cx+d*r*1.22;
    ctx.beginPath();
    ctx.moveTo(x+d*r*0.30,cy); ctx.lineTo(x-d*r*0.10,cy-r*0.26); ctx.lineTo(x-d*r*0.10,cy+r*0.26);
    ctx.closePath(); ctx.fill();
  });
  ctx.restore();
}
/* Which ink actually reads on a given cap. White on amber was unreadable — it looked
   like dirt on the circle — so the glyph colour follows the cap's relative luminance
   rather than being fixed. */
function inkOn(col){
  const m=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(col);
  if(!m) return '#101014';
  const lin=[1,2,3].map(i=>{
    const v=parseInt(m[i],16)/255;
    return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);
  });
  const L=0.2126*lin[0]+0.7152*lin[1]+0.0722*lin[2];
  return L>0.40 ? '#101014' : '#FFF6E6';
}
/* A filled disc on the same grid as everything else. Left as a smooth arc it was a
   vector circle wrapped around a pixel letter, which is what made the icons dirty
   however clean the glyph was. */
function pixDisc(cx,cy,r,b,col){
  b=Math.max(2,Math.round(b));
  // same lattice discipline as pixRing: snapped centre, exact cells, no half-block offset
  const rb=Math.max(1,Math.round(r/b)), ox=Math.round(cx/b)*b, oy=Math.round(cy/b)*b;
  ctx.fillStyle=col;
  for(let gy=-rb;gy<=rb;gy++){
    const half=Math.round(Math.sqrt(Math.max(0,rb*rb-gy*gy)));
    for(let gx=-half;gx<=half;gx++)
      ctx.fillRect(ox+gx*b,oy+gy*b,b,b);
  }
}
function icoButton(cx,cy,r,label,col){
  const b=PIXEL_K;
  pixDisc(cx,cy,r,b,'#0A0C10');
  pixDisc(cx,cy,r-b*1.2,b,col);
  pixDisc(cx-r*0.30,cy-r*0.32,r*0.22,b,'rgba(255,255,255,0.45)');
  txt(label,cx,cy+r*0.36,
      {size:Math.round(r*1.0),weight:800,col:inkOn(col),align:'center',font:F_MONO});
}
/* One entry, returning the width it used so a row can be packed without guesswork. */
function ctrlEntry(x,y,sign,label,col,r,lsz){
  let w;
  if(sign==='stick'){ icoJoystick(x+r*1.3,y,r); w=r*2.6; }
  else { icoButton(x+r,y,r,sign,col); w=r*2; }
  const tx=x+w+r*0.55;
  txt(label,tx,y+lsz*0.36,{size:lsz,weight:800,col,ls:'3px',font:F_MONO});
  return (tx-x)+pixWidth(label,label.length>0?(lsz<=30?0:1):0,3);
}

/* ── THE CAST ───────────────────────────────────────────────────────────── */
/* No timer. A panel waits until the player has actually read it and pressed —
   auto-advancing meant the text moved on while someone was still reading. */
const TYPE_CPS=46;
/* Seconds of actual play between one beat and the next being allowed to fire. The
   first two used to land back to back, which arrived as a wall of text instead of a
   lesson — every condition here is a persistent state, so a gap only ever delays a
   beat, it never skips one. */

/* Blocky comic bubble: stepped corners and a stepped tail, no curves. */
/* A speech box is as wide as what is in it. They were fixed widths picked for the longest
   line any beat might ever have, so every shorter line left a plain of empty paper to its
   right — which reads as a mistake rather than as a margin. */
function bubbleW(lines,size,pad,min,max){
  let w=0;
  for(const l of lines) w=Math.max(w,pixWidth(l,genFor(size),2));
  return clamp(Math.round((w+pad*2)/PIXEL_K)*PIXEL_K,min,max);
}
function drawBubble(x,y,w,h,tailX,down,lines,size,reveal,waiting){
  const b=6;
  ctx.fillStyle=PXC.ink;  ctx.fillRect(x-b,y-b,w+b*2,h+b*2);
  ctx.fillStyle=PXC.paper; ctx.fillRect(x,y,w,h);
  // stepped corners, cut out of both the fill and the border
  [[x,y],[x+w-b*2,y],[x,y+h-b*2],[x+w-b*2,y+h-b*2]].forEach(([cx,cy],i)=>{
    ctx.fillStyle=PXC.ink; ctx.fillRect(cx,cy,b*2,b*2);
    ctx.fillStyle=PXC.paper;
    const dx=(i%2)?0:b, dy=(i<2)?b:0;
    ctx.fillRect(cx+dx,cy+dy,b,b);
  });
  // tail, stepped down toward whoever is speaking
  for(let k=0;k<4;k++){
    const tw=(4-k)*b, ty=down?y+h+k*b:y-b-(k+1)*b;
    ctx.fillStyle=PXC.ink;  ctx.fillRect(tailX-tw/2-b,ty,tw+b*2,b);
    ctx.fillStyle=PXC.paper; ctx.fillRect(tailX-tw/2,ty,tw,b);
  }
  const fs=size||26, lh=fs+12, pad=30, inner=w-pad*2;
  let left=(reveal===undefined)?Infinity:Math.floor(reveal);
  lines.forEach((l,i)=>{
    let show=l;
    if(left!==Infinity){
      show = left<=0 ? '' : (left<l.length ? l.slice(0,left) : l);
      left-=l.length;
    }
    if(show) txt(show,x+pad,y+34+i*lh,
      {size:fs,weight:800,col:PXC.ink,ls:'2px',font:F_MONO,max:inner});
  });
  // the classic cue that the box has finished and is waiting on a button
  if(waiting&&Math.sin(T*6)>0)
    txt('▼',x+w-26,y+h-16,{size:22,weight:800,col:PXC.ink,align:'right',font:F_MONO});
}
